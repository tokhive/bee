tion>`;}).join('')}</div>`;}
  function overview(){const active=contributing().length;const title=s.waiting?'正在完成已有任务':!s.running?'Bee 尚未运行':!s.hive?'等待恢复连接':!bound().length?'Bee 已连接，等待接入账号':!ready().length?'账号授权需要处理':active?'贡献运行正常':'贡献已暂停';const subtitle=s.waiting?'已停止新任务，等待完成后'+(s.waitingFor==='update'?'更新':'退出'):active?'AI 账号已就绪，Bee 正在贡献额度':!s.running?'启动后检查 Hive 连接及账号状态':!s.hive?'恢复连接后，按此前选择继续贡献':!bound().length?'接入 AI 账号后即可开始贡献':!ready().length?'重新检测账号授权后再继续贡献':'恢复后继续接收新任务';return `${heading('概览','',`<span class="br-pill" data-off="${!active}"><span class="br-dot"></span>${s.waiting?'等待任务':active?'贡献中':!s.hive?'离线':!bound().length?'待接入账号':'已暂停'}</span>`)}${connectionNotice()}<section class="br-running" aria-label="贡献状态"><div><div class="br-running-title"><span class="br-emblem">${ic(active?'radio-tower':'pause')}</span><div><h3>${title}</h3><p class="br-small">${subtitle}</p></div></div><div class="br-health"><span>${ic(s.running?'check':'circle-alert')}Bee ${s.running?'运行中':'未运行'}</span><span>${ic(s.hive?'check':'circle-alert')}Hive ${s.hive?'已连接':'未连接'}</span><span>${ic(active?'check':'pause')}${active?'可接收新任务':'暂不接收新任务'}</span></div></div>${primarySupply()}</section><section class="br-finance" aria-label="收益摘要">${metric('今日收益',BigInt(totalIncome('today'))*10000000n,'按实际使用结算')}${metric('收益余额',s.wallet,'可划转至买家余额')}${metric('累计收益',BigInt(totalIncome('total'))*10000000n,'全部已结算收益')}</section>${accountsList()}${!s.owned?`<p class="bp-note">${ic('info')} 当前 Bee 由外部程序管理，退出 App 时会保留运行。</p>`:''}`;}
  function guide(){const step=s.step;const titles=['登录 Hive','绑定本机','接入 AI 账号','开始贡献'];let body='';if(step===0)body=`<h3>先登录你的 Hive 账号</h3><p>连接平台账号后，在这里管理本机 Bee、AI 账号和收益。</p><div class="bp-summarybox"><div class="br-row br-between"><span>当前平台</span><strong>${s.hiveAddress==='official'?'官方 Hive':esc(s.hiveAddress)}</strong></div><span class="br-small">在浏览器完成登录，随后返回 Bee。</span></div><div class="bp-actions">${btn(ic('external-link')+'登录 Hive','login','','br-primary')}</div>`;if(step===1)body=`<h3>${s.scene==='已有 Bee 配置'?'发现已有 Bee 配置':'将本机绑定到你的账号'}</h3><p>${s.scene==='已有 Bee 配置'?'可以复用本机配置，随后重新确认账号与接单条件。':'Bee 已随 App 准备就绪，绑定后即可接入 AI 账号。'}</p><div class="bp-summarybox"><div class="br-row br-between"><span>设备</span><strong>我的电脑 · ${s.os}</strong></div><div class="br-row br-between"><span>配置状态</span><strong>${s.scene==='已有 Bee 配置'?'检测到可复用配置':'尚未绑定'}</strong></div></div><div class="bp-actions">${btn(s.scene==='已有 Bee 配置'?'复用已有配置':'绑定本机','bind','','br-primary')}${btn('其他设备已绑定？','replace-device','','br-quiet')}</div>`;if(step===2)body=`<h3>接入你要贡献额度的 AI 账号</h3><p>优先使用本机官方客户端的已有登录。每个平台最多接入一个账号，可以先接入其中一个。</p>${platforms.map(p=>`<div class="bp-guide-platform"><div><strong>${p}</strong><div class="br-platform-state" data-off="${!s.accounts[p].connected}">${s.accounts[p].connected?'已接入 · 尚未开始贡献':'尚未接入'}</div></div><div class="bp-actions">${s.accounts[p].connected?tag('已接入'):btn('检测已有登录','detect',`data-platform="${p}"`)}${btn('官方授权','authorization',`data-platform="${p}"`,'br-quiet')}</div></div>`).join('')}<div class="bp-actions">${btn('下一步','guide-next',bound().length?'':'disabled','br-primary')}</div>`;if(step===3)body=`<h3>准备就绪，何时开始由你决定</h3><p>开始后，Bee 会在后台贡献已选平台的可用额度。你可以随时暂停。</p><div class="bp-checklist"><div>${ic('check')}本机 Bee 已启动</div><div>${ic('check')}已连接 ${s.hiveAddress==='official'?'官方 Hive':esc(s.hiveAddress)}</div><div>${ic('check')}${bound().join('、')} 账号已接入</div><div>${ic('check')}账号模型与额度已同步</div></div><div class="bp-actions">${btn('开始贡献','guide-start','','br-primary')}${btn('返回选择账号','guide-accounts','','br-quiet')}</div>`;return `<div class="bp-guide-head"><img class="bp-logo" src="${logo}" alt="TokenHive"><div><h2>让 Bee 准备就绪</h2><p class="br-small">完成接入后，在本机轻松管理贡献。</p></div></div><div class="bp-guide-steps" aria-label="接入进度">${titles.map((t,i)=>`<div class="bp-guide-step" ${step===i?'aria-current="step"':''}><span>${i<step?ic('check'):i+1}</span>${t}</div>`).join('')}</div><div class="bp-guide-content">${body}</div>`;}
  function accountsPage(){return `${heading('AI 账号','管理贡献额度的账号与授权',btn(ic('refresh-cw')+'重新检测','redetect'))}${connectionNotice()}<div class="br-accounts-page">${accountsList()}</div><p class="bp-note">${ic('shield-check')} 移除账号只解除 Bee 接入，保留官方客户端登录和历史收益。</p><div class="bp-section bp-panel bp-account-help"><div class="br-row br-between"><div><h3>没有检测到官方客户端登录？</h3><p class="bp-note">先在官方客户端登录，或查看对应平台的授权接入方式。</p></div>${btn('查看接入方式','authorization')}</div></div>`;}
  function earnings(){if(s.sub==='pricing')return pricing();if(s.sub==='transfer')return transfer();if(s.sub==='withdraw')return withdraw();const selected=s.platform==='全部'?platforms:[s.platform];const data=income.OpenAI[s.range].map((_,i)=>s.sampleHistory?selected.reduce((n,p)=>n+income[p][s.range][i],0):0);const sum=data.reduce((a,b)=>a+b,0),max=Math.max(...data,1);const totalAll=s.sampleHistory?platforms.reduce((n,p)=>n+income[p][s.range].reduce((a,b)=>a+b,0),0):0;return `${heading('收益','金额以 USD 计价',btn('报价设置','pricing')+btn('提现','withdraw')+btn(ic('arrow-right-left')+'划转','transfer','','br-primary'))}<section class="br-earnings-summary" aria-label="钱包与收益">${metric('收益余额',s.wallet,'全部平台，可用于划转')}${metric('今日收益',BigInt(totalIncome('today'))*10000000n,'全部平台')}${metric('累计收益',BigInt(totalIncome('total'))*10000000n,'全部平台')}</section><div class="br-filters"><div class="br-segment" aria-label="收益平台">${['全部',...platforms].map(p=>control(p==='全部'?'全部平台':p,'platform',`data-platform="${p}" aria-pressed="${s.platform===p}"`)).join('')}</div><div class="br-segment" aria-label="收益时间范围">${[7,30].map(d=>control('近 '+d+' 天','range',`data-range="${d}" aria-pressed="${s.range===d}"`)).join('')}</div></div><div class="bp-panels"><section class="bp-panel" aria-label="收益趋势"><div class="br-row br-between"><h3>收益趋势</h3><span class="br-tiny">${s.platform==='全部'?'全部平台':s.platform} · USD</span></div><div class="bp-chart-total">${centsMoney(sum)} <span class="br-tiny">近 ${s.range} 天</span></div><div class="bp-trend" role="img" aria-label="近 ${s.range} 天已结算收益 ${centsMoney(sum)}">${data.map((n,i)=>`<div class="bp-trend-col"><span class="bp-trend-bar" style="height:${n/max*100}%" data-tooltip="${s.range===7?'10 月 '+(16+i)+' 日':'第 '+(i+1)+' 个统计区间'}：${centsMoney(n)}"></span></div>`).join('')}</div><div class="bp-axis"><span>${s.range===7?'10 月 16 日':'9 月 23 日'}</span><span>10 月 22 日</span></div></section><section class="bp-panel" aria-label="收益来源"><div class="br-row br-between"><h3>收益来源</h3><span class="br-tiny">近 ${s.range} 天</span></div><div class="bp-chart-total bp-source-total">${centsMoney(sum)}</div>${selected.map(p=>{const n=s.sampleHistory?income[p][s.range].reduce((a,b)=>a+b,0):0;return `<div class="br-source-row"><strong>${p}</strong><div class="br-meter" role="meter" aria-label="${p} 收益占比" aria-valuenow="${totalAll?Math.round(n/totalAll*100):0}" aria-valuemin="0" aria-valuemax="100"><span style="width:${totalAll?n/totalAll*100:0}%"></span></div><span class="br-source-value">${centsMoney(n)}</span></div>`;}).join('')}<p class="bp-note">钱包余额独立于平台和时间筛选。</p></section></div><div class="br-section-heading"><h3>钱包流水</h3>${btn('结算说明','settlement-help','','br-quiet')}</div><div class="bp-tabs">${control('收益结算','ledger',`data-ledger="settlement" aria-pressed="${s.ledger==='settlement'}"`)}${control('划转记录','ledger',`data-ledger="transfer" aria-pressed="${s.ledger==='transfer'}"`)}</div>${ledgerTable()}`;}
  function ledgerTable(){const settlements=s.sampleHistory?[{id:'ST-1022-01',date:'10-22 14:32',amount:'12400000000'},{id:'ST-1021-02',date:'10-21 21:18',amount:'14390000000'},{id:'ST-1020-03',date:'10-20 18:06',amount:'12510000000'},{id:'ST-1019-04',date:'10-19 16:25',amount:'8430000000'}]:[];const rows=s.ledger==='transfer'?s.transfers:settlements;const pages=Math.max(1,Math.ceil(rows.length/2));s.ledgerPage=Math.min(s.ledgerPage,pages);const visible=rows.slice((s.ledgerPage-1)*2,s.ledgerPage*2);return `<p class="br-tiny">全部平台 · ${s.ledger==='transfer'?'划转至本账号买家余额':'只展示收益结算，不包含请求内容'}</p>${rows.length?`<div class="bp-tablewrap"><table class="br-history-table"><thead><tr><th>流水号</th><th>时间</th><th>类型</th><th>金额</th></tr></thead><tbody>${visible.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.date)}</td><td>${s.ledger==='transfer'?'余额划转':'收益结算'}</td><td>${s.ledger==='transfer'?'-':'+'}${dollars(r.amount)}</td></tr>`).join('')}</tbody></table></div><div class="bp-pagination">${btn(ic('chevron-left'),'ledger-prev',`${s.ledgerPage===1?'disabled':''} aria-label="上一页流水"`)}<span>${s.ledgerPage} / ${pages}</span>${btn(ic('chevron-right'),'ledger-next',`${s.ledgerPage===pages?'disabled':''} aria-label="下一页流水"`)}</div>`:`<div class="bp-empty"><h3>暂无${s.ledger==='transfer'?'划转记录':'结算记录'}</h3><p class="br-small">${s.ledger==='transfer'?'完成划转后会显示在这里。':'开始贡献后，可在这里查看已结算收益。'}</p></div>`}`;}
  const back=()=>btn(ic('arrow-left')+'返回收益','earnings','','br-quiet bp-back');
  function pricing(){return `<div class="bp-pricing-page">${back()}${heading('报价设置','选择平台默认报价，或统一设置自己的报价系数')}<div class="bp-quote-current bp-pricing-current"><span>当前已生效</span><strong>${s.quoteMode==='default'?'平台默认报价':'自定义系数 × '+s.quoteFactor.replace(/0+$/,'').replace(/\.$/,'')}</strong><span class="br-tiny">版本 ${s.quoteVersion}</span></div><div class="bp-form"><div class="bp-price-choice"><label class="bp-check"><input type="radio" name="quote-mode" value="default" ${s.quoteDraftMode==='default'?'checked':''}>使用平台默认</label><p>采用平台的模型专属系数；未单独设置时，采用全局默认系数。</p></div><div class="bp-price-choice"><label class="bp-check"><input type="radio" name="quote-mode" value="custom" ${s.quoteDraftMode==='custom'?'checked':''}>自定义报价系数</label><p>一个系数统一应用于全部平台、模型及计费项。</p>${s.quoteDraftMode==='custom'?`<label class="bp-field">报价系数<input name="quote-factor" inputmode="decimal" value="${esc(s.quoteDraftFactor)}" aria-label="报价系数"><span class="br-tiny">大于 0、小于 10，最多 9 位小数。</span></label>`:''}</div><p class="bp-error" role="alert">${esc(quoteError)}</p></div><section class="bp-section"><div class="br-section-heading"><h3>报价预览</h3><span class="br-tiny">当前草稿 · 保存后生效</span></div><div class="bp-tablewrap"><table class="br-history-table"><thead><tr><th>模型 / 输入</th><th>基准价 / 百万 Token</th><th>你的实收 / 百万 Token</th></tr></thead><tbody><tr><td>GPT-5.5</td><td>$2.00</td><td data-price-base="2">${previewPrice('2')}</td></tr><tr><td>Claude Sonnet</td><td>$3.00</td><td data-price-base="3">${previewPrice('3')}</td></tr></tbody></table></div><p class="bp-note">以上为示例基准价。实收单价 = 基准价 × 有效系数；正式接入后使用 Hive 的模型价格及计费项。保存不会修改已接收任务的结算价格。</p></section><div class="bp-actions bp-form-actions">${btn('放弃修改','quote-reset')}${btn('保存报价','quote-save','','br-primary')}</div></div>`;}
  function validFactor(value){return /^(0|[1-9]\d*)(\.\d{1,9})?$/.test(value)&&units(value)>0n&&units(value)<10n*unit;}
  function previewPrice(base){const factor=s.quoteDraftMode==='default'?'0.1':s.quoteDraftFactor;return validFactor(factor)?dollars(units(base)*units(factor)/unit):'—';}
  function transfer(){return `${back()}${heading('划转至买家余额','同一 Hive 账号内的余额划转')}<div class="bp-form"><div class="bp-summarybox"><div class="br-row br-between"><span>可划转收益</span><strong class="bp-available">${dollars(s.wallet)}</strong></div><div class="br-row br-between"><span>买家余额</span><strong>${dollars(s.buyer)}</strong></div><div class="br-row br-between"><span>转入账号</span><strong>Dayong · 当前账号</strong></div></div><div class="bp-field bp-amount-field"><div class="br-row br-between"><label for="bee-transfer-amount">划转金额（USD）</label>${btn('全部收益','transfer-all','','br-quiet')}</div><input id="bee-transfer-amount" name="transfer-amount" aria-describedby="bee-transfer-hint bee-transfer-error" inputmode="decimal" placeholder="输入金额" aria-label="划转金额" value="${esc(pendingTransfer?.value||'')}"><span class="br-tiny" id="bee-transfer-hint">最多 9 位小数，划转完成后不可撤回。</span></div><p class="bp-error" role="alert" id="bee-transfer-error">${esc(transferError)}</p><div class="bp-actions bp-form-actions">${btn('核对划转','transfer-prepare','','br-primary')}</div></div>`;}
  function withdraw(){return `${back()}${heading('提现','将收益转出到外部收款方式')}<div class="bp-form"><div class="bp-summarybox"><div class="br-row br-between"><span>收益余额</span><strong>${dollars(s.wallet)}</strong></div><div class="br-row br-between"><span>收款方式</span><span class="bp-warn">暂未开放</span></div></div><label class="bp-field">提现金额（USD）<input name="withdraw-amount" inputmode="decimal" placeholder="输入金额" aria-label="提现金额"></label><p class="bp-note">收款方式开放后，可在这里填写收款信息。</p><div class="bp-actions bp-gap">${btn('提交提现','withdraw-submit','','br-primary')}</div><p class="bp-error" role="alert" id="bee-withdraw-error"></p></div>`;}
  function diagnostics(){const rows=[['本机 Bee',s.running,s.running?(s.owned?'由 App 管理，进程运行正常':'由外部程序管理，App 退出时保留运行'):'未检测到运行中的 Bee','start-bee'],['Hive 连接',s.hive,s.hive?'连接正常，最近同步：刚刚':'连接断开，最近同步：2 分钟前','reconnect'],['账号授权',bound().length>0&&bound().every(p=>s.accounts[p].authorized),!bound().length?'尚未接入 AI 账号':bound().filter(p=>!s.accounts[p].authorized).length?bound().filter(p=>!s.accounts[p].authorized).join('、')+' 授权已失效':'已接入账号的授权均有效','accounts'],['模型与额度',ready().length>0,ready().length?'已同步就绪账号的模型和额度':'暂无就绪账号，暂不能确认额度','accounts'],['网络代理',true,s.proxyMode==='关闭'?'使用默认网络连接':s.proxyMode+' 代理配置已保存','proxy']];const pass=rows.filter(r=>r[1]).length;return `${heading('诊断','检查连接、账号与本机运行状态',btn(ic('download')+'导出诊断','export')+btn(ic('scan-line')+'一键自检','self-check','','br-primary'))}<div class="bp-quote-current"><span>${pass===5?'所有检查均已通过':5-pass+' 项需要处理'}</span><span class="br-tiny">最近检查：${s.synced==='刚刚'?'刚刚':'尚未检查'}</span></div><div class="bp-tabs">${control('自检','diag-tab','data-tab="check" aria-pressed="'+(s.diagTab==='check')+'"')}${control('运行日志','diag-tab','data-tab="logs" aria-pressed="'+(s.diagTab==='logs')+'"')}</div>${s.diagTab==='check'?rows.map(([title,ok,copy,action])=>`<div class="bp-diagnostic-row" data-fail="${!ok}"><span>${ic(ok?'check':'circle-alert')}</span><div><strong>${title}</strong><p>${copy}</p></div>${ok?tag('通过'):btn(title==='Hive 连接'?'重新连接':'处理',''+action)}</div>`).join(''):`<div class="br-section-heading"><span class="br-small">最近运行信息 · 已脱敏</span><label class="br-small">级别 <select name="log-level" aria-label="日志级别"><option ${s.logLevel==='全部'?'selected':''}>全部</option><option ${s.logLevel==='异常'?'selected':''}>异常</option></select></label></div><pre class="bp-log">${esc(logs())}</pre>${btn('刷新日志','refresh-logs','','bp-gap')}`}<div class="bp-section br-row br-between"><span class="br-small">日志与诊断不包含登录凭证或买家请求内容。</span>${btn('获取帮助','help','','br-quiet')}</div>`;}
  function logs(){const entries=[];if(!s.hive)entries.push('14:32:18  WARN  Hive 连接断开，等待重新连接');if(bound().some(p=>!s.accounts[p].authorized))entries.push('14:32:16  WARN  Claude 账号授权已失效，停止新派发');if(s.logLevel==='全部'){entries.push('14:32:12  INFO  Bee 运行状态：'+(s.running?'运行中':'未运行'));entries.push('14:32:10  INFO  已同步 '+ready().length+' 个就绪平台');entries.push('14:32:08  INFO  已载入本机供给偏好，保留主动暂停设置');}return entries.join('\n')||'当前没有异常日志。';}
  function setting(title,copy,widget){return `<div class="bp-setting"><div><h3>${title}</h3>${copy?`<p>${copy}</p>`:''}</div>${widget}</div>`;}
  function select(name,options,value){return `<select name="${name}" aria-label="${name==='appearance'?'外观':name==='language'?'语言':name}">${options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;}
  function settings(){return `${heading('设置','管理平台、运行偏好与桌面体验')}<section class="bp-settings-group"><h3>平台账号与 Hive</h3>${setting(s.logged?'Dayong':'尚未登录 Hive',s.logged?'已登录 · 贡献者账号':'登录后管理平台账号与收益',s.logged?btn('账号操作','user-menu'):btn('登录 Hive','login'))}${setting(s.hiveAddress==='official'?'官方 Hive':esc(s.hiveAddress),'同一时间连接一个 Hive；切换后需重新登录与绑定。',btn('更改平台','hive-settings'))}${setting('本机 Bee',s.owned?'由 App 启动和管理':'由外部程序管理，退出 App 不停止此进程',btn('设备详情','device'))}</section><section class="bp-settings-group"><h3>运行与网络</h3>${setting('开机启动','启动后保留此前的贡献选择。',`<label class="bp-check"><input type="checkbox" name="auto-start" ${s.autoStart?'checked':''}>启用</label>`)}${setting('关闭主窗口','继续在托盘或菜单栏运行。',btn('查看托盘菜单','tray'))}${setting('网络代理',s.proxyMode==='关闭'?'使用默认网络连接':esc(s.proxyMode)+' · '+esc(s.proxyAddress),btn('配置代理','proxy'))}</section><section class="bp-settings-group"><h3>通知与外观</h3>${setting('系统通知','授权失效、换号、持续离线和额度耗尽；同一问题合并提醒。',`<label class="bp-check"><input type="checkbox" name="notifications" ${s.notifications?'checked':''}>允许通知</label>`)}${setting('外观','选择浅色、深色或跟随系统。',select('appearance',['跟随系统','浅色','深色'],s.appearance))}${setting('语言','默认使用系统语言。',select('language',['跟随系统','简体中文','English'],s.language))}</section><section class="bp-settings-group"><h3>关于与更新</h3>${setting('Bee 桌面客户端','App 预览版 · 内置 Bee · '+s.os,btn('检查更新','update'))}${setting('自动检查版本','发现新版本后提示，由你确认安装。',tag('已开启'))}</section>`;}
  function gated(){return `<div class="bp-empty"><img class="bp-logo" src="${logo}" alt="TokenHive"><h3>${s.logged?'请先完成本机接入':'请先登录 Hive'}</h3><p class="br-small">完成接入后，即可管理 AI 账号和查看收益。</p><div class="bp-actions">${btn('继续接入','overview','','br-primary')}</div></div>`;}
  function mainContent(){if(s.syncing)return `<div class="bp-empty" role="status" aria-live="polite" aria-busy="true">${ic('refresh-cw')}<h3>正在同步 Bee 状态</h3><p class="br-small">连接、账号与收益尚未确认，完成同步后显示。</p>${btn('重试同步','refresh')}</div>`;if(s.exited)return `<div class="bp-empty"><img class="bp-logo" src="${logo}" alt="TokenHive"><h3>App 已退出</h3><p class="br-small">${s.owned?'由 App 管理的 Bee 已停止。':'外部管理的 Bee 继续运行。'}</p><div class="bp-actions">${btn('重新打开','reopen','','br-primary')}</div></div>`;if(!s.onboarded)return s.page==='overview'?guide():s.page==='settings'?settings():gated();if(s.page==='overview')return overview();if(s.page==='accounts')return accountsPage();if(s.page==='earnings')return earnings();if(s.page==='diagnostics')return diagnostics();return settings();}
  function render(){app.style.colorScheme=s.appearance==='跟随系统'?'light dark':s.appearance==='浅色'?'light':'dark';sceneSelect.value=s.scene;const mac=s.os==='macOS';const chrome=mac?`<div class="bp-mac-controls"><button type="button" data-action="hide-window" aria-label="关闭主窗口" class="cursor-interaction"></button><button type="button" data-action="hide-window" aria-label="最小化窗口" class="cursor-interaction"></button><button type="button" data-action="window-info" aria-label="调整窗口" class="cursor-interaction"></button></div>`:`<div class="br-traffic" aria-hidden="true"><span></span><span></span><span></span></div>`;app.innerHTML=`<div class="br-shell"><aside class="br-sidebar">${chrome}<div class="br-brand"><span class="br-brandmark"><img src="${logo}" alt="TokenHive"></span>Bee</div><nav class="br-nav" aria-label="主导航">${labels.map((name,i)=>`<button type="button" class="br-navitem cursor-interaction" data-action="nav" data-page="${pageKeys[i]}" ${s.page===pageKeys[i]?'aria-current="page"':''}>${ic(navIcons[i])}${name}${i===1&&s.logged&&!s.syncing?`<span class="br-count">${bound().length}</span>`:''}</button>`).join('')}</nav><div class="br-side-bottom"><div class="br-side-status"><span class="br-row br-small"><span class="br-dot" ${!s.hive?'style="background:var(--br-muted)"':''}></span>${s.hiveAddress==='official'?'官方 Hive':'自定义 Hive'}</span><span class="br-tiny">${s.syncing?'正在同步状态':!s.logged?'尚未登录':!s.paired?'等待绑定本机':s.hive?'本机 Bee 已连接':'Hive 尚未连接'}</span></div><div class="br-user"><button class="bp-user-button cursor-interaction" type="button" data-action="user-menu" aria-label="打开应用菜单"><span class="br-avatar">${s.logged?'D':ic('user-round')}</span><span><span>${s.logged?'Dayong':'尚未登录'}</span><span class="br-tiny">${s.logged?'贡献者账号':'登录后接入'}</span></span>${ic('chevrons-up-down')}</button></div></div></aside><div class="br-workspace"><header class="br-toolbar"><span class="br-breadcrumb"><span>工作区</span>${ic('chevron-right')}<span>${labels[pageKeys.indexOf(s.page)]}</span></span><div class="br-toolbar-right"><button type="button" class="bp-footer-link br-device cursor-interaction" data-action="device">${ic('monitor')}本机 Bee</button>${btn(ic('refresh-cw'),'refresh','aria-label="刷新状态"','br-quiet br-icon-button')}${!mac?`<div class="bp-window-controls">${btn(ic('minus'),'hide-window','aria-label="最小化窗口"')}${btn(ic('x'),'hide-window','aria-label="关闭主窗口"')}</div>`:''}</div></header><main class="br-body">${mainContent()}<div class="br-bottomline"><span class="br-row">${ic('shield-check')}授权信息保留在本机</span><span>${s.synced}同步</span></div><div class="br-notice" role="status" aria-live="polite" ${message?'':'hidden'}>${esc(message)}</div></main><footer class="br-footer"><button type="button" class="bp-footer-link cursor-interaction" data-action="tray">${s.syncing?'状态同步中':s.waiting?(s.waitingFor==='update'?'等待任务后更新':'等待任务后退出'):s.exited?'App 已退出':s.hive?'Hive 连接正常':'Hive 未连接'}</button><span>交互原型 · 示例数据 · 无真实资金操作</span></footer></div></div><div class="br-modal-layer" hidden></div>`;drawIcons();if(modal)renderModal();}
  function detailRows(rows){return `<dl>${rows.map(([k,v])=>`<div class="br-detailrow"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;}
  function renderModal(){if(!modal)return;let title='',body='',actions='',drawer=false;const p=modal.platform||'OpenAI',a=s.accounts[p];switch(modal.kind){
    case 'detail':drawer=true;title=p+' 账号详情';body=`<p class="bp-note">${esc(a.email||'dayong@example.com')} · ${p==='OpenAI'?'Plus':'Pro'}</p><div class="bp-tabs bp-gap">${control('账号与额度','drawer-tab',`data-tab="quota" aria-pressed="${drawerTab==='quota'}"`)}${control('可用模型','drawer-tab',`data-tab="models" aria-pressed="${drawerTab==='models'}"`)}</div>${drawerTab==='quota'?`${detailRows([['授权状态',a.authorized?'有效':'已失效'],['贡献状态',contributing().includes(p)?'贡献中':a.paused?'已暂停':'暂不可接单'],['5 小时剩余额度',a.authorized?(p==='OpenAI'?'82%':'46%'):'尚未确认'],['窗口重置',a.authorized?(p==='OpenAI'?'2 小时后':'48 分钟后'):'尚未确认'],['每周剩余额度',a.authorized?'68%':'尚未确认'],['每周重置',a.authorized?'4 天后':'尚未确认'],['最近同步',a.authorized?'刚刚':'2 分钟前']])}<div class="bp-actions bp-gap">${btn('重新检测','detect',`data-platform="${p}"`)}${btn('切换账号','switch-account',`data-platform="${p}"`)}</div>`:`<p class="br-small">账号支持与平台开放状态分别展示。</p>${(p==='OpenAI'?[['GPT-5.5','平台已开放'],['GPT-5.4','平台价格未完整']]:[['Claude Sonnet','平台已开放'],['Claude Opus','平台暂未开放']]).map(([name,status])=>`<div class="bp-modelrow"><div class="br-row"><strong>${name}</strong>${tag(status,status==='平台已开放'&&a.authorized)}</div><span class="br-tiny">${a.authorized?(status==='平台已开放'?'账号支持 · 额度已同步':'账号支持 · 当前不可交易'):'授权已失效，需重新确认账号能力'}</span></div>`).join('')}`}<div class="br-details-bottom bp-section">${btn(ic('unlink')+'移除账号','remove',`data-platform="${p}"`,'br-quiet br-danger')}</div>`;break;
    case 'remove':title='移除 '+p+' 账号？';body=`<p class="bp-note">移除后，Bee 不再通过此账号接收新任务。官方客户端登录及历史收益会保留。</p>`;actions=btn('取消','close')+btn('确认移除','remove-confirm',`data-platform="${p}"`,'br-danger');break;
    case 'detect':title='检测到 '+p+' 登录';body=detailRows([['账号',esc(a.email||'dayong@example.com')],['订阅套餐',p==='OpenAI'?'Plus':'Pro'],['授权检查','有效'],['模型与额度','已同步']])+`<p class="bp-note">接入后保持暂停，由你决定何时贡献。</p>`;actions=btn('取消','close')+btn(a.connected?'更新授权':'接入账号','connect',`data-platform="${p}"`,'br-primary');break;
    case 'switch':title='切换 '+p+' 账号？';body=detailRows([['当前账号',esc(a.email||'dayong@example.com')],['新检测账号','another@example.com']])+`<p class="bp-note">确认后更换 Bee 接入的账号，并保持暂停。历史收益继续保留。</p>`;actions=btn('取消','close')+btn('确认切换','switch-confirm',`data-platform="${p}"`,'br-primary');break;
    case 'authorization':title='官方授权接入';body=`<p class="bp-note">可以先在对应官方客户端登录，再返回 Bee 检测已有登录。</p>${detailRows([['OpenAI','优先检测官方客户端登录'],['Claude','优先检测官方客户端登录'],['从 App 发起官方授权','接入方式验证中']])}<p class="bp-note">官方授权入口开放后，将在这里继续授权流程。</p>`;actions=btn('知道了','close','','br-primary');break;
    case 'login':title='在浏览器登录 Hive';body=`<p class="bp-note">在浏览器完成平台登录后，返回这里继续绑定本机。</p>${detailRows([['平台',s.hiveAddress==='official'?'官方 Hive':esc(s.hiveAddress)],['登录状态','等待完成']])}`;actions=btn('取消','close')+btn('登录完成，继续','login-done','','br-primary');break;
    case 'bind':title=s.scene==='已有 Bee 配置'?'复用本机 Bee 配置？':'绑定这台电脑？';body=detailRows([['设备','我的电脑'],['系统',s.os],['运行归属','由 App 管理']])+`<p class="bp-note">绑定成功后，还需要接入 AI 账号并手动开始贡献。</p>`;actions=btn('取消','close')+btn('确认绑定','bind-done','','br-primary');break;
    case 'replace-device':title='替换已绑定的设备？';body=detailRows([['当前设备','另一台电脑'],['最近在线','10 分钟前'],['新设备','我的电脑 · '+s.os]])+`<p class="bp-note">同一账号仅保留一个有效 Bee。替换会先停止旧设备的新派发，并等待已有任务结束。</p>`;actions=btn('取消','close')+btn('等待并替换','replace-confirm','','br-primary');break;
    case 'transfer':title='确认划转';body=`<div class="bp-confirm-amount"><span>划转金额</span><strong>${dollars(pendingTransfer.units)}</strong></div>`+detailRows([['转入账号','Dayong · 当前账号'],['转入位置','买家余额']])+`<p class="bp-note">划转后可用于平台消费，完成后不可撤回。</p>`;actions=btn('返回修改','close')+btn('确认划转','transfer-confirm','','br-primary');break;
    case 'transfer-success':title='划转已完成';body=`<p class="bp-note">${dollars(modal.amount)} 已转入本账号买家余额。</p>${detailRows([['收益余额',dollars(s.wallet)],['买家余额',dollars(s.buyer)]])}`;actions=btn('查看划转记录','transfer-records','','br-primary');break;
    case 'settlement-help':title='收益与结算说明';body=`<p class="bp-note">收益统计使用已结算金额；累计收益与当前余额分别计算。账号移除后，历史收益继续保留。</p><p class="bp-note">各计费项按任务接收时生效的基准价和报价系数结算。后续调价不会追溯改变已接收任务。</p><p class="bp-note">钱包流水仅展示结算与划转记录，不显示买家的身份、请求或逐次模型用量。</p>`;break;
    case 'proxy':title='网络代理';body=`<label class="bp-field">代理类型${select('proxy-mode',['关闭','HTTP','SOCKS5'],s.proxyMode)}</label><label class="bp-field">代理地址<input name="proxy-address" placeholder="http://127.0.0.1:7890" value="${esc(s.proxyAddress)}" aria-label="代理地址"></label><p class="bp-note">仅应用于 Bee 的网络连接。</p><p class="bp-error" role="alert" id="bee-proxy-error"></p>`;actions=btn('取消','close')+btn('保存配置','proxy-save','','br-primary');break;
    case 'hive':title='更改 Hive 平台';body=`<label class="bp-field">平台<select name="hive-mode" aria-label="Hive 平台"><option value="official">官方 Hive</option><option value="custom" ${s.hiveAddress!=='official'?'selected':''}>自定义地址</option></select></label><label class="bp-field">自定义地址<input name="hive-address" placeholder="https://hive.example.com" value="${s.hiveAddress==='official'?'':esc(s.hiveAddress)}" aria-label="Hive 地址"></label><p class="bp-note">切换平台后，需要重新登录、绑定和接入账号。</p><p class="bp-error" role="alert" id="bee-hive-error"></p>`;actions=btn('取消','close')+btn('继续','hive-prepare','','br-primary');break;
    case 'hive-confirm':title='切换 Hive 平台？';body=`<p class="bp-note">即将切换到 ${esc(modal.address==='official'?'官方 Hive':modal.address)}。当前贡献会停止，已有登录及设备绑定不会用于新平台。</p>`;actions=btn('取消','close')+btn('确认切换','hive-confirm',`data-address="${esc(modal.address)}"`,'br-primary');break;
    case 'device':title='本机 Bee';body=detailRows([['设备名称','我的电脑'],['设备标识',s.paired?'bee-local-8f3c':'尚未绑定'],['系统',s.os],['Bee 运行',s.running?'运行中':'未运行'],['Hive 连接',s.hive?'已连接':'未连接'],['运行归属',s.owned?'App 管理':'外部程序管理'],['版本','内置 Bee · 预览示例'],['最近心跳',s.hive?'刚刚':'2 分钟前']]);break;
    case 'user-menu':title='Bee';body=`<p class="bp-note">${s.logged?'Dayong · 当前贡献者账号':'尚未登录 Hive'}</p><div class="bp-menu">${btn(ic('panels-top-left')+'打开主窗口','open-window')}${btn(ic('settings-2')+'设置','settings')}${s.logged?btn(ic('log-out')+'退出平台账号','logout'):btn('登录 Hive','login')}${btn(ic('power')+'退出 App','quit')}</div>`;break;
    case 'tray':title='Bee 后台运行';body=`<p class="bp-note">${contributing().length?'正在贡献 '+contributing().length+' 个平台':s.waiting?'正在等待已有任务结束':'当前暂停贡献'}。关闭主窗口后，Bee 继续在后台运行。</p><div class="bp-menu">${btn(ic('panels-top-left')+'打开主窗口','open-window')}${primarySupply()}${btn(ic('power')+'退出 App','quit')}</div>`;break;
    case 'quit':title='仍有任务进行中';body=`<p class="bp-note">当前还有 ${s.tasks} 个任务，是否等待完成后退出？立即退出可能中断进行中的任务。</p>`;actions=btn('立即退出','quit-now','','br-danger')+btn('等待后退出','quit-wait','','br-primary');break;
    case 'quit-unknown':title='任务状态尚未确认';body=`<p class="bp-note">暂时无法确认是否有进行中任务。刷新状态后再决定是否${modal.purpose==='update'?'安装更新':'退出'}。</p>`;actions=btn('取消','close')+btn('刷新任务状态','refresh-unknown','','br-primary');break;
    case 'update':title='发现新版本';body=detailRows([['当前版本','App 预览版'],['更新内容','稳定性与桌面体验优化']])+`<p class="bp-note">由你确认安装，更新后保留绑定和配置。若有进行中任务，会先等待任务完成。</p>`;actions=btn('稍后','close')+btn('确认安装','update-confirm','','br-primary');break;
    case 'logout':title='退出平台账号？';body=`<p class="bp-note">退出后停止当前平台的贡献。再次使用时需要重新登录。</p>`;actions=btn('取消','close')+btn('确认退出','logout-confirm','','br-danger');break;
    case 'export':title='脱敏诊断报告';body=`<p class="bp-note">已排除登录凭证、账号标识及买家请求内容。可选择下面的内容保存。</p><label class="bp-field">诊断内容<textarea readonly aria-label="诊断内容">${esc('Bee 诊断报告\n系统：'+s.os+'\n运行归属：'+(s.owned?'App':'外部程序')+'\nBee：'+(s.running?'运行中':'未运行')+'\nHive：'+(s.hive?'已连接':'未连接')+'\n就绪平台数：'+ready().length+'\n网络代理：'+s.proxyMode+'\n\n'+logs())}</textarea></label>`;actions=btn('选择报告内容','select-report','','br-primary');break;
    case 'help':title='检查与恢复连接';body=`<div class="bp-checklist"><div>${ic('check')}确认网络及代理能够正常连接</div><div>${ic('check')}在官方客户端检查账号登录是否有效</div><div>${ic('check')}重新检测账号，然后执行一键自检</div></div><p class="bp-note">如仍无法恢复，可导出脱敏诊断报告以便排查。</p>`;actions=btn('查看诊断','diagnostics','','br-primary');break;
    default:title='Bee';body='<p class="bp-note">窗口大小由桌面系统管理。</p>';
  }const layer=app.querySelector('.br-modal-layer');layer.classList.toggle('bp-drawer-layer',drawer);layer.innerHTML=`<section class="br-dialog ${drawer?'bp-drawer':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="br-row br-between"><h3>${title}</h3>${btn(ic('x'),'close','aria-label="关闭弹窗"','br-quiet br-icon-button')}</div>${body}${actions?`<div class="br-dialog-actions">${actions}</div>`:''}</section>`;layer.hidden=false;app.querySelector('.br-shell').inert=true;drawIcons();layer.querySelector('button')?.focus();}
  function quitNow(){message='';s.exited=true;s.waiting=false;if(s.owned){s.running=false;s.hive=false;}modal=null;render();save();}
  function validateAmount(value){if(!/^(0|[1-9]\d{0,14})(\.\d{1,9})?$/.test(value))return '划转金额“'+value+'”格式无效，请输入最多 15 位整数、9 位小数的金额。';if(units(value)<=0n)return '划转金额为 '+value+'，必须大于 0。';if(units(value)>BigInt(s.wallet))return '划转金额 '+value+' USD 超过可用收益 '+decimal(s.wallet)+' USD。';return '';}
  app.addEventListener('input',event=>{if(event.target.name==='transfer-amount'){transferError='';app.querySelector('#bee-transfer-error').textContent='';}if(event.target.name==='quote-factor'){quoteError='';app.querySelector('.bp-pricing-page .bp-error').textContent='';s.quoteDraftFactor=event.target.value;app.querySelectorAll('[data-price-base]').forEach(node=>node.textContent=previewPrice(node.dataset.priceBase));}});
  app.addEventListener('change',event=>{const el=event.target,n=el.name;if(n==='quote-mode'){quoteError='';s.quoteDraftMode=el.value;render();}if(n==='appearance'){s.appearance=el.value;render();}if(n==='language'){s.language=el.value;notice('语言偏好已保存。');}if(n==='auto-start'){s.autoStart=el.checked;notice(s.autoStart?'已开启开机启动。':'已关闭开机启动。');}if(n==='notifications'){s.notifications=el.checked;notice(s.notifications?'已允许系统通知。':'已关闭系统通知。');}if(n==='log-level'){s.logLevel=el.value;render();}save();});
  app.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,p=button.dataset.platform;if(action==='close'){closeModal();return;}if(action==='nav'){modal=null;setPage(button.dataset.page);return;}if(pageKeys.includes(action)){modal=null;setPage(action);return;}if(['pricing','transfer','withdraw'].includes(action)){modal=null;if(action==='pricing'){s.quoteDraftMode=s.quoteMode;s.quoteDraftFactor=s.quoteFactor;}setPage('earnings',action);return;}switch(action){
    case 'all':{const pause=contributing().length>0;ready().forEach(p=>s.accounts[p].paused=pause);s.started=true;modal=null;render();notice(pause?'已暂停新任务，已有任务会继续完成。':'已恢复就绪平台的贡献。');break;}
    case 'toggle':s.accounts[p].paused=!s.accounts[p].paused;s.started=true;render();notice(p+' 已'+(s.accounts[p].paused?'暂停新任务。':'恢复贡献。'));break;
    case 'detail':drawerTab='quota';showModal('detail',{platform:p});break;
    case 'drawer-tab':drawerTab=button.dataset.tab;renderModal();break;
    case 'remove':showModal('remove',{platform:p});break;
    case 'remove-confirm':s.accounts[p]={connected:false,paused:true,authorized:false};modal=null;render();notice(p+' 已移除，历史收益继续保留。');break;
    case 'detect':showModal('detect',{platform:p});break;
    case 'connect':s.accounts[p]={connected:true,paused:true,authorized:true,email:s.accounts[p].email||'dayong@example.com'};modal=null;render();notice(p+' 已接入，保持暂停；可手动开始或恢复贡献。');break;
    case 'switch-account':showModal('switch',{platform:p});break;
    case 'switch-confirm':s.accounts[p]={connected:true,paused:true,authorized:true,email:'another@example.com'};modal=null;render();notice(p+' 已切换至 another@example.com，保持暂停。');break;
    case 'authorization':showModal('authorization',{platform:p});break;
    case 'redetect':notice('已重新检测本机登录，账号接入及主动暂停选择保持不变。');break;
    case 'refresh':s.synced='刚刚';if(s.syncing){s.syncing=false;s.hive=true;s.tasks=0;render();}notice('示例状态已刷新。');break;
    case 'start-bee':s.running=true;s.hive=true;modal=null;render();notice('Bee 已启动，保留此前的主动暂停选择。');break;
    case 'reconnect':s.hive=true;s.running=true;modal=null;render();notice('Hive 连接已恢复，保留此前的主动暂停选择。');break;
    case 'platform':s.platform=button.dataset.platform;render();break;
    case 'range':s.range=Number(button.dataset.range);render();break;
    case 'ledger':s.ledger=button.dataset.ledger;s.ledgerPage=1;render();break;
    case 'ledger-prev':s.ledgerPage--;render();break;
    case 'ledger-next':s.ledgerPage++;render();break;
    case 'transfer-all':{const input=app.querySelector('[name="transfer-amount"]');input.value=decimal(s.wallet);input.dispatchEvent(new Event('input',{bubbles:true}));break;}
    case 'transfer-prepare':{const value=app.querySelector('[name="transfer-amount"]').value.trim();transferError=validateAmount(value);app.querySelector('#bee-transfer-error').textContent=transferError;if(!transferError){pendingTransfer={value,units:units(value).toString()};showModal('transfer');}break;}
    case 'transfer-confirm':{if(!pendingTransfer)break;const amount=pendingTransfer.units;if(BigInt(amount)>BigInt(s.wallet)){closeModal();notice('可用收益已变更，请重新核对金额。');break;}s.wallet=(BigInt(s.wallet)-BigInt(amount)).toString();s.buyer=(BigInt(s.buyer)+BigInt(amount)).toString();s.transfers.unshift({id:'TR-1022-'+String(s.transfers.length+1).padStart(2,'0'),date:'10-22 刚刚',amount});pendingTransfer=null;modal=null;render();showModal('transfer-success',{amount});break;}
    case 'transfer-records':modal=null;s.ledger='transfer';setPage('earnings');break;
    case 'withdraw-submit':app.querySelector('#bee-withdraw-error').textContent='暂不支持提现';break;
    case 'quote-save':{const factor=s.quoteDraftFactor.trim();quoteError=s.quoteDraftMode==='custom'&&!validFactor(factor)?'报价系数“'+factor+'”无效，要求大于 0、小于 10，且最多 9 位小数。':'';if(!quoteError){s.quoteMode=s.quoteDraftMode;s.quoteFactor=s.quoteMode==='default'?'0.100000000':factor;s.quoteVersion++;}render();if(!quoteError)notice('报价已保存，对后续接收的任务生效。');break;}
    case 'quote-reset':s.quoteDraftMode=s.quoteMode;s.quoteDraftFactor=s.quoteFactor;quoteError='';render();break;
    case 'settlement-help':showModal('settlement-help');break;
    case 'diag-tab':s.diagTab=button.dataset.tab;render();break;
    case 'self-check':s.synced='刚刚';render();notice('自检完成，请查看逐项结果。');break;
    case 'refresh-logs':render();notice('运行日志已刷新。');break;
    case 'proxy':showModal('proxy');break;
    case 'proxy-save':{const mode=app.querySelector('[name="proxy-mode"]').value,address=app.querySelector('[name="proxy-address"]').value.trim();if(mode!=='关闭'){try{const u=new URL(address);if(!((mode==='HTTP'&&['http:','https:'].includes(u.protocol))||(mode==='SOCKS5'&&['socks5:','socks5h:'].includes(u.protocol))))throw new Error('protocol');}catch{app.querySelector('#bee-proxy-error').textContent='代理地址不符合 '+mode+' 类型，请检查协议、主机与端口。';break;}}s.proxyMode=mode;s.proxyAddress=mode==='关闭'?'':address;modal=null;render();notice('Bee 网络代理已保存。');break;}
    case 'hive-settings':showModal('hive');break;
    case 'hive-prepare':{const mode=app.querySelector('[name="hive-mode"]').value,address=mode==='official'?'official':app.querySelector('[name="hive-address"]').value.trim();if(address!=='official'){try{const u=new URL(address);if(!['https:','http:'].includes(u.protocol)||u.username||u.password||u.search||u.hash)throw new Error('address');}catch{app.querySelector('#bee-hive-error').textContent='Hive 地址无效，请输入不含账号、查询参数的 HTTP 或 HTTPS 地址。';break;}}if(address===s.hiveAddress){closeModal();break;}showModal('hive-confirm',{address});break;}
    case 'hive-confirm':{const address=button.dataset.address;resetScene('首次接入');s.hiveAddress=address;render();notice('已切换平台，请重新登录 Hive。');break;}
    case 'device':showModal('device');break;
    case 'user-menu':showModal('user-menu');break;
    case 'tray':case 'hide-window':showModal('tray');break;
    case 'open-window':modal=null;render();break;
    case 'window-info':showModal('window');break;
    case 'quit':if(s.tasks===null)showModal('quit-unknown');else if(s.tasks>0)showModal('quit');else quitNow();break;
    case 'quit-now':quitNow();break;
    case 'quit-wait':s.waitingFor='quit';s.waiting=true;modal=null;s.page='overview';render();break;
    case 'cancel-exit':{const purpose=s.waitingFor;s.waiting=false;render();notice('已取消'+(purpose==='update'?'更新':'退出')+'，恢复此前的贡献选择。');break;}
    case 'refresh-tasks':s.tasks=0;if(s.waitingFor==='update'){s.waiting=false;render();notice('示例任务已完成，更新安装流程预览完成；绑定、配置与暂停选择保留。');}else quitNow();break;
    case 'refresh-unknown':{const purpose=modal?.purpose;s.tasks=0;modal=null;render();notice('示例任务状态已确认：当前没有进行中任务，可再次选择'+(purpose==='update'?'更新':'退出')+'。');break;}
    case 'reopen':s.exited=false;s.running=true;s.hive=true;render();notice('Bee 已重新打开，保留贡献偏好。');break;
    case 'update':showModal('update');break;
    case 'update-confirm':if(s.tasks===null){showModal('quit-unknown',{purpose:'update'});}else if(s.tasks>0){s.waitingFor='update';s.waiting=true;modal=null;s.page='overview';render();}else{closeModal();notice('更新安装流程预览完成，绑定与配置保留。');}break;
    case 'logout':showModal('logout');break;
    case 'logout-confirm':resetScene('首次接入');break;
    case 'export':showModal('export');break;
    case 'select-report':app.querySelector('textarea[readonly]').select();break;
    case 'help':showModal('help');break;
    case 'login':showModal('login');break;
    case 'login-done':s.logged=true;s.step=1;modal=null;render();break;
    case 'bind':showModal('bind');break;
    case 'bind-done':case 'replace-confirm':s.paired=true;s.running=true;s.hive=true;s.step=2;modal=null;render();break;
    case 'replace-device':showModal('replace-device');break;
    case 'guide-next':if(bound().length){s.step=3;render();}break;
    case 'guide-accounts':s.step=2;render();break;
    case 'guide-start':if(bound().length&&s.logged&&s.paired){ready().forEach(p=>s.accounts[p].paused=false);s.started=true;s.onboarded=true;s.page='overview';render();notice('已开始贡献，随时可以暂停。');}break;
  }save();});
  app.addEventListener('keydown',event=>{if(!modal)return;const layer=app.querySelector('.br-modal-layer');if(event.key==='Escape'){closeModal();return;}if(event.key!=='Tab')return;const items=[...layer.querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled&&x.getClientRects().length);const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}});
  sceneSelect.addEventListener('change',()=>resetScene(sceneSelect.value));
  render();
  if(globalThis.Tweak){const options={os:s.os};const tweak=new Tweak({container:app,onChange:()=>{s.os=options.os;render();save();}});tweak.addSelect(options,'os',{label:'窗口系统',options:['macOS','Windows','Linux']});}
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent?.silverComplete;if(!incoming)return;const before=JSON.stringify(s);restore(incoming);if(before!==JSON.stringify(s))render();});
})();
</script>
