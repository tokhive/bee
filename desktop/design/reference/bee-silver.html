可划转至买家余额&#x27;)}${metric(&#x27;累计收益&#x27;,BigInt(totalIncome(&#x27;total&#x27;))*10000000n,&#x27;全部已结算收益&#x27;)}&lt;/section&gt;${accountsList()}${!s.owned?`&lt;p class=&quot;bp-note&quot;&gt;${ic(&#x27;info&#x27;)} 当前 Bee 由外部程序管理，退出 App 时会保留运行。&lt;/p&gt;`:&#x27;&#x27;}`;}
  function guide(){const step=s.step;const titles=[&#x27;登录 Hive&#x27;,&#x27;绑定本机&#x27;,&#x27;接入 AI 账号&#x27;,&#x27;开始贡献&#x27;];let body=&#x27;&#x27;;if(step===0)body=`&lt;h3&gt;先登录你的 Hive 账号&lt;/h3&gt;&lt;p&gt;连接平台账号后，在这里管理本机 Bee、AI 账号和收益。&lt;/p&gt;&lt;div class=&quot;bp-summarybox&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;当前平台&lt;/span&gt;&lt;strong&gt;${s.hiveAddress===&#x27;official&#x27;?&#x27;官方 Hive&#x27;:esc(s.hiveAddress)}&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;br-small&quot;&gt;在浏览器完成登录，随后返回 Bee。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-actions&quot;&gt;${btn(ic(&#x27;external-link&#x27;)+&#x27;登录 Hive&#x27;,&#x27;login&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;`;if(step===1)body=`&lt;h3&gt;${s.scene===&#x27;已有 Bee 配置&#x27;?&#x27;发现已有 Bee 配置&#x27;:&#x27;将本机绑定到你的账号&#x27;}&lt;/h3&gt;&lt;p&gt;${s.scene===&#x27;已有 Bee 配置&#x27;?&#x27;可以复用本机配置，随后重新确认账号与接单条件。&#x27;:&#x27;Bee 已随 App 准备就绪，绑定后即可接入 AI 账号。&#x27;}&lt;/p&gt;&lt;div class=&quot;bp-summarybox&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;设备&lt;/span&gt;&lt;strong&gt;我的电脑 · ${s.os}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;配置状态&lt;/span&gt;&lt;strong&gt;${s.scene===&#x27;已有 Bee 配置&#x27;?&#x27;检测到可复用配置&#x27;:&#x27;尚未绑定&#x27;}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-actions&quot;&gt;${btn(s.scene===&#x27;已有 Bee 配置&#x27;?&#x27;复用已有配置&#x27;:&#x27;绑定本机&#x27;,&#x27;bind&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}${btn(&#x27;其他设备已绑定？&#x27;,&#x27;replace-device&#x27;,&#x27;&#x27;,&#x27;br-quiet&#x27;)}&lt;/div&gt;`;if(step===2)body=`&lt;h3&gt;接入你要贡献额度的 AI 账号&lt;/h3&gt;&lt;p&gt;优先使用本机官方客户端的已有登录。每个平台最多接入一个账号，可以先接入其中一个。&lt;/p&gt;${platforms.map(p=&gt;`&lt;div class=&quot;bp-guide-platform&quot;&gt;&lt;div&gt;&lt;strong&gt;${p}&lt;/strong&gt;&lt;div class=&quot;br-platform-state&quot; data-off=&quot;${!s.accounts[p].connected}&quot;&gt;${s.accounts[p].connected?&#x27;已接入 · 尚未开始贡献&#x27;:&#x27;尚未接入&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-actions&quot;&gt;${s.accounts[p].connected?tag(&#x27;已接入&#x27;):btn(&#x27;检测已有登录&#x27;,&#x27;detect&#x27;,`data-platform=&quot;${p}&quot;`)}${btn(&#x27;官方授权&#x27;,&#x27;authorization&#x27;,`data-platform=&quot;${p}&quot;`,&#x27;br-quiet&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;bp-actions&quot;&gt;${btn(&#x27;下一步&#x27;,&#x27;guide-next&#x27;,bound().length?&#x27;&#x27;:&#x27;disabled&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;`;if(step===3)body=`&lt;h3&gt;准备就绪，何时开始由你决定&lt;/h3&gt;&lt;p&gt;开始后，Bee 会在后台贡献已选平台的可用额度。你可以随时暂停。&lt;/p&gt;&lt;div class=&quot;bp-checklist&quot;&gt;&lt;div&gt;${ic(&#x27;check&#x27;)}本机 Bee 已启动&lt;/div&gt;&lt;div&gt;${ic(&#x27;check&#x27;)}已连接 ${s.hiveAddress===&#x27;official&#x27;?&#x27;官方 Hive&#x27;:esc(s.hiveAddress)}&lt;/div&gt;&lt;div&gt;${ic(&#x27;check&#x27;)}${bound().join(&#x27;、&#x27;)} 账号已接入&lt;/div&gt;&lt;div&gt;${ic(&#x27;check&#x27;)}账号模型与额度已同步&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-actions&quot;&gt;${btn(&#x27;开始贡献&#x27;,&#x27;guide-start&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}${btn(&#x27;返回选择账号&#x27;,&#x27;guide-accounts&#x27;,&#x27;&#x27;,&#x27;br-quiet&#x27;)}&lt;/div&gt;`;return `&lt;div class=&quot;bp-guide-head&quot;&gt;&lt;img class=&quot;bp-logo&quot; src=&quot;${logo}&quot; alt=&quot;TokenHive&quot;&gt;&lt;div&gt;&lt;h2&gt;让 Bee 准备就绪&lt;/h2&gt;&lt;p class=&quot;br-small&quot;&gt;完成接入后，在本机轻松管理贡献。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-guide-steps&quot; aria-label=&quot;接入进度&quot;&gt;${titles.map((t,i)=&gt;`&lt;div class=&quot;bp-guide-step&quot; ${step===i?&#x27;aria-current=&quot;step&quot;&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;${i&lt;step?ic(&#x27;check&#x27;):i+1}&lt;/span&gt;${t}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-guide-content&quot;&gt;${body}&lt;/div&gt;`;}
  function accountsPage(){return `${heading(&#x27;AI 账号&#x27;,&#x27;管理贡献额度的账号与授权&#x27;,btn(ic(&#x27;refresh-cw&#x27;)+&#x27;重新检测&#x27;,&#x27;redetect&#x27;))}${connectionNotice()}&lt;div class=&quot;br-accounts-page&quot;&gt;${accountsList()}&lt;/div&gt;&lt;p class=&quot;bp-note&quot;&gt;${ic(&#x27;shield-check&#x27;)} 移除账号只解除 Bee 接入，保留官方客户端登录和历史收益。&lt;/p&gt;&lt;div class=&quot;bp-section bp-panel bp-account-help&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;div&gt;&lt;h3&gt;没有检测到官方客户端登录？&lt;/h3&gt;&lt;p class=&quot;bp-note&quot;&gt;先在官方客户端登录，或查看对应平台的授权接入方式。&lt;/p&gt;&lt;/div&gt;${btn(&#x27;查看接入方式&#x27;,&#x27;authorization&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
  function earnings(){if(s.sub===&#x27;pricing&#x27;)return pricing();if(s.sub===&#x27;transfer&#x27;)return transfer();if(s.sub===&#x27;withdraw&#x27;)return withdraw();const selected=s.platform===&#x27;全部&#x27;?platforms:[s.platform];const data=income.OpenAI[s.range].map((_,i)=&gt;s.sampleHistory?selected.reduce((n,p)=&gt;n+income[p][s.range][i],0):0);const sum=data.reduce((a,b)=&gt;a+b,0),max=Math.max(...data,1);const totalAll=s.sampleHistory?platforms.reduce((n,p)=&gt;n+income[p][s.range].reduce((a,b)=&gt;a+b,0),0):0;return `${heading(&#x27;收益&#x27;,&#x27;金额以 USD 计价&#x27;,btn(&#x27;报价设置&#x27;,&#x27;pricing&#x27;)+btn(&#x27;提现&#x27;,&#x27;withdraw&#x27;)+btn(ic(&#x27;arrow-right-left&#x27;)+&#x27;划转&#x27;,&#x27;transfer&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;))}&lt;section class=&quot;br-earnings-summary&quot; aria-label=&quot;钱包与收益&quot;&gt;${metric(&#x27;收益余额&#x27;,s.wallet,&#x27;全部平台，可用于划转&#x27;)}${metric(&#x27;今日收益&#x27;,BigInt(totalIncome(&#x27;today&#x27;))*10000000n,&#x27;全部平台&#x27;)}${metric(&#x27;累计收益&#x27;,BigInt(totalIncome(&#x27;total&#x27;))*10000000n,&#x27;全部平台&#x27;)}&lt;/section&gt;&lt;div class=&quot;br-filters&quot;&gt;&lt;div class=&quot;br-segment&quot; aria-label=&quot;收益平台&quot;&gt;${[&#x27;全部&#x27;,...platforms].map(p=&gt;control(p===&#x27;全部&#x27;?&#x27;全部平台&#x27;:p,&#x27;platform&#x27;,`data-platform=&quot;${p}&quot; aria-pressed=&quot;${s.platform===p}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;br-segment&quot; aria-label=&quot;收益时间范围&quot;&gt;${[7,30].map(d=&gt;control(&#x27;近 &#x27;+d+&#x27; 天&#x27;,&#x27;range&#x27;,`data-range=&quot;${d}&quot; aria-pressed=&quot;${s.range===d}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-panels&quot;&gt;&lt;section class=&quot;bp-panel&quot; aria-label=&quot;收益趋势&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;h3&gt;收益趋势&lt;/h3&gt;&lt;span class=&quot;br-tiny&quot;&gt;${s.platform===&#x27;全部&#x27;?&#x27;全部平台&#x27;:s.platform} · USD&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-chart-total&quot;&gt;${centsMoney(sum)} &lt;span class=&quot;br-tiny&quot;&gt;近 ${s.range} 天&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-trend&quot; role=&quot;img&quot; aria-label=&quot;近 ${s.range} 天已结算收益 ${centsMoney(sum)}&quot;&gt;${data.map((n,i)=&gt;`&lt;div class=&quot;bp-trend-col&quot;&gt;&lt;span class=&quot;bp-trend-bar&quot; style=&quot;height:${n/max*100}%&quot; data-tooltip=&quot;${s.range===7?&#x27;10 月 &#x27;+(16+i)+&#x27; 日&#x27;:&#x27;第 &#x27;+(i+1)+&#x27; 个统计区间&#x27;}：${centsMoney(n)}&quot;&gt;&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-axis&quot;&gt;&lt;span&gt;${s.range===7?&#x27;10 月 16 日&#x27;:&#x27;9 月 23 日&#x27;}&lt;/span&gt;&lt;span&gt;10 月 22 日&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;bp-panel&quot; aria-label=&quot;收益来源&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;h3&gt;收益来源&lt;/h3&gt;&lt;span class=&quot;br-tiny&quot;&gt;近 ${s.range} 天&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-chart-total bp-source-total&quot;&gt;${centsMoney(sum)}&lt;/div&gt;${selected.map(p=&gt;{const n=s.sampleHistory?income[p][s.range].reduce((a,b)=&gt;a+b,0):0;return `&lt;div class=&quot;br-source-row&quot;&gt;&lt;strong&gt;${p}&lt;/strong&gt;&lt;div class=&quot;br-meter&quot; role=&quot;meter&quot; aria-label=&quot;${p} 收益占比&quot; aria-valuenow=&quot;${totalAll?Math.round(n/totalAll*100):0}&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;&lt;span style=&quot;width:${totalAll?n/totalAll*100:0}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;br-source-value&quot;&gt;${centsMoney(n)}&lt;/span&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;)}&lt;p class=&quot;bp-note&quot;&gt;钱包余额独立于平台和时间筛选。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;br-section-heading&quot;&gt;&lt;h3&gt;钱包流水&lt;/h3&gt;${btn(&#x27;结算说明&#x27;,&#x27;settlement-help&#x27;,&#x27;&#x27;,&#x27;br-quiet&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-tabs&quot;&gt;${control(&#x27;收益结算&#x27;,&#x27;ledger&#x27;,`data-ledger=&quot;settlement&quot; aria-pressed=&quot;${s.ledger===&#x27;settlement&#x27;}&quot;`)}${control(&#x27;划转记录&#x27;,&#x27;ledger&#x27;,`data-ledger=&quot;transfer&quot; aria-pressed=&quot;${s.ledger===&#x27;transfer&#x27;}&quot;`)}&lt;/div&gt;${ledgerTable()}`;}
  function ledgerTable(){const settlements=s.sampleHistory?[{id:&#x27;ST-1022-01&#x27;,date:&#x27;10-22 14:32&#x27;,amount:&#x27;12400000000&#x27;},{id:&#x27;ST-1021-02&#x27;,date:&#x27;10-21 21:18&#x27;,amount:&#x27;14390000000&#x27;},{id:&#x27;ST-1020-03&#x27;,date:&#x27;10-20 18:06&#x27;,amount:&#x27;12510000000&#x27;},{id:&#x27;ST-1019-04&#x27;,date:&#x27;10-19 16:25&#x27;,amount:&#x27;8430000000&#x27;}]:[];const rows=s.ledger===&#x27;transfer&#x27;?s.transfers:settlements;const pages=Math.max(1,Math.ceil(rows.length/2));s.ledgerPage=Math.min(s.ledgerPage,pages);const visible=rows.slice((s.ledgerPage-1)*2,s.ledgerPage*2);return `&lt;p class=&quot;br-tiny&quot;&gt;全部平台 · ${s.ledger===&#x27;transfer&#x27;?&#x27;划转至本账号买家余额&#x27;:&#x27;只展示收益结算，不包含请求内容&#x27;}&lt;/p&gt;${rows.length?`&lt;div class=&quot;bp-tablewrap&quot;&gt;&lt;table class=&quot;br-history-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;流水号&lt;/th&gt;&lt;th&gt;时间&lt;/th&gt;&lt;th&gt;类型&lt;/th&gt;&lt;th&gt;金额&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${visible.map(r=&gt;`&lt;tr&gt;&lt;td&gt;${esc(r.id)}&lt;/td&gt;&lt;td&gt;${esc(r.date)}&lt;/td&gt;&lt;td&gt;${s.ledger===&#x27;transfer&#x27;?&#x27;余额划转&#x27;:&#x27;收益结算&#x27;}&lt;/td&gt;&lt;td&gt;${s.ledger===&#x27;transfer&#x27;?&#x27;-&#x27;:&#x27;+&#x27;}${dollars(r.amount)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;bp-pagination&quot;&gt;${btn(ic(&#x27;chevron-left&#x27;),&#x27;ledger-prev&#x27;,`${s.ledgerPage===1?&#x27;disabled&#x27;:&#x27;&#x27;} aria-label=&quot;上一页流水&quot;`)}&lt;span&gt;${s.ledgerPage} / ${pages}&lt;/span&gt;${btn(ic(&#x27;chevron-right&#x27;),&#x27;ledger-next&#x27;,`${s.ledgerPage===pages?&#x27;disabled&#x27;:&#x27;&#x27;} aria-label=&quot;下一页流水&quot;`)}&lt;/div&gt;`:`&lt;div class=&quot;bp-empty&quot;&gt;&lt;h3&gt;暂无${s.ledger===&#x27;transfer&#x27;?&#x27;划转记录&#x27;:&#x27;结算记录&#x27;}&lt;/h3&gt;&lt;p class=&quot;br-small&quot;&gt;${s.ledger===&#x27;transfer&#x27;?&#x27;完成划转后会显示在这里。&#x27;:&#x27;开始贡献后，可在这里查看已结算收益。&#x27;}&lt;/p&gt;&lt;/div&gt;`}`;}
  const back=()=&gt;btn(ic(&#x27;arrow-left&#x27;)+&#x27;返回收益&#x27;,&#x27;earnings&#x27;,&#x27;&#x27;,&#x27;br-quiet bp-back&#x27;);
  function pricing(){return `&lt;div class=&quot;bp-pricing-page&quot;&gt;${back()}${heading(&#x27;报价设置&#x27;,&#x27;选择平台默认报价，或统一设置自己的报价系数&#x27;)}&lt;div class=&quot;bp-quote-current bp-pricing-current&quot;&gt;&lt;span&gt;当前已生效&lt;/span&gt;&lt;strong&gt;${s.quoteMode===&#x27;default&#x27;?&#x27;平台默认报价&#x27;:&#x27;自定义系数 × &#x27;+s.quoteFactor.replace(/0+$/,&#x27;&#x27;).replace(/\.$/,&#x27;&#x27;)}&lt;/strong&gt;&lt;span class=&quot;br-tiny&quot;&gt;版本 ${s.quoteVersion}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-form&quot;&gt;&lt;div class=&quot;bp-price-choice&quot;&gt;&lt;label class=&quot;bp-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;quote-mode&quot; value=&quot;default&quot; ${s.quoteDraftMode===&#x27;default&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;使用平台默认&lt;/label&gt;&lt;p&gt;采用平台的模型专属系数；未单独设置时，采用全局默认系数。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bp-price-choice&quot;&gt;&lt;label class=&quot;bp-check&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;quote-mode&quot; value=&quot;custom&quot; ${s.quoteDraftMode===&#x27;custom&#x27;?&#x27;checked&#x27;:&#x27;&#x27;}&gt;自定义报价系数&lt;/label&gt;&lt;p&gt;一个系数统一应用于全部平台、模型及计费项。&lt;/p&gt;${s.quoteDraftMode===&#x27;custom&#x27;?`&lt;label class=&quot;bp-field&quot;&gt;报价系数&lt;input name=&quot;quote-factor&quot; inputmode=&quot;decimal&quot; value=&quot;${esc(s.quoteDraftFactor)}&quot; aria-label=&quot;报价系数&quot;&gt;&lt;span class=&quot;br-tiny&quot;&gt;大于 0、小于 10，最多 9 位小数。&lt;/span&gt;&lt;/label&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;p class=&quot;bp-error&quot; role=&quot;alert&quot;&gt;${esc(quoteError)}&lt;/p&gt;&lt;/div&gt;&lt;section class=&quot;bp-section&quot;&gt;&lt;div class=&quot;br-section-heading&quot;&gt;&lt;h3&gt;报价预览&lt;/h3&gt;&lt;span class=&quot;br-tiny&quot;&gt;当前草稿 · 保存后生效&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-tablewrap&quot;&gt;&lt;table class=&quot;br-history-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;模型 / 输入&lt;/th&gt;&lt;th&gt;基准价 / 百万 Token&lt;/th&gt;&lt;th&gt;你的实收 / 百万 Token&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;GPT-5.5&lt;/td&gt;&lt;td&gt;$2.00&lt;/td&gt;&lt;td data-price-base=&quot;2&quot;&gt;${previewPrice(&#x27;2&#x27;)}&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Claude Sonnet&lt;/td&gt;&lt;td&gt;$3.00&lt;/td&gt;&lt;td data-price-base=&quot;3&quot;&gt;${previewPrice(&#x27;3&#x27;)}&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;bp-note&quot;&gt;以上为示例基准价。实收单价 = 基准价 × 有效系数；正式接入后使用 Hive 的模型价格及计费项。保存不会修改已接收任务的结算价格。&lt;/p&gt;&lt;/section&gt;&lt;div class=&quot;bp-actions bp-form-actions&quot;&gt;${btn(&#x27;放弃修改&#x27;,&#x27;quote-reset&#x27;)}${btn(&#x27;保存报价&#x27;,&#x27;quote-save&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
  function validFactor(value){return /^(0|[1-9]\d*)(\.\d{1,9})?$/.test(value)&amp;&amp;units(value)&gt;0n&amp;&amp;units(value)&lt;10n*unit;}
  function previewPrice(base){const factor=s.quoteDraftMode===&#x27;default&#x27;?&#x27;0.1&#x27;:s.quoteDraftFactor;return validFactor(factor)?dollars(units(base)*units(factor)/unit):&#x27;—&#x27;;}
  function transfer(){return `${back()}${heading(&#x27;划转至买家余额&#x27;,&#x27;同一 Hive 账号内的余额划转&#x27;)}&lt;div class=&quot;bp-form&quot;&gt;&lt;div class=&quot;bp-summarybox&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;可划转收益&lt;/span&gt;&lt;strong class=&quot;bp-available&quot;&gt;${dollars(s.wallet)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;买家余额&lt;/span&gt;&lt;strong&gt;${dollars(s.buyer)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;转入账号&lt;/span&gt;&lt;strong&gt;Dayong · 当前账号&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-field bp-amount-field&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;label for=&quot;bee-transfer-amount&quot;&gt;划转金额（USD）&lt;/label&gt;${btn(&#x27;全部收益&#x27;,&#x27;transfer-all&#x27;,&#x27;&#x27;,&#x27;br-quiet&#x27;)}&lt;/div&gt;&lt;input id=&quot;bee-transfer-amount&quot; name=&quot;transfer-amount&quot; aria-describedby=&quot;bee-transfer-hint bee-transfer-error&quot; inputmode=&quot;decimal&quot; placeholder=&quot;输入金额&quot; aria-label=&quot;划转金额&quot; value=&quot;${esc(pendingTransfer?.value||&#x27;&#x27;)}&quot;&gt;&lt;span class=&quot;br-tiny&quot; id=&quot;bee-transfer-hint&quot;&gt;最多 9 位小数，划转完成后不可撤回。&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;bp-error&quot; role=&quot;alert&quot; id=&quot;bee-transfer-error&quot;&gt;${esc(transferError)}&lt;/p&gt;&lt;div class=&quot;bp-actions bp-form-actions&quot;&gt;${btn(&#x27;核对划转&#x27;,&#x27;transfer-prepare&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
  function withdraw(){return `${back()}${heading(&#x27;提现&#x27;,&#x27;将收益转出到外部收款方式&#x27;)}&lt;div class=&quot;bp-form&quot;&gt;&lt;div class=&quot;bp-summarybox&quot;&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;收益余额&lt;/span&gt;&lt;strong&gt;${dollars(s.wallet)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;br-row br-between&quot;&gt;&lt;span&gt;收款方式&lt;/span&gt;&lt;span class=&quot;bp-warn&quot;&gt;暂未开放&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;label class=&quot;bp-field&quot;&gt;提现金额（USD）&lt;input name=&quot;withdraw-amount&quot; inputmode=&quot;decimal&quot; placeholder=&quot;输入金额&quot; aria-label=&quot;提现金额&quot;&gt;&lt;/label&gt;&lt;p class=&quot;bp-note&quot;&gt;收款方式开放后，可在这里填写收款信息。&lt;/p&gt;&lt;div class=&quot;bp-actions bp-gap&quot;&gt;${btn(&#x27;提交提现&#x27;,&#x27;withdraw-submit&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;&lt;p class=&quot;bp-error&quot; role=&quot;alert&quot; id=&quot;bee-withdraw-error&quot;&gt;&lt;/p&gt;&lt;/div&gt;`;}
  function diagnostics(){const rows=[[&#x27;本机 Bee&#x27;,s.running,s.running?(s.owned?&#x27;由 App 管理，进程运行正常&#x27;:&#x27;由外部程序管理，App 退出时保留运行&#x27;):&#x27;未检测到运行中的 Bee&#x27;,&#x27;start-bee&#x27;],[&#x27;Hive 连接&#x27;,s.hive,s.hive?&#x27;连接正常，最近同步：刚刚&#x27;:&#x27;连接断开，最近同步：2 分钟前&#x27;,&#x27;reconnect&#x27;],[&#x27;账号授权&#x27;,bound().length&gt;0&amp;&amp;bound().every(p=&gt;s.accounts[p].authorized),!bound().length?&#x27;尚未接入 AI 账号&#x27;:bound().filter(p=&gt;!s.accounts[p].authorized).length?bound().filter(p=&gt;!s.accounts[p].authorized).join(&#x27;、&#x27;)+&#x27; 授权已失效&#x27;:&#x27;已接入账号的授权均有效&#x27;,&#x27;accounts&#x27;],[&#x27;模型与额度&#x27;,ready().length&gt;0,ready().length?&#x27;已同步就绪账号的模型和额度&#x27;:&#x27;暂无就绪账号，暂不能确认额度&#x27;,&#x27;accounts&#x27;],[&#x27;网络代理&#x27;,true,s.proxyMode===&#x27;关闭&#x27;?&#x27;使用默认网络连接&#x27;:s.proxyMode+&#x27; 代理配置已保存&#x27;,&#x27;proxy&#x27;]];const pass=rows.filter(r=&gt;r[1]).length;return `${heading(&#x27;诊断&#x27;,&#x27;检查连接、账号与本机运行状态&#x27;,btn(ic(&#x27;download&#x27;)+&#x27;导出诊断&#x27;,&#x27;export&#x27;)+btn(ic(&#x27;scan-line&#x27;)+&#x27;一键自检&#x27;,&#x27;self-check&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;))}&lt;div class=&quot;bp-quote-current&quot;&gt;&lt;span&gt;${pass===5?&#x27;所有检查均已通过&#x27;:5-pass+&#x27; 项需要处理&#x27;}&lt;/span&gt;&lt;span class=&quot;br-tiny&quot;&gt;最近检查：${s.synced===&#x27;刚刚&#x27;?&#x27;刚刚&#x27;:&#x27;尚未检查&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-tabs&quot;&gt;${control(&#x27;自检&#x27;,&#x27;diag-tab&#x27;,&#x27;data-tab=&quot;check&quot; aria-pressed=&quot;&#x27;+(s.diagTab===&#x27;check&#x27;)+&#x27;&quot;&#x27;)}${control(&#x27;运行日志&#x27;,&#x27;diag-tab&#x27;,&#x27;data-tab=&quot;logs&quot; aria-pressed=&quot;&#x27;+(s.diagTab===&#x27;logs&#x27;)+&#x27;&quot;&#x27;)}&lt;/div&gt;${s.diagTab===&#x27;check&#x27;?rows.map(([title,ok,copy,action])=&gt;`&lt;div class=&quot;bp-diagnostic-row&quot; data-fail=&quot;${!ok}&quot;&gt;&lt;span&gt;${ic(ok?&#x27;check&#x27;:&#x27;circle-alert&#x27;)}&lt;/span&gt   function logs(){const entries=[];if(!s.hive)entries.push(&#x27;14:32:18  WARN  Hive 连接断开，等待重新连接&#x27;);if(bound().some(p=&gt;!s.accounts[p].authorized))entries.push(&#x27;14:32:16  WARN  Claude 账号授权已失效，停止新派发&#x27;);if(s.logLevel===&#x27;全部&#x27;){entries.push(&#x27;14:32:12  INFO  Bee 运行状态：&#x27;+(s.running?&#x27;运行中&#x27;:&#x27;未运行&#x27;));entries.push(&#x27;14:32:10  INFO  已同步 &#x27;+ready().length+&#x27; 个就绪平台&#x27;);entries.push(&#x27;14:32:08  INFO  已载入本机供给偏好，保留主动暂停设置&#x27;);}return entries.join(&#x27;\n&#x27;)||&#x27;当前没有异常日志。&#x27;;}

  function gated(){return `&lt;div class=&quot;bp-empty&quot;&gt;&lt;img class=&quot;bp-logo&quot; src=&quot;${logo}&quot; alt=&quot;TokenHive&quot;&gt;&lt;h3&gt;${s.logged?&#x27;请先完成本机接入&#x27;:&#x27;请先登录 Hive&#x27;}&lt;/h3&gt;&lt;p class=&quot;br-small&quot;&gt;完成接入后，即可管理 AI 账号和查看收益。&lt;/p&gt;&lt;div class=&quot;bp-actions&quot;&gt;${btn(&#x27;继续接入&#x27;,&#x27;overview&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}

/div&gt;&lt;div class=&quot;br-notice&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; ${message?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;${esc(message)}&lt;/div&gt;&lt;/main&gt;&lt;footer class=&quot;br-footer&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;bp-footer-link cursor-interaction&quot; data-action=&quot;tray&quot;&gt;${s.syncing?&#x27;状态同步中&#x27;:s.waiting?(s.waitingFor===&#x27;update&#x27;?&#x27;等待任务后更新&#x27;:&#x27;等待任务后退出&#x27;):s.exited?&#x27;App 已退出&#x27;:s.hive?&#x27;Hive 连接正常&#x27;:&#x27;Hive 未连接&#x27;}&lt;/button&gt;&lt;span&gt;交互原型 · 示例数据 · 无真实资金操作&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;br-modal-layer&quot; hidden&gt;&lt;/div&gt;`;drawIcons();if(modal)renderModal();}
  function detailRows(rows){return `&lt;dl&gt;${rows.map(([k,v])=&gt;`&lt;div class=&quot;br-detailrow&quot;&gt;&lt;dt&gt;${k}&lt;/dt&gt;&lt;dd&gt;${v}&lt;/dd&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;`;}
  function renderModal(){if(!modal)return;let title=&#x27;&#x27;,body=&#x27;&#x27;,actions=&#x27;&#x27;,drawer=false;const p=modal.platform||&#x27;OpenAI&#x27;,a=s.accounts[p];switch(modal.kind){
    case &#x27;detail&#x27;:drawer=true;title=p+&#x27; 账号详情&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;${esc(a.email||&#x27;dayong@example.com&#x27;)} · ${p===&#x27;OpenAI&#x27;?&#x27;Plus&#x27;:&#x27;Pro&#x27;}&lt;/p&gt;&lt;div class=&quot;bp-tabs bp-gap&quot;&gt;${control(&#x27;账号与额度&#x27;,&#x27;drawer-tab&#x27;,`data-tab=&quot;quota&quot; aria-pressed=&quot;${drawerTab===&#x27;quota&#x27;}&quot;`)}${control(&#x27;可用模型&#x27;,&#x27;drawer-tab&#x27;,`data-tab=&quot;models&quot; aria-pressed=&quot;${drawerTab===&#x27;models&#x27;}&quot;`)}&lt;/div&gt;${drawerTab===&#x27;quota&#x27;?`${detailRows([[&#x27;授权状态&#x27;,a.authorized?&#x27;有效&#x27;:&#x27;已失效&#x27;],[&#x27;贡献状态&#x27;,contributing().includes(p)?&#x27;贡献中&#x27;:a.paused?&#x27;已暂停&#x27;:&#x27;暂不可接单&#x27;],[&#x27;5 小时剩余额度&#x27;,a.authorized?(p===&#x27;OpenAI&#x27;?&#x27;82%&#x27;:&#x27;46%&#x27;):&#x27;尚未确认&#x27;],[&#x27;窗口重置&#x27;,a.authorized?(p===&#x27;OpenAI&#x27;?&#x27;2 小时后&#x27;:&#x27;48 分钟后&#x27;):&#x27;尚未确认&#x27;],[&#x27;每周剩余额度&#x27;,a.authorized?&#x27;68%&#x27;:&#x27;尚未确认&#x27;],[&#x27;每周重置&#x27;,a.authorized?&#x27;4 天后&#x27;:&#x27;尚未确认&#x27;],[&#x27;最近同步&#x27;,a.authorized?&#x27;刚刚&#x27;:&#x27;2 分钟前&#x27;]])}&lt;div class=&quot;bp-actions bp-gap&quot;&gt;${btn(&#x27;重新检测&#x27;,&#x27;detect&#x27;,`data-platform=&quot;${p}&quot;`)}${btn(&#x27;切换账号&#x27;,&#x27;switch-account&#x27;,`data-platform=&quot;${p}&quot;`)}&lt;/div&gt;`:`&lt;p class=&quot;br-small&quot;&gt;账号支持与平台开放状态分别展示。&lt;/p&gt;${(p===&#x27;OpenAI&#x27;?[[&#x27;GPT-5.5&#x27;,&#x27;平台已开放&#x27;],[&#x27;GPT-5.4&#x27;,&#x27;平台价格未完整&#x27;]]:[[&#x27;Claude Sonnet&#x27;,&#x27;平台已开放&#x27;],[&#x27;Claude Opus&#x27;,&#x27;平台暂未开放&#x27;]]).map(([name,status])=&gt;`&lt;div class=&quot;bp-modelrow&quot;&gt;&lt;div class=&quot;br-row&quot;&gt;&lt;strong&gt;${name}&lt;/strong&gt;${tag(status,status===&#x27;平台已开放&#x27;&amp;&amp;a.authorized)}&lt;/div&gt;&lt;span class=&quot;br-tiny&quot;&gt;${a.authorized?(status===&#x27;平台已开放&#x27;?&#x27;账号支持 · 额度已同步&#x27;:&#x27;账号支持 · 当前不可交易&#x27;):&#x27;授权已失效，需重新确认账号能力&#x27;}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}`}&lt;div class=&quot;br-details-bottom bp-section&quot;&gt;${btn(ic(&#x27;unlink&#x27;)+&#x27;移除账号&#x27;,&#x27;remove&#x27;,`data-platform=&quot;${p}&quot;`,&#x27;br-quiet br-danger&#x27;)}&lt;/div&gt;`;break;
    case &#x27;remove&#x27;:title=&#x27;移除 &#x27;+p+&#x27; 账号？&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;移除后，Bee 不再通过此账号接收新任务。官方客户端登录及历史收益会保留。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;确认移除&#x27;,&#x27;remove-confirm&#x27;,`data-platform=&quot;${p}&quot;`,&#x27;br-danger&#x27;);break;
    case &#x27;detect&#x27;:title=&#x27;检测到 &#x27;+p+&#x27; 登录&#x27;;body=detailRows([[&#x27;账号&#x27;,esc(a.email||&#x27;dayong@example.com&#x27;)],[&#x27;订阅套餐&#x27;,p===&#x27;OpenAI&#x27;?&#x27;Plus&#x27;:&#x27;Pro&#x27;],[&#x27;授权检查&#x27;,&#x27;有效&#x27;],[&#x27;模型与额度&#x27;,&#x27;已同步&#x27;]])+`&lt;p class=&quot;bp-note&quot;&gt;接入后保持暂停，由你决定何时贡献。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(a.connected?&#x27;更新授权&#x27;:&#x27;接入账号&#x27;,&#x27;connect&#x27;,`data-platform=&quot;${p}&quot;`,&#x27;br-primary&#x27;);break;
    case &#x27;switch&#x27;:title=&#x27;切换 &#x27;+p+&#x27; 账号？&#x27;;body=detailRows([[&#x27;当前账号&#x27;,esc(a.email||&#x27;dayong@example.com&#x27;)],[&#x27;新检测账号&#x27;,&#x27;another@example.com&#x27;]])+`&lt;p class=&quot;bp-note&quot;&gt;确认后更换 Bee 接入的账号，并保持暂停。历史收益继续保留。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;确认切换&#x27;,&#x27;switch-confirm&#x27;,`data-platform=&quot;${p}&quot;`,&#x27;br-primary&#x27;);break;
    case &#x27;authorization&#x27;:title=&#x27;官方授权接入&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;可以先在对应官方客户端登录，再返回 Bee 检测已有登录。&lt;/p&gt;${detailRows([[&#x27;OpenAI&#x27;,&#x27;优先检测官方客户端登录&#x27;],[&#x27;Claude&#x27;,&#x27;优先检测官方客户端登录&#x27;],[&#x27;从 App 发起官方授权&#x27;,&#x27;接入方式验证中&#x27;]])}&lt;p class=&quot;bp-note&quot;&gt;官方授权入口开放后，将在这里继续授权流程。&lt;/p&gt;`;actions=btn(&#x27;知道了&#x27;,&#x27;close&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;login&#x27;:title=&#x27;在浏览器登录 Hive&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;在浏览器完成平台登录后，返回这里继续绑定本机。&lt;/p&gt;${detailRows([[&#x27;平台&#x27;,s.hiveAddress===&#x27;official&#x27;?&#x27;官方 Hive&#x27;:esc(s.hiveAddress)],[&#x27;登录状态&#x27;,&#x27;等待完成&#x27;]])}`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;登录完成，继续&#x27;,&#x27;login-done&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;bind&#x27;:title=s.scene===&#x27;已有 Bee 配置&#x27;?&#x27;复用本机 Bee 配置？&#x27;:&#x27;绑定这台电脑？&#x27;;body=detailRows([[&#x27;设备&#x27;,&#x27;我的电脑&#x27;],[&#x27;系统&#x27;,s.os],[&#x27;运行归属&#x27;,&#x27;由 App 管理&#x27;]])+`&lt;p class=&quot;bp-note&quot;&gt;绑定成功后，还需要接入 AI 账号并手动开始贡献。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;确认绑定&#x27;,&#x27;bind-done&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;replace-device&#x27;:title=&#x27;替换已绑定的设备？&#x27;;body=detailRows([[&#x27;当前设备&#x27;,&#x27;另一台电脑&#x27;],[&#x27;最近在线&#x27;,&#x27;10 分钟前&#x27;],[&#x27;新设备&#x27;,&#x27;我的电脑 · &#x27;+s.os]])+`&lt;p class=&quot;bp-note&quot;&gt;同一账号仅保留一个有效 Bee。替换会先停止旧设备的新派发，并等待已有任务结束。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;等待并替换&#x27;,&#x27;replace-confirm&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;transfer&#x27;:title=&#x27;确认划转&#x27;;body=`&lt;div class=&quot;bp-confirm-amount&quot;&gt;&lt;span&gt;划转金额&lt;/span&gt;&lt;strong&gt;${dollars(pendingTransfer.units)}&lt;/strong&gt;&lt;/div&gt;`+detailRows([[&#x27;转入账号&#x27;,&#x27;Dayong · 当前账号&#x27;],[&#x27;转入位置&#x27;,&#x27;买家余额&#x27;]])+`&lt;p class=&quot;bp-note&quot;&gt;划转后可用于平台消费，完成后不可撤回。&lt;/p&gt;`;actions=btn(&#x27;返回修改&#x27;,&#x27;close&#x27;)+btn(&#x27;确认划转&#x27;,&#x27;transfer-confirm&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;transfer-success&#x27;:title=&#x27;划转已完成&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;${dollars(modal.amount)} 已转入本账号买家余额。&lt;/p&gt;${detailRows([[&#x27;收益余额&#x27;,dollars(s.wallet)],[&#x27;买家余额&#x27;,dollars(s.buyer)]])}`;actions=btn(&#x27;查看划转记录&#x27;,&#x27;transfer-records&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;settlement-help&#x27;:title=&#x27;收益与结算说明&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;收益统计使用已结算金额；累计收益与当前余额分别计算。账号移除后，历史收益继续保留。&lt;/p&gt;&lt;p class=&quot;bp-note&quot;&gt;各计费项按任务接收时生效的基准价和报价系数结算。后续调价不会追溯改变已接收任务。&lt;/p&gt;&lt;p class=&quot;bp-note&quot;&gt;钱包流水仅展示结算与划转记录，不显示买家的身份、请求或逐次模型用量。&lt;/p&gt;`;break;
    case &#x27;proxy&#x27;:title=&#x27;网络代理&#x27;;body=`&lt;label class=&quot;bp-field&quot;&gt;代理类型${select(&#x27;proxy-mode&#x27;,[&#x27;关闭&#x27;,&#x27;HTTP&#x27;,&#x27;SOCKS5&#x27;],s.proxyMode)}&lt;/label&gt;&lt;label class=&quot;bp-field&quot;&gt;代理地址&lt;input name=&quot;proxy-address&quot; placeholder=&quot;http://127.0.0.1:7890&quot; value=&quot;${esc(s.proxyAddress)}&quot; aria-label=&quot;代理地址&quot;&gt;&lt;/label&gt;&lt;p class=&quot;bp-note&quot;&gt;仅应用于 Bee 的网络连接。&lt;/p&gt;&lt;p class=&quot;bp-error&quot; role=&quot;alert&quot; id=&quot;bee-proxy-error&quot;&gt;&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;保存配置&#x27;,&#x27;proxy-save&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;hive&#x27;:title=&#x27;更改 Hive 平台&#x27;;body=`&lt;label class=&quot;bp-field&quot;&gt;平台&lt;select name=&quot;hive-mode&quot; aria-label=&quot;Hive 平台&quot;&gt;&lt;option value=&quot;official&quot;&gt;官方 Hive&lt;/option&gt;&lt;option value=&quot;custom&quot; ${s.hiveAddress!==&#x27;official&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;自定义地址&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;bp-field&quot;&gt;自定义地址&lt;input name=&quot;hive-address&quot; placeholder=&quot;https://hive.example.com&quot; value=&quot;${s.hiveAddress===&#x27;official&#x27;?&#x27;&#x27;:esc(s.hiveAddress)}&quot; aria-label=&quot;Hive 地址&quot;&gt;&lt;/label&gt;&lt;p class=&quot;bp-note&quot;&gt;切换平台后，需要重新登录、绑定和接入账号。&lt;/p&gt;&lt;p class=&quot;bp-error&quot; role=&quot;alert&quot; id=&quot;bee-hive-error&quot;&gt;&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;继续&#x27;,&#x27;hive-prepare&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;hive-confirm&#x27;:title=&#x27;切换 Hive 平台？&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;即将切换到 ${esc(modal.address===&#x27;official&#x27;?&#x27;官方 Hive&#x27;:modal.address)}。当前贡献会停止，已有登录及设备绑定不会用于新平台。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;确认切换&#x27;,&#x27;hive-confirm&#x27;,`data-address=&quot;${esc(modal.address)}&quot;`,&#x27;br-primary&#x27;);break;
    case &#x27;device&#x27;:title=&#x27;本机 Bee&#x27;;body=detailRows([[&#x27;设备名称&#x27;,&#x27;我的电脑&#x27;],[&#x27;设备标识&#x27;,s.paired?&#x27;bee-local-8f3c&#x27;:&#x27;尚未绑定&#x27;],[&#x27;系统&#x27;,s.os],[&#x27;Bee 运行&#x27;,s.running?&#x27;运行中&#x27;:&#x27;未运行&#x27;],[&#x27;Hive 连接&#x27;,s.hive?&#x27;已连接&#x27;:&#x27;未连接&#x27;],[&#x27;运行归属&#x27;,s.owned?&#x27;App 管理&#x27;:&#x27;外部程序管理&#x27;],[&#x27;版本&#x27;,&#x27;内置 Bee · 预览示例&#x27;],[&#x27;最近心跳&#x27;,s.hive?&#x27;刚刚&#x27;:&#x27;2 分钟前&#x27;]]);break;
    case &#x27;user-menu&#x27;:title=&#x27;Bee&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;${s.logged?&#x27;Dayong · 当前贡献者账号&#x27;:&#x27;尚未登录 Hive&#x27;}&lt;/p&gt;&lt;div class=&quot;bp-menu&quot;&gt;${btn(ic(&#x27;panels-top-left&#x27;)+&#x27;打开主窗口&#x27;,&#x27;open-window&#x27;)}${btn(ic(&#x27;settings-2&#x27;)+&#x27;设置&#x27;,&#x27;settings&#x27;)}${s.logged?btn(ic(&#x27;log-out&#x27;)+&#x27;退出平台账号&#x27;,&#x27;logout&#x27;):btn(&#x27;登录 Hive&#x27;,&#x27;login&#x27;)}${btn(ic(&#x27;power&#x27;)+&#x27;退出 App&#x27;,&#x27;quit&#x27;)}&lt;/div&gt;`;break;
    case &#x27;tray&#x27;:title=&#x27;Bee 后台运行&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;${contributing().length?&#x27;正在贡献 &#x27;+contributing().length+&#x27; 个平台&#x27;:s.waiting?&#x27;正在等待已有任务结束&#x27;:&#x27;当前暂停贡献&#x27;}。关闭主窗口后，Bee 继续在后台运行。&lt;/p&gt;&lt;div class=&quot;bp-menu&quot;&gt;${btn(ic(&#x27;panels-top-left&#x27;)+&#x27;打开主窗口&#x27;,&#x27;open-window&#x27;)}${primarySupply()}${btn(ic(&#x27;power&#x27;)+&#x27;退出 App&#x27;,&#x27;quit&#x27;)}&lt;/div&gt;`;break;
    case &#x27;quit&#x27;:title=&#x27;仍有任务进行中&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;当前还有 ${s.tasks} 个任务，是否等待完成后退出？立即退出可能中断进行中的任务。&lt;/p&gt;`;actions=btn(&#x27;立即退出&#x27;,&#x27;quit-now&#x27;,&#x27;&#x27;,&#x27;br-danger&#x27;)+btn(&#x27;等待后退出&#x27;,&#x27;quit-wait&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;quit-unknown&#x27;:title=&#x27;任务状态尚未确认&#x27;;body=`&lt;p class=&quot;bp-note&quot;&gt;暂时无法确认是否有进行中任务。刷新状态后再决定是否${modal.purpose===&#x27;update&#x27;?&#x27;安装更新&#x27;:&#x27;退出&#x27;}。&lt;/p&gt;`;actions=btn(&#x27;取消&#x27;,&#x27;close&#x27;)+btn(&#x27;刷新任务状态&#x27;,&#x27;refresh-unknown&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
    case &#x27;update&#x27;:title=&#x27;发现新版本&#x27;;body=detailRows([[&#x27;当前版本&#x27;,&#x27;App 预览版&#x27;],[&#x27;更新内容&#x27;,&#x27;稳定性与桌面体验优化&#x27;]])+`&lt;p class=&quot;bp-note&quot;&gt;由你确认安装，更新后保留绑定和配置。若有进行中任务，会先等待任务完成。&lt;/p&gt;`;actions=btn(&#x27;稍后&#x27;,&#x27;close&#x27;)+btn(&#x27;确认安装&#x27;,&#x27;update-confirm&#x27;,&#x27;&#x27;,&#x27;br-primary&#x27;);break;
