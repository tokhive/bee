[package]
name = "bee-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "bee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dependencies]
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance", version = "=2.5.4" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dev-dependencies]
zbus = "=5.19.0"
