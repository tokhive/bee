const iconPaths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',accounts:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/>',pulse:'<path d="M2 12h4l3-8 5 16 3-8h5"/>',settings:'<path d="m12 3 2 3 3-1 2 3-2 3 2 3-2 3-3-1-2 3-3-2-3 1-2-3 2-3-2-3 2-3 3 1z"/><circle cx="11" cy="11" r="3"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',check:'<path d="m5 12 4 4L19 6"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 4v.1"/>',link:'<path d="m10 13 4-4M8 15l-2 2a3 3 0 0 1-4-4l4-4a3 3 0 0 1 4 0m4 6a3 3 0 0 0 4 0l4-4a3 3 0 0 0-4-4l-2 2"/>',unlink:'<path d="m2 2 20 20M10 7l2-2a5 5 0 0 1 7 7l-1 1M6 10l-1 1a5 5 0 0 0 7 7l2-2M3 3l18 18"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5m-3-5a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2"/>',arrow:'<path d="m9 5 7 7-7 7"/>',external:'<path d="M15 3h6v6m0-6L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 4 12 8-12 8z"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-6 4-6 14 0 18 6-4 6-14 0-18Z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[n]||iconPaths.info}</svg>`;
const btn=(text,action,primary=false,icon='')=>`<button class="btn ${primary?'primary':''}" data-action="${action}">${icon?ic(icon):''}${text}</button>`;
const badge=(text,tone='')=>`<span class="pill ${tone}"><span class="dot"></span>${text}</span>`;
const names={1:['清晰分区','沿用现有阅读顺序，集中解释状态与原因，保持紧凑。'],2:['行动优先','让当前问题和下一步成为视觉中心，设备事实收在侧边。'],3:['平台优先','共享连接状态集中说明，各平台的额度与操作独立展开。']};
let params=new URLSearchParams(location.search),variant=Number(params.get('variant'))||1,state=params.get('state')||'disconnected',page=state==='empty'?'accounts':'overview',returnPage='overview',subTab='network';let paused=false,claudePaused=true,loginFound=false,diagRan=false;
if(!names[variant])variant=1;if(!['disconnected','ready','pairing','empty','device-error','stopped'].includes(state))state='disconnected';
if(params.has('capture'))document.body.classList.add('capture');
const isDisconnected=()=>state==='disconnected',isPairing=()=>state==='pairing',isReady=()=>state==='ready';
function platformHeader(p){const claude=p==='claude';return `<div class="platform"><span class="platform-mark ${claude?'claude':''}" aria-hidden="true">${claude?'C':'O'}</span><div><div class="platform-name">${claude?'Claude':'OpenAI'} <span class="plan">${claude?'Pro':'Plus'}</span></div><small>demo@example.com</small></div></div>`}
function quotas(p){const stale=isDisconnected()||state==='device-error',claude=p==='claude',used=claude?18:32,week=claude?41:57;return `<div class="${stale?'quota-stale':''}"><div class="quota-label"><span>5 小时额度</span><strong>已用 ${used}%</strong></div><div class="bar"><i style="width:${used}%"></i></div><div class="quota-label"><span>每周额度</span><strong>已用 ${week}%</strong></div><div class="bar"><i style="width:${week}%"></i></div><div class="quota-foot">${stale?'上次确认 14:30，当前待核对':claude?'5 小时额度于 17:00 重置':'5 小时额度于 16:00 重置'}</div></div>`}
function platformStatus(p){const pause=p==='claude'?claudePaused:paused;if(pause)return ['已暂停接单','', isDisconnected()?'连接恢复后仍保持暂停。':isReady()?'可按需恢复接单。':'恢复前需先确认连接状态。'];if(isDisconnected())return ['等待连接恢复','','连接恢复前，暂不能接收新任务。'];if(state==='device-error')return ['接单状态待确认','','需先确认本机设备与 Hive 的绑定。'];return ['可接单','ready','符合接收新任务的条件。']}
function platformAction(p){const pause=p==='claude'?claudePaused:paused;if(isDisconnected()||state==='device-error')return `<span class="quiet-note">${pause?'恢复接单需先连接 Hive':'连接恢复后自动核对'}</span>${btn('账号详情','account:'+p,false)}`;return btn(pause?'恢复接单':'暂停接单','pause:'+p,false,pause?'play':'pause')}
function accounts(mode='rows'){return `${mode!=='none'?`<div class="section-head"><h2>AI 账号 <span class="muted" style="font-weight:400;margin-left:6px">已接入 2 个</span></h2><button class="btn quiet" data-action="accounts">管理账号 ${ic('arrow')}</button></div>`:''}${mode==='cards'?`<div class="platform-grid">${['openai','claude'].map(p=>{const s=platformStatus(p);return `<article class="platform-card"><div class="card-top">${platformHeader(p)}${badge('已接入')}</div><div class="card-state ${s[1]==='ready'?'good-text':''}">${ic(s[1]==='ready'?'check':p==='claude'?'pause':'clock')}${s[0]}</div><p class="card-note">${s[2]}</p><div class="card-quota">${quotas(p)}</div><div class="actions">${platformAction(p)}</div></article>`}).join('')}</div>`:`<div class="account-list">${['openai','claude'].map(p=>{const s=platformStatus(p);return `<article class="account-row"><div>${platformHeader(p)}<div class="account-state ${s[1]}">${ic(s[1]==='ready'?'check':p==='claude'?'pause':'clock')}${s[0]}</div></div><div>${quotas(p)}${isReady()?`<div class="actions" style="margin-top:12px">${platformAction(p)}</div>`:""}</div><div class="row-action">${isReady()?btn("账号详情","account:"+p):platformAction(p)}</div></article>`}).join('')}</div>`}`}
function facts(vertical=false){if(vertical)return `<aside class="context-panel"><h3>当前设备与连接</h3><div class="context-row"><small>本机运行</small><strong>${ic('pulse')}Bee 正在运行</strong></div><div class="context-row"><small>Hive 连接</small><strong class="${isReady()?'good-text':'warn-text'}">${ic(isReady()?'check':'refresh')}${isReady()?'已连接':'正在重连'}</strong><p class="quiet-note">hive.example.com</p></div><div class="context-row"><small>设备</small><strong>MacBook Pro</strong><p class="quiet-note">已绑定至演示账号</p></div>${btn('停止贡献','stop',false,'stop')}</aside>`;return `<div class="facts"><div class="fact"><small>本机运行</small><strong>${ic('pulse')}Bee 正在运行</strong></div><div class="fact"><small>Hive 连接</small><strong class="${isReady()?'good-text':'warn-text'}">${ic(isReady()?'check':'refresh')}${isReady()?'已连接':'正在重连'}</strong></div><div class="fact"><small>本机设备</small><strong>${ic('monitor')}MacBook Pro</strong></div></div>`}
function rawDetails(){return `<details><summary>查看技术详情</summary><pre class="evidence">连接 Hive 的请求失败\nGET wss://hive.example.com/api/bee/agent\nHTTP 503 · Service Unavailable\n发生时间：2026-11-01 14:32:50\n下一次尝试：14:33:00</pre></details>`}
function notice(){return `<div class="notice"><div class="notice-title">${ic('alert')}Hive 返回服务暂不可用（HTTP 503）</div><p>暂时无法接收新任务。已有请求可能中断；Bee 正在尝试恢复连接。</p><div class="notice-bottom"><span class="retry">${ic('refresh')}下一次连接尝试：14:33:00</span><div class="actions">${btn('查看连接检查','diagnostics',true)}${btn('错误详情','error')}</div></div></div>`}
function steps(){return `<div class="steps" aria-label="准备步骤"><span class="step active"><b>1</b>绑定设备</span>${ic('arrow')}<span class="step"><b>2</b>接入账号</span>${ic('arrow')}<span class="step"><b>3</b>开始贡献</span>${ic('arrow')}<span class="step"><b>4</b>开启接单</span></div>`}
function pairPanel(){return `<section class="pairing-panel"><div class="title-group"><span class="icon-tile">${ic('shield')}</span><div><h2>请在 Hive 网页确认设备归属</h2><p>正在绑定 MacBook Pro</p></div></div><p class="pairing-copy">打开确认网页，登录 Hive 后确认这台设备。完成后 Bee 会自动核对。</p><div class="pairing-content"><div><div class="code-label">配对码</div><div class="pair-code">QRTW-KJNV</div><p class="expiry">剩余 8 分 42 秒 · 14:42 到期</p></div><div class="pairing-actions">${btn('打开 Hive 确认网页','pair-open',true,'external')}${btn('复制配对码','copy-code',false,'copy')}</div></div><div class="pairing-url"><span>hive.example.com/devices/pair</span><button class="btn quiet" data-action="copy-url">${ic('copy')}复制确认网址</button></div></section>`}
function nextHint(){return `<div class="next-hint"><span class="icon-tile">${ic('accounts')}</span><div><h3>接下来：接入 AI 账号</h3><p>设备确认后，选择本机的 OpenAI 或 Claude 登录。</p></div><button class="btn quiet push" data-action="accounts">查看 AI 账号 ${ic('arrow')}</button></div>`}
function pairing(){if(variant===2)return `${steps()}<div class="action-layout"><div class="action-panel">${pairPanel()}</div><aside class="context-panel"><h3>准备进度</h3><div class="context-row"><small>当前步骤</small><strong>等待网页确认</strong></div><div class="context-row"><small>完成后</small><strong>接入 AI 账号</strong><p class="quiet-note">绑定设备不会自动开始贡献。</p></div><div class="context-row"><small>可随时前往</small>${btn('AI 账号','accounts')}</div></aside></div>`;return `${steps()}${pairPanel()}${nextHint()}`}
function errorDevice(){return `<div class="overview-status"><div class="title-group"><span class="icon-tile warn">${ic('alert')}</span><div><h2>无法确认当前接单状态</h2><p>设备归属核对未完成，当前状态待确认。</p></div></div></div><div class="notice"><div class="notice-title">${ic('alert')}Hive 身份核对请求超时（10 秒）</div><p>本次未能确认 MacBook Pro 的设备归属。上次绑定信息保留，不能据此判断当前可接单。</p><div class="notice-bottom"><span class="retry">${ic('refresh')}正在等待下一次核对</span>${btn('查看连接检查','diagnostics',true)}</div></div><div class="facts"><div class="fact"><small>上次确认设备</small><strong>MacBook Pro</strong></div><div class="fact"><small>Hive</small><strong>hive.example.com</strong></div><div class="fact"><small>上次确认时间</small><strong>14:30</strong></div></div><section class="stopped-block"><h2>贡献状态待确认</h2><p class="body-text" style="margin-top:8px">设备核对恢复后，Bee 会继续读取平台状态。</p></section>`}
function overview(){if(isPairing())return pairing();if(state==='device-error')return errorDevice();if(state==='stopped')return `<div class="stopped-block"><div class="title-group"><span class="icon-tile">${ic('stop')}</span><div><h2>贡献已停止</h2><p>开始贡献后连接 Hive；平台接单仍需单独恢复。</p></div></div><div class="actions space">${btn('开始贡献','start',true,'play')}</div></div>`;const readyNames=[...(!paused?['OpenAI']:[]),...(!claudePaused?['Claude']:[])];const title=isReady()?(readyNames.length===0?'已连接 Hive，尚未开启接单':readyNames.length===2?'OpenAI 与 Claude 均可接单':readyNames[0]+' 可接单'):'与 Hive 的连接已断开，暂不能接单',subtitle=isReady()?(readyNames.length===2?'两个平台均已开启接单。':readyNames.length===0?'两个平台均暂停接单，可按需恢复。':(paused?'OpenAI':'Claude')+' 已暂停接单，可按需恢复。'):'本机运行仍在继续，正在恢复与 Hive 的连接。',tone=isReady()?'good':'warn',symbol=isReady()?'check':'unlink';
if(variant===1)return `<div class="overview-status"><div class="title-group"><span class="icon-tile ${tone}">${ic(symbol)}</span><div><h2>${title}</h2><p>${subtitle}</p></div></div>${btn('停止贡献','stop',false,'stop')}</div>${isDisconnected()?notice():''}${facts()}${accounts()}<div class="section-foot">${ic('info')}${isDisconnected()?'连接恢复后会重新核对账号与额度，手动暂停的平台保持暂停。':'可接单表示能够接收新任务，不表示当前正在处理任务。'}</div>`;
if(variant===2)return `<div class="action-layout"><section class="action-panel ${isDisconnected()?'warning':''}"><div class="title-group"><span class="icon-tile ${tone}">${ic(symbol)}</span><div><h2>${title}</h2><p>${isDisconnected()?'Bee 正在尝试恢复连接。':'已满足接收新任务的条件。'}</p></div></div>${isDisconnected()?`<div class="lead"><strong>Hive 返回 HTTP 503，服务暂不可用。</strong><p class="body-text" style="margin-top:5px">连接恢复前无法接收新任务，已有请求可能中断。</p></div><div class="actions">${btn('查看连接检查','diagnostics',true)}${btn('错误详情','error')}</div><div class="retry">${ic('refresh')}下一次尝试：14:33:00</div>`:`<p class="lead">${subtitle}</p><div class="actions">${btn('查看 OpenAI 账号','account:openai',true)}</div>`}</section>${facts(true)}</div>${accounts()}<div class="section-foot">${ic('info')}接单与暂停分别由各平台控制。</div>`;
return `<section class="shared-status ${isDisconnected()?'warning':''}"><div class="topline"><div class="title-group"><span class="icon-tile ${tone}">${ic(symbol)}</span><h2>${title}</h2></div>${btn(isDisconnected()?'查看连接检查':'停止贡献',isDisconnected()?'diagnostics':'stop',isDisconnected(),isDisconnected()?'':'stop')}</div><div class="shared-reason">${isDisconnected()?'<span>Hive 服务暂不可用（HTTP 503）· 下次尝试 14:33:00</span><button class="tiny-link" data-action="error">查看错误详情</button>':`<span>Hive 已连接。${subtitle}</span>`}</div></section>${accounts('cards')}<section class="connection-strip"><div><h3>设备与连接</h3><p>hive.example.com · MacBook Pro</p></div><div class="facts"><div class="fact"><small>本机运行</small><strong>Bee 正在运行</strong></div><div class="fact"><small>Hive 连接</small><strong class="${isDisconnected()?'warn-text':'good-text'}">${isDisconnected()?'正在重连':'已连接'}</strong></div></div>${isDisconnected()?btn('停止贡献','stop',false,'stop'):''}</section>`}
function emptyAccounts(){return `<p class="body-text" style="margin-bottom:22px">接入本机官方客户端中的登录。接入完成后，平台保持暂停。</p><div class="empty-accounts">${['openai','claude'].map(p=>{const c=p==='claude',platform=c?'Claude':'OpenAI',client=c?'Claude Code':'Codex';return `<section class="empty-account"><div class="platform"><span class="platform-mark ${c?'claude':''}" aria-hidden="true">${c?'C':'O'}</span><div><h3>${platform}</h3><small>通过 ${client} 登录</small></div><span class="push">${badge('尚未接入')}</span></div><div class="empty-row"><div><p>${loginFound&&!c?'已找到可用的 OpenAI 登录':`未找到本机 ${client} 登录`}</p><span class="quiet-note">${loginFound&&!c?'demo@example.com · Plus':`请先通过 ${client} 登录 ${platform}。`}</span></div>${btn(loginFound&&!c?'接入 OpenAI 账号':`登录 ${platform}`,loginFound&&!c?'select-account':'login:'+p,true,loginFound&&!c?'':'external')}</div><details class="source" open><summary>登录来源</summary><p>${c?'Claude Code 本机登录文件':'自动读取 Codex 的本机登录'}</p><button class="tiny-link" data-action="source:${p}">修改读取位置</button></details></section>`}).join('')}</div>`}
function accountPage(){if(isPairing()||state==='empty')return emptyAccounts();return `<p class="body-text" style="margin-bottom:22px">管理已接入账号及各平台接单状态。</p>${accounts(variant===3?'cards':'rows')}`}
function diagnostics(){return `<div class="form-panel"><div class="section-head"><h2>连接检查</h2>${badge(diagRan?'检查已完成':'尚未运行检查')}</div><p class="body-text">检查 Hive 可达性、本机运行与设备身份。检查不会更改账号或开始贡献。</p><div class="actions">${btn(diagRan?'重新运行检查':'运行连接检查','diagnose',true,'pulse')}${btn('返回概览','overview')}</div>${diagRan?`<div class="rule"></div><div class="check-row">${ic('check')}本机 Bee 运行${badge('正常','good')}</div><div class="check-row">${ic('alert')}Hive 返回 HTTP 503${badge('服务暂不可用','warn')}</div><p class="quiet-note">目标 hive.example.com · 无需更换账号，等待 Hive 服务恢复。</p>`:''}</div>${isDisconnected()?`<div class="space"><h3>最近一次连接失败</h3><p class="quiet-note" style="margin-top:7px">HTTP 503 · Hive 服务暂不可用 · 14:32:50</p>${rawDetails()}</div>`:''}`}
function settings(){return `<div class="tabs" role="tablist" aria-label="设置分类">${[['general','通用'],['network','网络与代理'],['system','通知与启动'],['about','关于']].map(([k,v])=>`<button role="tab" aria-selected="${subTab===k}" class="${subTab===k?'active':''}" data-action="tab:${k}">${v}</button>`).join('')}</div>${subTab==='network'?`<div class="form-panel"><h2>网络与代理</h2><p class="body-text" style="margin-top:8px">如需使用本机代理，请先启动代理工具。</p><label for="proxy-input">本机代理地址</label><input type="url" name="proxy" spellcheck="false" id="proxy-input" value="http://127.0.0.1:7890" autocomplete="off"><p class="quiet-note" style="margin-top:9px">用于官方平台请求，不代表 Hive 连接正常。</p><div class="actions">${btn('保存代理设置','save-proxy',true)}${btn('测试官方平台连接','test-proxy')}</div></div>`:`<div class="form-panel"><h2>${subTab==='general'?'语言与外观':subTab==='system'?'接收系统通知':'关于 Bee'}</h2><p class="body-text" style="margin-top:10px">${subTab==='general'?'中文 · 浅色外观':subTab==='system'?'应用内问题始终保留；系统通知还需系统权限允许。':'这是一份交互视觉预览，所有业务数据均为示例。'}</p></div>`}`}
function render(){document.body.dataset.state=state;document.body.classList.remove('v1','v2','v3');document.body.classList.add('v'+variant);document.getElementById('variant-title').textContent=`方案 ${variant} · ${names[variant][0]}`;document.getElementById('variant-description').textContent=names[variant][1];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.variant===variant)));document.getElementById('scenario').value=state;document.getElementById('navigation').innerHTML=[['overview','概览','home'],['accounts','AI 账号','accounts'],['diagnostics','诊断','pulse'],['settings','设置','settings']].map(([k,n,i])=>`<button data-action="${k}" ${page===k?'aria-current="page"':''}>${ic(i)}${n}</button>`).join('');let side=isPairing()?'等待网页确认':state==='device-error'?'设备状态待确认':state==='empty'?'尚未接入账号':state==='stopped'?'贡献已停止':isReady()?'已连接 Hive':'与 Hive 连接中断';document.getElementById('sidebar-bottom').innerHTML=`<div class="side-status ${isReady()?'good-text':isDisconnected()?'warn-text':''}"><span class="dot"></span>${side}</div><small>hive.example.com</small><button class="side-link" data-action="${isPairing()?'overview':'connection'}">${isPairing()?'查看绑定进度':'查看连接详情'} ${ic('arrow')}</button><div class="identity"><span class="icon-tile">${ic('monitor')}</span><div><strong>MacBook Pro</strong><small>${isPairing()?'等待绑定':'本机设备'}</small></div></div>`;const title={overview:'概览',accounts:'AI 账号',diagnostics:'诊断',settings:'设置'}[page];document.getElementById('main').innerHTML=`<div class="page-head"><h1>${title}</h1><span class="snapshot-time">${ic('clock')}${isPairing()?'正在等待确认':'最近核对 14:32'}</span></div>${page==='overview'?overview():page==='accounts'?accountPage():page==='diagnostics'?diagnostics():settings()}`;const u=new URL(location);u.searchParams.set('variant',variant);u.searchParams.set('state',state);history.replaceState({},'',u);}
let toastTimer;function toast(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3200)}
function modal(title,body,buttons=''){const d=document.getElementById('dialog');d.innerHTML=`<span class="demo-tag">交互预览</span><h2 id="dialog-title">${title}</h2>${body}<div class="actions">${btn('关闭','close')}${buttons}</div>`;d.showModal()}
function go(target){returnPage=page;page=target;render();document.getElementById('main').scrollTop=0}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant){variant=+b.dataset.variant;render();return}if(b.dataset.cycle){variant=(variant-1+ +b.dataset.cycle+3)%3+1;render();return}const a=b.dataset.action;if(!a)return;if(['overview','accounts','diagnostics','settings'].includes(a)){go(a);return}if(a==='close'){document.getElementById('dialog').close();return}if(a==='error'){modal('Hive 返回服务暂不可用（HTTP 503）',`<p>连接恢复前暂不能接收新任务，已有请求可能中断。Bee 已安排下一次尝试。</p>${rawDetails()}`);return}if(a==='connection'){go('overview');if(isDisconnected())document.querySelector('.notice,.shared-status,.action-panel')?.scrollIntoView({block:'nearest'});return}if(a==='pair-open'){modal('在 Hive 确认设备归属','<p>正式应用会打开 Hive 确认网页。这里模拟确认 MacBook Pro，以预览下一步。</p>',btn('确认此设备（模拟）','pair-confirm',true));return}if(a==='pair-confirm'){document.getElementById('dialog').close();state='empty';go('accounts');toast('设备已绑定，可继续接入账号');return}if(a.startsWith('copy-')){try{await navigator.clipboard.writeText(a==='copy-code'?'QRTW-KJNV':'https://hive.example.com/devices/pair?code=QRTW-KJNV');toast(a==='copy-code'?'配对码已复制':'确认网址已复制')}catch{toast('复制未完成，请手动选择并复制内容')}return}if(a==='stop'){modal('停止本机贡献？','<p>停止后将断开 Hive 连接，正在处理的任务可能中断。下次打开 Bee 时保持停止。</p>',btn('停止贡献（模拟）','stop-confirm',true));return}if(a==='stop-confirm'){document.getElementById('dialog').close();state='stopped';go('overview');return}if(a==='start'){state='ready';paused=true;claudePaused=true;render();toast('本机运行已开始，两个平台仍暂停接单');return}if(a.startsWith('pause:')){if(a.endsWith('claude'))claudePaused=!claudePaused;else paused=!paused;render();return}if(a.startsWith('account:')){modal(a.endsWith('claude')?'Claude 账号详情':'OpenAI 账号详情','<p>demo@example.com</p><p>当前账号已接入。你可以在 AI 账号页查看登录来源、额度与接单状态。</p>');return}if(a.startsWith('login:')){modal('通过官方客户端登录','<p>将调用对应官方客户端。登录可能改变其当前登录账号；完成登录不会自动接入 Bee 或开始接单。</p>',btn('完成登录（模拟）','login-done',true));return}if(a==='login-done'){document.getElementById('dialog').close();loginFound=true;render();toast('已读取示例登录，可继续接入账号');return}if(a==='select-account'){modal('接入 OpenAI 账号？','<p>使用 demo@example.com。接入后平台保持暂停，不会自动开始贡献。</p>',btn('接入账号（模拟）','select-done',true));return}if(a==='select-done'){document.getElementById('dialog').close();state='stopped';go('overview');toast('账号已接入，当前暂停接单');return}if(a.startsWith('source:')){modal('修改登录读取位置','<p>此入口用于指定官方客户端的登录来源。修复后自动读取，不自动接入账号。</p><label for="source-path">登录目录</label><input name="source-directory" autocomplete="off" spellcheck="false" id="source-path" value="~/.codex" style="display:block;width:100%;padding:9px;margin-top:8px;border:1px solid #cdd3dc;border-radius:5px">',btn('保存来源（模拟）','source-save',true));return}if(a==='source-save'){document.getElementById('dialog').close();toast('读取位置已保存，正在重新读取示例登录');return}if(a==='diagnose'){diagRan=true;render();return}if(a.startsWith('tab:')){subTab=a.split(':')[1];render();return}if(a==='save-proxy'){toast('代理设置已保存；此预览不会应用真实网络配置');return}if(a==='test-proxy'){toast('示例结果：官方平台可达。此结果不代表 Hive 已连接');return}});
document.getElementById('scenario').addEventListener('change',e=>{state=e.target.value;page=state==='empty'?'accounts':'overview';paused=false;claudePaused=true;loginFound=false;diagRan=false;render()});document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.closest('input,textarea,select,[contenteditable=true]')||document.querySelector('dialog[open]'))return;e.preventDefault();variant=(variant-1+(e.key==='ArrowRight'?1:-1)+3)%3+1;render()});
document.getElementById('bee-logo').src='../../../src/assets/app-icon-dark.svg';render();
</script></body></html>
