  a.taskVersion=(a.taskVersion||0)+1;
  after(a,2200,()=>{a.login=false;a.expired=false;a.candidate=true;a.checking=true;a.authorizationComplete=true;refresh();after(a,1800,()=>{a.checking=false;refresh();});});
  closeConfirm();if(detail.open)closeDetail();render();
  main.querySelector(`[data-platform="${a.name}"] [data-action="cancel-login"]`)?.focus({preventScroll:true});
 }
});
detail.addEventListener('cancel',e=>{e.preventDefault();closeDetail();});
confirmDialog.addEventListener('cancel',e=>{e.preventDefault();closeConfirm();});
detail.addEventListener('change',e=>{
 if(detailPlatform===null)return;const a=state.accounts[detailPlatform];
 if(e.target.name==='directory')a.source=e.target.value;
 if(e.target.name==='store')a.store=e.target.value;
 $('#source-note').textContent='读取位置已更新。核验后再确认是否使用此账号。';
});
window.addEventListener('message',e=>{
 if(e.source!==parent||e.data?.type!=='bee-design-control')return;
 const {action,value}=e.data;
 if(action==='reset')reset(value);
 if(action==='theme')document.documentElement.dataset.theme=value;
});
reset('change');parent.postMessage({type:'bee-design-ready'},'*');
</script></body></html>
</template>
<script>
const $=id=>document.getElementById(id),frame=$('screen');
const presets={onboarding:{scene:'empty',hint:'首次接入：登录后确认账号，自动准备完成后手动恢复接单；完成后步骤隐藏。'},recovery:{scene:'expired',hint:'授权过期且已暂停：重新登录后自动核验，最后手动恢复接单；原因默认折叠。'},ready:{scene:'running',hint:'可接单：不展示步骤；可直接尝试暂停与恢复，普通暂停也不出现步骤。'}};
const params=new URLSearchParams(location.search);
for(const key of ['scene','theme','size'])if([...$(key).options].some(o=>o.value===params.get(key)))$(key).value=params.get(key);
function send(action,value){frame.contentWindow.postMessage({type:'bee-design-control',action,value},'*');}
function remember(){const url=new URL(location.href);for(const key of ['scene','theme','size'])url.searchParams.set(key,$(key).value);history.replaceState(null,'',url);}
function presentation(){document.body.classList.toggle('dark',$('theme').value==='dark');frame.classList.toggle('narrow',$('size').value==='narrow');send('theme',$('theme').value);remember();}
function reset(){send('reset',presets[$('scene').value].scene);$('hint').textContent='模拟预览 · '+presets[$('scene').value].hint;remember();}
$('scene').onchange=reset;$('reset').onclick=reset;$('theme').onchange=presentation;$('size').onchange=presentation;
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='bee-design-ready'){reset();presentation();}});
presentation();frame.srcdoc=$('app-template').innerHTML;
</script></body></html>
