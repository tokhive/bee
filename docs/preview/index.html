const account=name=>({name,selected:false,candidate:false,paused:true,changed:false,error:false,stale:false,expired:false,login:false,loginFailed:false,checking:false,syncing:false,uncertain:false,reconciling:false,quotaBlocked:false,journey:null,needsStart:false,needsStop:false,stopCompleted:false,authorizationComplete:false,reviewed:false,changeConfirmed:false,id:name==='OpenAI'?'bbbbbbbbbbbbbbbb':'cccccccccccccccc',candidateId:name==='OpenAI'?'bbbbbbbbbbbbbbbb':'cccccccccccccccc',source:'',store:'file'});

// Quota review: receiving preference stays independent of quota availability.
let quotaReview=null;
function quotaReviewKey(){return `quota-${quotaReview.phase}-${quotaReview.paused?'paused':'allowed'}${detail.open?'-detail':''}`;}
function quotaReviewStatus(){return quotaReview.paused?'已暂停':quotaReview.phase==='available'?'可接单':quotaReview.phase==='checking'?'正在核验额度…':'额度已耗尽';}
function quotaReviewData(){
 const q=quotaReview,checking=q.phase==='checking',available=q.phase==='available';
 return `<div class="quota">${[['5 小时',available?0:100],['7 日',20]].map(([label,used])=>`<div><div class="quota-label"><span>${label}${checking?'（上次记录）':''}</span><strong>已用 ${used}%</strong></div><div class="bar" role="progressbar" aria-label="${label}已用额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${used}"><div class="fill" style="width:${used}%"></div></div></div>`).join('')}</div><p class="quota-reset">${checking?'额度窗口已重置，正在核验可用额度。':q.phase==='unknown'?'恢复时间暂不可用':available?'5 小时窗口已重置':'预计恢复：今天 20:30'}</p>`;
}
function quotaReviewToggle(){return `<button class="primary" data-quota-action="toggle">${quotaReview.paused?'恢复接单':'暂停接单'}</button>`;}
function quotaReviewDraw(){
 const status=quotaReviewStatus();
 main.innerHTML=`<div class="page-head"><h1>AI 账号</h1><span class="count">1 个已接入</span></div><div class="page-subtitle"><p>接入本机账号，管理平台接单。</p></div><div class="accounts"><section class="account" aria-label="OpenAI 账号"><div class="account-head"><span class="platform-icon">${icon('spark')}</span><div class="identity"><div class="platform-line"><h2>OpenAI</h2><span class="badge">Plus</span></div><p class="identifier">已接入账号 A</p></div><button class="quiet icon" data-quota-action="details" aria-label="OpenAI 详情">${icon('arrow')}</button></div><div class="body-copy"><p class="status ${status==='可接单'?'good':''}" role="status">${icon(quotaReview.paused?'pause':status==='可接单'?'check':'pulse')}<span>${status}</span></p></div>${quotaReviewData()}<div class="quota-actions">${quotaReviewToggle()}<button data-quota-action="details">查看额度</button></div></section></div><p class="privacy">${icon('shield')}授权信息保留在本机</p>`;
 $('#side-status').textContent=status;
 if(detail.open)quotaReviewDrawDetail();
 parent.postMessage({type:'bee-quota-position',scene:quotaReviewKey()},'*');
}
function quotaReviewDrawDetail(){
 detail.innerHTML=`<header><h2 id="detail-title">OpenAI 账号详情</h2><button class="quiet icon" data-quota-action="close" aria-label="关闭详情">${icon('close')}</button></header><dl class="facts"><div><dt>已接入账号</dt><dd>A</dd></div><div><dt>订阅套餐</dt><dd>Plus</dd></div></dl><p class="status" role="status">${quotaReviewStatus()}</p><div class="sheet-actions">${quotaReviewToggle()}</div><section class="sheet-section"><h3>额度与重置</h3>${quotaReviewData()}<p class="muted">7 日窗口重置时间暂不可用。</p></section>`;
}
function quotaReviewReset(scene){
 cancelPending();clearTimeout(toastTimer);$('#toast').textContent='';
 detail.close();confirmDialog.close();detailPlatform=null;expandedReasons.clear();
 const [,phase,preference,panel]=scene.split('-');
 quotaReview={phase,paused:preference==='paused'};
 quotaReviewDraw();
 if(panel==='detail'){quotaReviewDrawDetail();detail.showModal();quotaReviewDraw();}
}
function quotaReviewClose(){detail.close();quotaReviewDraw();main.querySelector('[data-quota-action="details"]')?.focus();}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-quota-action]');if(!b||!quotaReview)return;
 if(b.dataset.quotaAction==='details'){quotaReviewDrawDetail();detail.showModal();quotaReviewDraw();detail.querySelector('[data-quota-action="close"]').focus();}
 if(b.dataset.quotaAction==='close')quotaReviewClose();
 if(b.dataset.quotaAction==='toggle'){
  const inDetail=detail.open;quotaReview.paused=!quotaReview.paused;quotaReviewDraw();
  (inDetail?detail:main).querySelector('[data-quota-action="toggle"]').focus();
  toast(quotaReview.paused?'已暂停接单':quotaReview.phase==='available'?'已恢复接单':quotaReview.phase==='checking'?'已允许接单，等待额度核验':'已允许接单，等待额度恢复');
 }
});
detail.addEventListener('cancel',e=>{if(!quotaReview)return;e.preventDefault();e.stopImmediatePropagation();quotaReviewClose();});

function reset(scene){
 if(scene.startsWith("quota-")){quotaReviewReset(scene);return;}
 quotaReview=null;
 cancelPending();
 expandedReasons.clear();
 state={scene,running:true,connection:'connected',accounts:[account('OpenAI'),account('Claude')]};
 const a=state.accounts[0];
 if(scene==='candidate')a.candidate=true;
 if(!['empty','candidate'].includes(scene)){a.selected=true;a.candidate=true;}
 if(['running','paused','error','error-paused','expired','reconnecting','quota','uncertain','stale'].includes(scene)){state.running=true;state.connection='connected';}
 a.paused=!['running','relogin-different','error','expired','reconnecting','quota'].includes(scene);
 if(scene==='relogin-different')a.loginResultId='ffffffffffffffff';
 if(['empty','candidate','selected'].includes(scene)){a.journey='onboarding';a.needsStart=false;}
 if(scene==='change'){a.changed=true;a.candidateId='ffffffffffffffff';a.journey='change';a.needsStart=false;}
 if(scene==='error'||scene==='error-paused'){a.error=true;a.journey='source';}
 if(scene==='expired'){a.paused=true;a.expired=true;a.journey='authorization';a.needsStop=false;a.needsStart=false;}
 if(scene==='reconnecting')state.connection='reconnecting';
 if(scene==='quota')a.quotaBlocked=true;
 if(scene==='uncertain'){a.uncertain=true;a.changed=true;a.candidateId='ffffffffffffffff';}
 if(scene==='stale')a.stale=true;
 detail.close();confirmDialog.close();detailPlatform=null;clearTimeout(toastTimer);$('#toast').textContent='';render();
}
function synchronized(a){return a.selected&&state.running&&state.connection==='connected'&&!a.syncing&&!a.checking&&!a.error&&!a.expired&&!a.changed&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed;}
function canStart(){return state.accounts.some(a=>a.selected&&!a.changed&&!a.error&&!a.expired&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed&&!a.checking);}
function report(){
 parent.postMessage({type:'bee-design-state',running:state.running,canStart:canStart(),selected:state.accounts.filter(a=>a.selected).length,login:state.accounts.some(a=>a.login),error:state.accounts.some(a=>a.error),checking:state.accounts.some(a=>a.checking),syncing:state.running&&state.connection==='connecting'||state.accounts.some(a=>a.syncing),reconnecting:state.connection==='reconnecting',resolving:state.accounts.some(a=>a.uncertain&&a.reconciling),quotaBlocked:state.accounts.some(a=>a.quotaBlocked),stale:state.accounts.some(a=>a.stale),names:state.accounts.map(a=>a.name+'：'+status(a).text).join('；')},'*');
}
function status(a){
 if(a.uncertain)return{text:a.reconciling?'正在核对原操作结果…':'操作结果待核对',kind:'problem'};
 if(a.login)return{text:'等待官方登录…',kind:'progress'};
 if(a.loginFailed)return{text:'未找到官方客户端',kind:'error'};
 if(a.stale)return{text:'状态待更新',kind:'problem'};
 if(a.error)return{text:a.selected?'不能接单':'登录读取失败',kind:'error'};
 if(a.checking)return{text:'正在核验账号…',kind:'progress'};
 if(a.expired)return{text:'授权已过期',kind:'error'};
 if(a.changed)return{text:'发现不同账号',kind:'problem'};
 if(!a.selected)return{text:a.candidate?'已有登录，尚未接入':'所选位置未找到登录',kind:''};
 if(!state.running)return{text:'贡献尚未启动',kind:''};
 if(state.connection==='reconnecting')return{text:'正在重连…',kind:'problem'};
 if(state.connection==='connecting')return{text:'正在连接 Hive…',kind:'problem'};
 if(a.syncing)return{text:'正在准备账号…',kind:'progress'};
 if(a.quotaBlocked)return{text:'额度已耗尽',kind:'problem'};
 if(a.paused)return{text:'已暂停',kind:''};
 return{text:'可接单',kind:'good'};
}
// Display paths describe only the current task. Independent account/runtime facts stay independent.
function workflowState(a){
 if(!a.journey||a.uncertain||a.stale||state.connection==='reconnecting')return null;
 const steps=[],add=(key,label,done)=>steps.push({key,label,done});
 if(a.journey==='onboarding'){
  add('login','登录',a.candidate&&!a.error&&!a.checking);
  add('select','确认接入',a.selected);
 }
 if(a.journey==='source'){
  add('repair','修复读取',!a.error);
  add('verify','核验登录',!a.error&&!a.checking);
 }
 if(a.journey==='authorization'||a.journey==='relogin'){

  add('login','重新登录',a.authorizationComplete);
  add('verify','自动核验',a.authorizationComplete&&!a.checking&&!a.changed);
 }
 if(a.journey==='change'){
  add('review','核对账号',a.reviewed);
  add('change','确认换号',a.changeConfirmed);
 }
 if(a.journey==='onboarding'){

  add('sync','自动准备',synchronized(a));
 }else if(a.journey==='change')add('sync','同步核验',a.changeConfirmed&&synchronized(a));
 if(a.paused||['onboarding','change'].includes(a.journey))add('resume','恢复接单',synchronized(a)&&!a.paused);
 const current=steps.findIndex(x=>!x.done);
 if(current<0||steps.length<2)return null;
 const label={onboarding:'首次接入',source:'读取恢复',authorization:'授权恢复',relogin:'重新登录',change:'账号更换'}[a.journey];
 const key=steps[current].key;
 let [action,hint]={repair:['source','打开读取设置'],login:['login','打开官方登录'],select:['select','核对并接入'],review:['details','查看新旧账号'],change:['change','核对并确认'],start:['overview','前往概览'],stop:['overview','前往概览'],resume:['pause','允许接收新任务'],verify:[null,'自动核验中'],sync:[null,'自动同步中']}[key];
 if(key==='login'&&(a.login||a.checking)){action=null;hint=a.login?'等待登录完成':'自动核验中';}

 if(key==='resume'&&!synchronized(a)){action=null;hint='等待核验完成';}
 return {steps,current,label,action,hint};
}
function workflow(a){
 const path=workflowState(a);if(!path)return '';
 const {steps,current,label,action,hint}=path,index=state.accounts.indexOf(a);
 const actionLabel={source:'打开读取设置',login:a.selected?'重新登录':`登录 ${a.name}`,select:'接入账号',details:'查看新旧账号',change:'确认换号',pause:'恢复接单',overview:'前往概览'}[action];
 const progress=`<ol class="workflow" aria-label="${a.name} ${label}流程">${steps.map((step,i)=>`<li data-step="${step.key}" class="${i<current?'done':''}" ${i===current?'aria-current="step"':''}><span class="step-dot" aria-hidden="true">${i<current?icon('check'):i+1}</span><span class="step-label">${step.label}</span><span class="sr-only">${i<current?'，已完成':i===current?'，当前步骤':'，尚未完成'}</span></li>`).join('')}</ol>`;
 return `<div class="task-flow">${progress}${action?`<button class="primary workflow-action" data-action="${action}" data-i="${index}" aria-label="${a.name}：${actionLabel}">${actionLabel}</button>`:''}</div>`;
}
function reasons(a){
 const r=[],primary=status(a).text;
 if(a.error)r.push(`无法读取 ${a.name==='OpenAI'?'Codex':'Claude Code'} 登录文件：系统拒绝访问`);
 if(a.expired)r.push('登录校验返回 authorization_expired；需通过官方客户端重新授权。');
 if(a.stale)r.push('上次报告已过期，不能据此判断当前接单状态');
 if(a.uncertain)r.push('换号请求已发出，但成功结果尚未确认；只能核对原操作，不能重复换号');
 if(a.quotaBlocked)r.push('5 小时额度窗口已用尽，当前未提供重置时间');
 if(a.selected&&a.paused&&primary!=='已暂停')r.push(a.stale||a.uncertain?'上次记录：已暂停接单':'已暂停接单');
 if(!state.running&&a.selected&&primary!=='贡献尚未启动')r.push('贡献尚未启动');
 return [...new Set(r)];
}
function reasonDetails(a,location='row'){
 const r=reasons(a),key=location+'-'+a.name;
 if(!r.length&&!a.loginFailed&&!a.changed)return '';
 if(a.changed&&!a.error&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed){
  return `<details class="explanation condition-details" data-reasons="${key}" ${expandedReasons.has(key)?'open':''}><summary>换号说明</summary><p>本机当前登录的账号与 Bee 已接入的账号不同。原账号选择仍保留，确认后才会更换。</p><dl class="runtime-facts" aria-label="当前运行状态"><div><dt>本机服务</dt><dd>${state.running?'运行中':'尚未启动'}</dd></div><div><dt>平台接单</dt><dd>${a.paused?'已暂停':'未手动暂停'}</dd></div></dl></details>`;
 }
 let help='';
 if(a.error)help+=`<p>请检查登录文件所在目录及系统访问权限。当前账号选择仍保留；读取失败不代表已经登出。</p>${workflowState(a)?.action==='source'?'':`<button class="quiet" data-action="source" data-i="${state.accounts.indexOf(a)}">打开读取设置</button>`}<code>检查：file_read<br>结果：permission_denied=true</code>`;
 if(a.expired)help+='<p>登录将暂停此平台接单。完成后核验身份；发现不同账号时，需要另行确认换号。</p><code>检查：authorization_expiry<br>结果：expired=true</code>';
 if(a.stale)help+='<p>正在自动核对。确认当前状态前暂不能恢复接单，不会重复提交账号操作。</p>';
 if(a.uncertain)help+='<code>操作：confirm_change<br>结果：reconciling，尚未确认成功</code>';
 if(a.loginFailed)help+='<p>安装对应官方客户端后可重新登录。</p>';
 return `<details class="explanation condition-details" data-reasons="${key}" ${expandedReasons.has(key)?'open':''}><summary>${r.length?'查看原因（'+r.length+'）':'查看处理方法'}</summary>${r.length?`<ul class="condition-list">${r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${help}</details>`;
}
// Remember user disclosure choices when an action updates the same account.
document.addEventListener('toggle',event=>{const el=event.target;if(!el.matches?.('details[data-reasons]'))return;const key=el.dataset.reasons;if(el.open)expandedReasons.add(key);else expandedReasons.delete(key);},true);
function btn(label,action,i,primary=false,disabled=false,extra=''){return `<button ${primary?'class="primary"':''} data-action="${action}" data-i="${i}" ${disabled?'disabled':''} ${extra}>${esc(label)}</button>`;}
function quota(a,expanded=false){
 if(!a.selected)return '';
 if(a.error||a.changed||a.expired||a.checking||a.syncing||a.uncertain||state.connection!=='connected')return '<p class="unknown-quota">额度尚未核对</p>';
 if(a.stale)return '<p class="unknown-quota">上次额度：5 小时已用 3%，7 日已用 2%。当前待核对。</p>';
 return `<div class="quota">${[['5 小时',a.quotaBlocked?100:3],['7 日',2]].map(([name,p])=>`<div><div class="quota-label"><span>${name}</span><strong>已用 ${p}%</strong></div><div class="bar" role="progressbar" aria-label="${name}已用额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><div class="fill" style="width:${p}%"></div></div>${expanded?'<p class="muted">重置时间：未知</p>':''}</div>`).join('')}</div>`;
}
function pauseButton(a,i,primary=false){
 if(!a.selected||!state.running||a.uncertain)return '';
 if(a.paused&&!synchronized(a))return '';
 if(workflowState(a)?.action==='pause')return '';
 return btn(a.paused?'恢复接单':'暂停接单','pause',i,primary&&a.paused);
}
function actions(a,i){
 const guided=workflowState(a)?.action;
 const button=(label,action,primary=false,disabled=false)=>guided===action?'':btn(label,action,i,primary,disabled);
 let content='';
 if(a.uncertain)content=btn(a.reconciling?'正在核对…':'核对结果','reconcile',i,true,a.reconciling);
 else if(a.login)content=btn('取消登录','cancel-login',i);
 else if(a.loginFailed)content=button('重新登录','login',true);
 else if(a.error)content=pauseButton(a,i);
 else if(a.expired)content=button('重新登录','login',true)+pauseButton(a,i);
 else if(a.checking)content=pauseButton(a,i);
 else if(a.changed)content=(guided==='change'?'':button(a.reviewed?'继续换号':'核对换号','details',true))+pauseButton(a,i);
 else if(!a.selected)content=button(a.candidate?'接入账号':`登录 ${a.name}`,a.candidate?'select':'login',true,a.stale);
 else if(!state.running)content=button('前往概览','overview',true,a.stale);
 else if(a.quotaBlocked)content=btn('查看额度','details',i)+pauseButton(a,i);
 else content=pauseButton(a,i,true);
 content+=`<button class="quiet icon" data-action="details" data-i="${i}" aria-label="${a.name} 详情" title="${a.name} 详情">${icon('arrow')}</button>${marker(3)}`;
 return content;
}
function render(focusAction){
 state.accounts.forEach(a=>{if(a.journey&&!a.paused&&synchronized(a))a.journey=null;});
 const count=state.accounts.filter(a=>a.selected).length;
 main.innerHTML=`<div class="page-head"><h1>AI 账号${marker(1)}</h1><span class="count">${count} 个已接入</span></div><div class="page-subtitle"><p>接入本机账号，管理平台接单。</p></div><div class="accounts">${state.accounts.map((a,i)=>{const s=status(a);return `<section class="account" data-platform="${a.name}" aria-label="${a.name} 账号"><div class="account-head"><span class="platform-icon ${i===1?'claude':''}">${icon(i?'sun':'spark')}</span><div class="identity"><div class="platform-line"><h2>${a.name}${marker(2)}</h2><span class="badge">${a.selected?(a.changed||a.error||a.expired?'套餐待确认':i?'Pro':'Plus'):'未接入'}</span></div><p class="identifier">${a.selected?'账号 '+a.id:a.candidate?'已发现账号 '+a.candidateId:'通过官方客户端登录'}</p></div><div class="actions">${actions(a,i)}</div></div><div class="body-copy"><p class="status ${s.kind}" aria-live="polite">${icon(s.kind==='progress'?'pulse':s.kind==='good'?'check':s.kind==='error'||s.kind==='problem'?'alert':!a.selected?'users':state.running&&a.paused?'pause':'monitor')}<span>${s.text}</span></p></div>${workflow(a)}${reasonDetails(a)}${quota(a)}${a.selected&&!state.running&&!a.error&&!a.changed&&!a.expired&&!a.uncertain&&!workflowState(a)?'<p class="action-help">在概览开始贡献。</p>':''}</section>`;}).join('')}</div><p class="privacy">${icon('shield')}授权信息保留在本机</p>`;
 $('#side-status').textContent=!count?'尚未接入 AI 账号':state.accounts.some(a=>a.stale||a.uncertain)?'状态待确认':!state.running?'贡献尚未启动':state.accounts.some(a=>synchronized(a)&&!a.paused&&!a.quotaBlocked)?'可接单':state.connection==='reconnecting'?'正在重连':'接单条件尚未满足';
 if(focusAction)main.querySelector(focusAction)?.focus({preventScroll:true});
 report();
}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',2600);}
function describeNavigation(destination){parent.postMessage({type:'bee-design-navigation',destination},'*');}
function closeDetail(){

function drawDetail(){

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){describeNavigation(b.dataset.nav);return;}
 const action=b.dataset.action;if(!action)return;
 const i=Number(b.dataset.i||0),a=state.accounts[i];
 if(action==='details'||action==='source'){showDetail(i,action==='source');return;}
 if(action==='close-detail'){closeDetail();return;}
 if(action==='cancel-confirm'){closeConfirm();return;}
 if(action==='overview'||action==='hive'){describeNavigation(action);return;}
 if(['select','change','login'].includes(action)){
  if(a.uncertain||a.checking||a.syncing)return;
  showConfirm(action,i);return;
 }
 if(action==='reconcile'){if(a.uncertain&&!a.reconciling){a.reconciling=true;refresh();}return;}
 if(action==='pause'){
  if(a.uncertain||a.paused&&!synchronized(a))return;
  a.paused=!a.paused;
  refresh(`[data-platform="${a.name}"] [data-action="pause"]`);
  toast(a.paused?`${a.name} 已暂停接单`:`${a.name} 已恢复接单`);return;
 }
 if(action==='cancel-login'){a.taskVersion=(a.taskVersion||0)+1;a.login=false;refresh(`[data-platform="${a.name}"] [data-action="login"]`);toast('本次登录已取消');return;}
 if(action==='confirm-select'||action==='confirm-change'){
  if(a.uncertain||a.checking||a.syncing)return;
  a.selected=true;a.id=a.candidateId;a.changed=false;a.paused=true;
  a.syncing=true;a.taskVersion=(a.taskVersion||0)+1;after(a,1800,()=>{a.syncing=false;refresh();});if(action==='confirm-change')a.changeConfirmed=true;

  toast(action==='confirm-select'?`${a.name} 账号已接入`:`${a.name} 账号已更换`);return;
 }
 if(action==='confirm-login'){

  a.journey=a.selected?(a.expired?'authorization':'relogin'):'onboarding';
  a.authorizationComplete=false;
  a.needsStart=false;a.paused=true;a.login=true;a.loginFailed=false;
  a.taskVersion=(a.taskVersion||0)+1;
  after(a,2200,()=>{
   a.login=false;a.checking=true;a.authorizationComplete=true;refresh();
   after(a,1800,()=>{
    // A successful identity read is required before comparing accounts.
    a.candidateId=a.loginResultId||a.candidateId;
    a.candidate=true;a.checking=false;a.expired=false;a.authorizationComplete=true;
    a.changed=a.selected&&a.candidateId!==a.id;
    if(a.changed){a.journey='change';a.reviewed=false;a.changeConfirmed=false;}
    refresh();
   });
  });
  closeConfirm();if(detail.open)closeDetail();render();
  main.querySelector(`[data-platform="${a.name}"] [data-action="cancel-login"]`)?.focus({preventScroll:true});
 }
});

 return `<div class="quota">${[['5 小时',available?0:100],['7 日',20]].map(([label,used])=>`<div><div class="quota-label"><span>${label}${checking?'（上次记录）':''}</span><strong>已用 ${used}%</strong></div><div class="bar" role="progressbar" aria-label="${label}已用额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${used}"><div class="fill" style="width:${used}%"></div></div></div>`).join('')}</div><p class="quota-reset">${checking?'额度窗口已重置，正在核验可用额度。':q.phase==='unknown'?'恢复时间暂不可用':available?'5 小时窗口已重置':'预计恢复：今天 20:30'}</p>`;
}
function quotaReviewToggle(){return `<button class="primary" data-quota-action="toggle">${quotaReview.paused?'恢复接单':'暂停接单'}</button>`;}
function quotaReviewDraw(){
 const status=quotaReviewStatus();
 main.innerHTML=`<div class="page-head"><h1>AI 账号</h1><span class="count">1 个已接入</span></div><div class="page-subtitle"><p>接入本机账号，管理平台接单。</p></div><div class="accounts"><section class="account" aria-label="Claude 账号"><div class="account-head"><span class="platform-icon">${icon('spark')}</span><div class="identity"><div class="platform-line"><h2>Claude</h2><span class="badge">Plus</span></div><p class="identifier">已接入账号 A</p></div><button class="quiet icon" data-quota-action="details" aria-label="Claude 详情">${icon('arrow')}</button></div><div class="body-copy"><p class="status ${status==='可接单'?'good':''}" role="status">${icon(quotaReview.paused?'pause':status==='可接单'?'check':'pulse')}<span>${status}</span></p></div>${quotaReviewData()}<div class="quota-actions">${quotaReviewToggle()}<button data-quota-action="details">查看额度</button></div></section></div><p class="privacy">${icon('shield')}授权信息保留在本机</p>`;
 $('#side-status').textContent=status;

function quotaReviewDrawDetail(){

}
function quotaReviewReset(scene){
 cancelPending();clearTimeout(toastTimer);$('#toast').textContent='';
 detail.close();confirmDialog.close();detailPlatform=null;expandedReasons.clear();
 const [,phase,preference,panel]=scene.split('-');
 quotaReview={phase,paused:preference==='paused'};
 quotaReviewDraw();
 if(panel==='detail'){quotaReviewDrawDetail();detail.showModal();quotaReviewDraw();}
}
function quotaReviewClose(){detail.close();quotaReviewDraw();main.querySelector('[data-quota-action="details"]')?.focus();}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-quota-action]');if(!b||!quotaReview)return;
 if(b.dataset.quotaAction==='details'){quotaReviewDrawDetail();detail.showModal();quotaReviewDraw();detail.querySelector('[data-quota-action="close"]').focus();}
 if(b.dataset.quotaAction==='close')quotaReviewClose();
 if(b.dataset.quotaAction==='toggle'){
  const inDetail=detail.open;quotaReview.paused=!quotaReview.paused;quotaReviewDraw();
  (inDetail?detail:main).querySelector('[data-quota-action="toggle"]').focus();
  toast(quotaReview.paused?'已暂停接单':quotaReview.phase==='available'?'已恢复接单':quotaReview.phase==='checking'?'已允许接单，等待额度核验':'已允许接单，等待额度恢复');
 }
});
detail.addEventListener('cancel',e=>{if(!quotaReview)return;e.preventDefault();e.stopImmediatePropagation();quotaReviewClose();});

function reset(scene){
 if(scene.startsWith("quota-")){quotaReviewReset(scene);return;}
 quotaReview=null;
 cancelPending();
 expandedReasons.clear();
 state={scene,running:true,connection:'connected',accounts:[account('Claude'),account('OpenAI')]};
 const a=state.accounts[0];
 if(scene==='candidate')a.candidate=true;
 if(!['empty','candidate'].includes(scene)){a.selected=true;a.candidate=true;}
 if(['running','paused','error','error-paused','expired','reconnecting','quota','uncertain','stale'].includes(scene)){state.running=true;state.connection='connected';}
 a.paused=!['running','relogin-different','error','expired','reconnecting','quota'].includes(scene);
 if(scene==='relogin-different')a.loginResultId='ffffffffffffffff';
 if(['empty','candidate','selected'].includes(scene)){a.journey='onboarding';a.needsStart=false;}
 if(scene==='change'){a.changed=true;a.candidateId='ffffffffffffffff';a.journey='change';a.needsStart=false;}
 if(scene==='error'||scene==='error-paused'){a.error=true;a.journey='source';}
 if(scene==='expired'){a.paused=true;a.expired=true;a.journey='authorization';a.needsStop=false;a.needsStart=false;}
 if(scene==='reconnecting')state.connection='reconnecting';
 if(scene==='quota')a.quotaBlocked=true;
 if(scene==='uncertain'){a.uncertain=true;a.changed=true;a.candidateId='ffffffffffffffff';}
 if(scene==='stale')a.stale=true;
 detail.close();confirmDialog.close();detailPlatform=null;clearTimeout(toastTimer);$('#toast').textContent='';render();
}
function synchronized(a){return a.selected&&state.running&&state.connection==='connected'&&!a.syncing&&!a.checking&&!a.error&&!a.expired&&!a.changed&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed;}
function canStart(){return state.accounts.some(a=>a.selected&&!a.changed&&!a.error&&!a.expired&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed&&!a.checking);}
function report(){
 parent.postMessage({type:'bee-design-state',running:state.running,canStart:canStart(),selected:state.accounts.filter(a=>a.selected).length,login:state.accounts.some(a=>a.login),error:state.accounts.some(a=>a.error),checking:state.accounts.some(a=>a.checking),syncing:state.running&&state.connection==='connecting'||state.accounts.some(a=>a.syncing),reconnecting:state.connection==='reconnecting',resolving:state.accounts.some(a=>a.uncertain&&a.reconciling),quotaBlocked:state.accounts.some(a=>a.quotaBlocked),stale:state.accounts.some(a=>a.stale),names:state.accounts.map(a=>a.name+'：'+status(a).text).join('；')},'*');
}
function status(a){
 if(a.uncertain)return{text:a.reconciling?'正在核对原操作结果…':'操作结果待核对',kind:'problem'};
 if(a.login)return{text:'等待官方登录…',kind:'progress'};
 if(a.loginFailed)return{text:'未找到官方客户端',kind:'error'};
 if(a.stale)return{text:'状态待更新',kind:'problem'};
 if(a.error)return{text:a.selected?'不能接单':'登录读取失败',kind:'error'};
 if(a.checking)return{text:'正在核验账号…',kind:'progress'};
 if(a.expired)return{text:'授权已过期',kind:'error'};
 if(a.changed)return{text:'发现不同账号',kind:'problem'};
 if(!a.selected)return{text:a.candidate?'已有登录，尚未接入':'所选位置未找到登录',kind:''};
 if(!state.running)return{text:'贡献尚未启动',kind:''};
 if(state.connection==='reconnecting')return{text:'正在重连…',kind:'problem'};
 if(state.connection==='connecting')return{text:'正在连接 Hive…',kind:'problem'};
 if(a.syncing)return{text:'正在准备账号…',kind:'progress'};
 if(a.quotaBlocked)return{text:'额度已耗尽',kind:'problem'};
 if(a.paused)return{text:'已暂停',kind:''};
 return{text:'可接单',kind:'good'};
}
// Display paths describe only the current task. Independent account/runtime facts stay independent.
function workflowState(a){
 if(!a.journey||a.uncertain||a.stale||state.connection==='reconnecting')return null;
 const steps=[],add=(key,label,done)=>steps.push({key,label,done});
 if(a.journey==='onboarding'){
  add('login','登录',a.candidate&&!a.error&&!a.checking);
  add('select','确认接入',a.selected);
 }
 if(a.journey==='source'){
  add('repair','修复读取',!a.error);
  add('verify','核验登录',!a.error&&!a.checking);
 }
 if(a.journey==='authorization'||a.journey==='relogin'){

  add('login','重新登录',a.authorizationComplete);
  add('verify','自动核验',a.authorizationComplete&&!a.checking&&!a.changed);
 }
 if(a.journey==='change'){
  add('review','核对账号',a.reviewed);
  add('change','确认换号',a.changeConfirmed);
 }
 if(a.journey==='onboarding'){

  add('sync','自动准备',synchronized(a));
 }else if(a.journey==='change')add('sync','同步核验',a.changeConfirmed&&synchronized(a));
 if(a.paused||['onboarding','change'].includes(a.journey))add('resume','恢复接单',synchronized(a)&&!a.paused);
 const current=steps.findIndex(x=>!x.done);
 if(current<0||steps.length<2)return null;
 const label={onboarding:'首次接入',source:'读取恢复',authorization:'授权恢复',relogin:'重新登录',change:'账号更换'}[a.journey];
 const key=steps[current].key;
 let [action,hint]={repair:['source','打开读取设置'],login:['login','打开官方登录'],select:['select','核对并接入'],review:['details','查看新旧账号'],change:['change','核对并确认'],start:['overview','前往概览'],stop:['overview','前往概览'],resume:['pause','允许接收新任务'],verify:[null,'自动核验中'],sync:[null,'自动同步中']}[key];
 if(key==='login'&&(a.login||a.checking)){action=null;hint=a.login?'等待登录完成':'自动核验中';}

 if(key==='resume'&&!synchronized(a)){action=null;hint='等待核验完成';}
 return {steps,current,label,action,hint};
}
function workflow(a){
 const path=workflowState(a);if(!path)return '';
 const {steps,current,label,action,hint}=path,index=state.accounts.indexOf(a);
 const actionLabel={source:'打开读取设置',login:a.selected?'重新登录':`登录 ${a.name}`,select:'接入账号',details:'查看新旧账号',change:'确认换号',pause:'恢复接单',overview:'前往概览'}[action];
 const progress=`<ol class="workflow" aria-label="${a.name} ${label}流程">${steps.map((step,i)=>`<li data-step="${step.key}" class="${i<current?'done':''}" ${i===current?'aria-current="step"':''}><span class="step-dot" aria-hidden="true">${i<current?icon('check'):i+1}</span><span class="step-label">${step.label}</span><span class="sr-only">${i<current?'，已完成':i===current?'，当前步骤':'，尚未完成'}</span></li>`).join('')}</ol>`;
 return `<div class="task-flow">${progress}${action?`<button class="primary workflow-action" data-action="${action}" data-i="${index}" aria-label="${a.name}：${actionLabel}">${actionLabel}</button>`:''}</div>`;
}
function reasons(a){
 const r=[],primary=status(a).text;
 if(a.error)r.push(`无法读取 ${a.name==='Claude'?'Claude Code':'OpenAI Code'} 登录文件：系统拒绝访问`);
 if(a.expired)r.push('登录校验返回 authorization_expired；需通过官方客户端重新授权。');
 if(a.stale)r.push('上次报告已过期，不能据此判断当前接单状态');
 if(a.uncertain)r.push('换号请求已发出，但成功结果尚未确认；只能核对原操作，不能重复换号');
 if(a.quotaBlocked)r.push('5 小时额度窗口已用尽，当前未提供重置时间');
 if(a.selected&&a.paused&&primary!=='已暂停')r.push(a.stale||a.uncertain?'上次记录：已暂停接单':'已暂停接单');
 if(!state.running&&a.selected&&primary!=='贡献尚未启动')r.push('贡献尚未启动');
 return [...new Set(r)];
}
function reasonDetails(a,location='row'){
 const r=reasons(a),key=location+'-'+a.name;
 if(!r.length&&!a.loginFailed&&!a.changed)return '';
 if(a.changed&&!a.error&&!a.stale&&!a.uncertain&&!a.login&&!a.loginFailed){
  return `<details class="explanation condition-details" data-reasons="${key}" ${expandedReasons.has(key)?'open':''}><summary>换号说明</summary><p>本机当前登录的账号与 Bee 已接入的账号不同。原账号选择仍保留，确认后才会更换。</p><dl class="runtime-facts" aria-label="当前运行状态"><div><dt>本机服务</dt><dd>${state.running?'运行中':'尚未启动'}</dd></div><div><dt>平台接单</dt><dd>${a.paused?'已暂停':'未手动暂停'}</dd></div></dl></details>`;
 }
 let help='';
 if(a.error)help+=`<p>请检查登录文件所在目录及系统访问权限。当前账号选择仍保留；读取失败不代表已经登出。</p>${workflowState(a)?.action==='source'?'':`<button class="quiet" data-action="source" data-i="${state.accounts.indexOf(a)}">打开读取设置</button>`}<code>检查：file_read<br>结果：permission_denied=true</code>`;
 if(a.expired)help+='<p>登录将暂停此平台接单。完成后核验身份；发现不同账号时，需要另行确认换号。</p><code>检查：authorization_expiry<br>结果：expired=true</code>';
 if(a.stale)help+='<p>正在自动核对。确认当前状态前暂不能恢复接单，不会重复提交账号操作。</p>';
 if(a.uncertain)help+='<code>操作：confirm_change<br>结果：reconciling，尚未确认成功</code>';
 if(a.loginFailed)help+='<p>安装对应官方客户端后可重新登录。</p>';
 return `<details class="explanation condition-details" data-reasons="${key}" ${expandedReasons.has(key)?'open':''}><summary>${r.length?'查看原因（'+r.length+'）':'查看处理方法'}</summary>${r.length?`<ul class="condition-list">${r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${help}</details>`;
}
// Remember user disclosure choices when an action updates the same account.
document.addEventListener('toggle',event=>{const el=event.target;if(!el.matches?.('details[data-reasons]'))return;const key=el.dataset.reasons;if(el.open)expandedReasons.add(key);else expandedReasons.delete(key);},true);
function btn(label,action,i,primary=false,disabled=false,extra=''){return `<button ${primary?'class="primary"':''} data-action="${action}" data-i="${i}" ${disabled?'disabled':''} ${extra}>${esc(label)}</button>`;}
function quota(a,expanded=false){
 if(!a.selected)return '';
 if(a.error||a.changed||a.expired||a.checking||a.syncing||a.uncertain||state.connection!=='connected')return '<p class="unknown-quota">额度尚未核对</p>';
 if(a.stale)return '<p class="unknown-quota">上次额度：5 小时已用 3%，7 日已用 2%。当前待核对。</p>';
 return `<div class="quota">${[['5 小时',a.quotaBlocked?100:3],['7 日',2]].map(([name,p])=>`<div><div class="quota-label"><span>${name}</span><strong>已用 ${p}%</strong></div><div class="bar" role="progressbar" aria-label="${name}已用额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><div class="fill" style="width:${p}%"></div></div>${expanded?'<p class="muted">重置时间：未知</p>':''}</div>`).join('')}</div>`;
}
function pauseButton(a,i,primary=false){
 if(!a.selected||!state.running||a.uncertain)return '';
 if(a.paused&&!synchronized(a))return '';
 if(workflowState(a)?.action==='pause')return '';
 return btn(a.paused?'恢复接单':'暂停接单','pause',i,primary&&a.paused);
}
function actions(a,i){
 const guided=workflowState(a)?.action;
 const button=(label,action,primary=false,disabled=false)=>guided===action?'':btn(label,action,i,primary,disabled);
 let content='';
 if(a.uncertain)content=btn(a.reconciling?'正在核对…':'核对结果','reconcile',i,true,a.reconciling);
 else if(a.login)content=btn('取消登录','cancel-login',i);
 else if(a.loginFailed)content=button('重新登录','login',true);
 else if(a.error)content=pauseButton(a,i);
 else if(a.expired)content=button('重新登录','login',true)+pauseButton(a,i);
 else if(a.checking)content=pauseButton(a,i);
 else if(a.changed)content=(guided==='change'?'':button(a.reviewed?'继续换号':'核对换号','details',true))+pauseButton(a,i);
 else if(!a.selected)content=button(a.candidate?'接入账号':`登录 ${a.name}`,a.candidate?'select':'login',true,a.stale);
 else if(!state.running)content=button('前往概览','overview',true,a.stale);
 else if(a.quotaBlocked)content=btn('查看额度','details',i)+pauseButton(a,i);
 else content=pauseButton(a,i,true);
 content+=`<button class="quiet icon" data-action="details" data-i="${i}" aria-label="${a.name} 详情" title="${a.name} 详情">${icon('arrow')}</button>${marker(3)}`;
 return content;
}
function render(focusAction){
 state.accounts.forEach(a=>{if(a.journey&&!a.paused&&synchronized(a))a.journey=null;});
 const count=state.accounts.filter(a=>a.selected).length;
 main.innerHTML=`<div class="page-head"><h1>AI 账号${marker(1)}</h1><span class="count">${count} 个已接入</span></div><div class="page-subtitle"><p>接入本机账号，管理平台接单。</p></div><div class="accounts">${state.accounts.map((a,i)=>{const s=status(a);return `<section class="account" data-platform="${a.name}" aria-label="${a.name} 账号"><div class="account-head"><span class="platform-icon ${i===1?'claude':''}">${icon(i?'sun':'spark')}</span><div class="identity"><div class="platform-line"><h2>${a.name}${marker(2)}</h2><span class="badge">${a.selected?(a.changed||a.error||a.expired?'套餐待确认':i?'Pro':'Plus'):'未接入'}</span></div><p class="identifier">${a.selected?'账号 '+a.id:a.candidate?'已发现账号 '+a.candidateId:'通过官方客户端登录'}</p></div><div class="actions">${actions(a,i)}</div></div><div class="body-copy"><p class="status ${s.kind}" aria-live="polite">${icon(s.kind==='progress'?'pulse':s.kind==='good'?'check':s.kind==='error'||s.kind==='problem'?'alert':!a.selected?'users':state.running&&a.paused?'pause':'monitor')}<span>${s.text}</span></p></div>${workflow(a)}${reasonDetails(a)}${quota(a)}${a.selected&&!state.running&&!a.error&&!a.changed&&!a.expired&&!a.uncertain&&!workflowState(a)?'<p class="action-help">在概览开始贡献。</p>':''}</section>`;}).join('')}</div><p class="privacy">${icon('shield')}授权信息保留在本机</p>`;
 $('#side-status').textContent=!count?'尚未接入 AI 账号':state.accounts.some(a=>a.stale||a.uncertain)?'状态待确认':!state.running?'贡献尚未启动':state.accounts.some(a=>synchronized(a)&&!a.paused&&!a.quotaBlocked)?'可接单':state.connection==='reconnecting'?'正在重连':'接单条件尚未满足';
 if(focusAction)main.querySelector(focusAction)?.focus({preventScroll:true});
 report();
}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',2600);}
function describeNavigation(destination){parent.postMessage({type:'bee-design-navigation',destination},'*');}

function drawDetail(){

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){describeNavigation(b.dataset.nav);return;}

 const i=Number(b.dataset.i||0),a=state.accounts[i];
 if(action==='details'||action==='source'){showDetail(i,action==='source');return;}
 if(action==='close-detail'){closeDetail();return;}
 if(action==='cancel-confirm'){closeConfirm();return;}
 if(action==='overview'||action==='hive'){describeNavigation(action);return;}
 if(['select','change','login'].includes(action)){
  if(a.uncertain||a.checking||a.syncing)return;
  showConfirm(action,i);return;
 }
 if(action==='reconcile'){if(a.uncertain&&!a.reconciling){a.reconciling=true;refresh();}return;}
 if(action==='pause'){
  if(a.uncertain||a.paused&&!synchronized(a))return;
  a.paused=!a.paused;
  refresh(`[data-platform="${a.name}"] [data-action="pause"]`);
  toast(a.paused?`${a.name} 已暂停接单`:`${a.name} 已恢复接单`);return;
 }
 if(action==='cancel-login'){a.taskVersion=(a.taskVersion||0)+1;a.login=false;refresh(`[data-platform="${a.name}"] [data-action="login"]`);toast('本次登录已取消');return;}
 if(action==='confirm-select'||action==='confirm-change'){
  if(a.uncertain||a.checking||a.syncing)return;
  a.selected=true;a.id=a.candidateId;a.changed=false;a.paused=true;
  a.syncing=true;a.taskVersion=(a.taskVersion||0)+1;after(a,1800,()=>{a.syncing=false;refresh();});if(action==='confirm-change')a.changeConfirmed=true;

 }

  a.needsStart=false;a.paused=true;a.login=true;a.loginFailed=false;
  a.taskVersion=(a.taskVersion||0)+1;
  after(a,2200,()=>{
   a.login=false;a.checking=true;a.authorizationComplete=true;refresh();
   after(a,1800,()=>{
    // A successful identity read is required before comparing accounts.
    a.candidateId=a.loginResultId||a.candidateId;

    a.changed=a.selected&&a.candidateId!==a.id;

    refresh();
   });
  });
  closeConfirm();if(detail.open)closeDetail();render();
  main.querySelector(`[data-platform="${a.name}"] [data-action="cancel-login"]`)?.focus({preventScroll:true});
 }
});

function oaPrepared(){if(oa.result==='failure'){oaGo('prepare-failed');return;}oaGo(oa.quota&&oa.quota!=='available'?'quota':'normal',{selected:true,completionPending:!!oa.journey});}

 if(action==='preference'){oa.paused=!oa.paused;oaDraw();main.querySelector('[data-oa="preference"]')?.focus();return;}

}

function remember(){const url=new URL(location.href);for(const key of ['scene','theme','size'])url.searchParams.set(key,key==='scene'?selectedStart:$(key).value);history.replaceState(null,'',url);}
function presentation(){document.body.classList.toggle('dark',$('theme').value==='dark');frame.classList.toggle('narrow',$('size').value==='narrow');send('theme',$('theme').value);remember();hint($('scene').value);}
function hint(key){if(key.startsWith('add-')){$('hint').textContent='已认可 · 静态模拟 · '+catalog[key].label+'。直接选场景停留；点击操作按预设推进，不读取真实目录、不发起官方授权。';$('compare-old').textContent='查看现有账号卡片';$('compare-old').href=(location.pathname.includes('/history/')?'before-add.html':'history/20261112-190918-add-error-details/before-add.html')+'?scene=first-preparing';return;}if(key.startsWith('switch-')||key==='claude-switch-waiting'){$('hint').textContent='待评审 · 静态模拟 · '+catalog[key].label+'。'+(key==='switch-history-conflict'?'打开切换列表查看冲突提示；仅禁用受影响目标，原记录保留。':key==='switch-notification-source'?'通知保留原 Hive；查看列表仅供明确选择，不自动切换或跳到当前 Hive 的账号页。':'关闭列表不取消；按实际阶段展示，不估算百分比。');$('compare-old').textContent='打开修改前主预览';$('compare-old').href=location.pathname.includes('/history/')?'before-switch.html':'history/20261112-152533-approved-first-launch/index.html';return;}if(key.startsWith('setup-')){$('hint').textContent='已认可 · 静态模拟 · '+catalog[key].label+'。直接选场景停留；操作按预设推进，不连接真实 Hive、不打开真实授权网页。';$('compare-old').textContent='打开修改前主预览';$('compare-old').href=location.pathname.includes('/history/')?'before-setup.html':'history/20261111-154454-session-retirement/index.html';return;}if(catalog[key].platform==='claude'){const u=new URL(location.pathname.includes('/history/')?'claude-baseline.html':'history/20261111-145858-claude-compact-sync/draft.html',location.href);u.search=new URLSearchParams({scene:key,theme:$('theme').value,size:$('size').value});$('compare-old').href=u.href;$('compare-old').textContent='打开已确认草稿';$('hint').textContent='已认可 · Claude · macOS 静态模拟 · '+catalog[key].label+'。直接选择停留；产品操作按预设推进，不会打开真实终端。';return;}
 const s=catalog[key],startup=key.startsWith('startup-'),archived=location.pathname.includes('/history/');
 const baseline=startup?'20261111-120139-before-startup-recovery':'20261111-022040-approved-overview-final';
 const oldURL=new URL(archived?(startup?'before-startup.html':'baseline.html'):'history/'+baseline+'/index.html',location.href);
 const mapped={'compact-normal':'ready','compact-exhausted':'quota-known-allowed','compact-unknown':'ready','compact-missing':'settings-cancel'}[key];
 const oldScene=startup?'onboarding':mapped||(key.startsWith('complete-')?({intake:'prep-'+(s.phase==='quota'?'quota':'normal')+(s.paused?'-paused':'-allowed'),relogin:'login-same',repair:'settings-normal'+(s.paused?'-paused':'-allowed'),change:'change-ready'}[s.journey]||'onboarding'):key);
 oldURL.search=new URLSearchParams({scene:oldScene,theme:$('theme').value,size:$('size').value});
 $('compare-old').href=oldURL.href;$('compare-old').textContent=startup?'打开修改前预览':'打开旧版同场景';
 $('hint').textContent='已认可布局 · 静态模拟 · '+s.group+' · '+s.label+'。直接选择停留；产品操作按预设推进。'+(s.phase==='restart-blocked'||s.phase.includes('long')||s.phase.includes('blocked')?' 此分支的安全恢复出口仍待接口补齐，草稿不模拟成功。':'');
}
let activeTemplate=null;
function loadScene(){selectScene(currentKey);const model=catalog[currentKey],name=model.setup?'setup-template':model.platform==='claude'?'claude-template':'app-template';$('page').disabled=!!model.setup;$('page').value=model.setup?'setup':model.overview?'overview':'accounts';
 if(activeTemplate!==name){activeTemplate=name;frame.srcdoc=$(name).innerHTML;hint(currentKey);remember();return;}
 const currentCatalog=Object.fromEntries(Object.entries(catalog).filter(([,s])=>!s.setup&&(s.platform==='claude')===(name==='claude-template')));
 send('reset',{key:currentKey,model:{...model,...(model.freshDevice?{deviceContext:handoffContext}: {})},catalog:currentCatalog});hint(currentKey);remember();}
function reset(){currentKey=selectedStart;handoffContext=null;loadScene()}
$('page').onchange=()=>{if($('page').value==='setup'){selectedStart='setup-form';reset();return;}send('page',$('page').value);const u=new URL(location.href);u.searchParams.set('page',$('page').value);history.replaceState(null,'',u)};
$('flow').onchange=()=>{selectedStart=Object.values(catalog).find(s=>flowOf(s)===$('flow').value).key;reset();};
$('scene').onchange=()=>{selectedStart=$('scene').value;reset();};$('reset').onclick=reset;$('theme').onchange=presentation;$('size').onchange=presentation;
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='bee-setup-done'){handoffContext={hive:e.data.hive,name:e.data.name};currentKey=e.data.page==='overview'?'setup-overview':'setup-accounts';loadScene();return;}if(e.data?.type==='bee-openai-review'){selectedStart='onboarding';reset();return;}if(e.data?.type==='bee-claude-review'){selectedStart=e.data.scene&&catalog[e.data.scene]?e.data.scene:'claude-ready';reset();return;}if(e.data?.type==='bee-app-page'){$('page').value=e.data.page;const u=new URL(location.href);u.searchParams.set('page',e.data.page);history.replaceState(null,'',u);}if(e.data?.type==='bee-oa-position'&&catalog[e.data.scene]){selectScene(e.data.scene);hint(e.data.scene);}if(e.data?.type==='bee-design-ready'){loadScene();presentation();if(!currentKey.startsWith('setup-')&&['overview','accounts'].includes(params.get('page')))send('page',params.get('page'));}});
reset();presentation();
</script></body></html>
