<html lang="zh-CN">
<head>

<title>Bee · OpenAI 登录结果 · 交互评审稿</title>
<style>
/* Reuse the Bee preview shell's palette, typography, sidebar and wizard proportions. */
:root{color-scheme:light;--paper:#fff;--canvas:#edf0f3;--side:#f7f6f3;--panel:#f8f7f4;--ink:#2c2b28;--muted:#69665f;--line:#eae7e1;--accent:#805a20;--primary:#30312e;--on-primary:#fff;--good:#37674e;--good-bg:#f1f7f3;--danger:#a24231;--danger-bg:#fff5f2;--warning-bg:#faf6ed;--review:#275e92;--review-bg:#edf5fc;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
:root[data-theme=dark]{color-scheme:dark;--paper:#242421;--canvas:#141619;--side:#20201e;--panel:#2a2a26;--ink:#e5e4df;--muted:#b7b3a9;--line:#45433d;--accent:#d2af75;--primary:#e5e3dc;--on-primary:#272721;--good:#9cd0b1;--good-bg:#26382e;--danger:#f2a38f;--danger-bg:#402e28;--warning-bg:#373024;--review:#a5d3fb;--review-bg:#283846}
*{box-sizing:border-box}body{margin:0;padding:22px}button,select,input{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:6px;background:var(--paper);min-height:38px;padding:7px 12px}button,select,summary,a{touch-action:manipulation}button,summary{cursor:pointer}button:hover:not(:disabled){background:var(--panel);border-color:var(--muted)}button:disabled{opacity:.6;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}button.primary:hover{background:var(--primary);opacity:.88}button.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.toolbar,.hint{max-width:1080px;margin:0 auto}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar label{display:flex;align-items:center;gap:7px;font-size:12px}.toolbar select{max-width:100%;min-width:0}.toolbar #scene{width:270px}.hint{color:var(--muted);font-size:12px;padding:12px 0 18px;min-height:50px}.stage{overflow:auto;padding:3px 3px 12px}.app{width:1080px;height:700px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:178px minmax(0,1fr);grid-template-rows:45px minmax(0,1fr) 29px;box-shadow:0 8px 35px #2233440b}.app.narrow{width:820px;height:680px}.app aside{grid-row:1/4;background:var(--side);border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column}.brand{font-size:24px;font-weight:650;padding:0 12px;margin-bottom:28px;display:flex;align-items:center;gap:9px}.bee-mark{color:var(--accent);font-size:28px}nav{display:grid;gap:6px}nav button{border-color:transparent;background:transparent;text-align:left;padding-left:14px;color:var(--muted);display:flex;align-items:center;gap:10px}nav button.active{background:var(--paper);border-color:var(--line);color:var(--ink)}.device{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;font-size:12px}.device small{display:block;color:var(--muted)}.window-bar{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:end;padding:0 24px;font-size:12px;color:var(--muted)}main{overflow:auto;padding:27px 30px;min-width:0}footer{display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}h1{font-size:24px;line-height:1.4;margin:0;font-weight:650}h2{font-size:17px;margin:0}h3{font-size:20px;line-height:1.5;margin:0 0 14px}h1,h2,h3{text-wrap:balance}p{margin:0 0 14px;overflow-wrap:anywhere}.page-head{display:flex;justify-content:space-between;align-items:center}.count,.subtitle{color:var(--muted);font-size:12px}.subtitle{margin:6px 0 0}.wizard{border:1px solid var(--line);border-radius:12px;max-width:700px;margin:24px auto 0;padding:24px 28px}.steps{display:flex;gap:12px;margin:22px 0 24px;padding:0 0 22px;border-bottom:1px solid var(--line);list-style:none}.steps li{display:flex;gap:8px;align-items:center;flex:1;color:var(--muted);font-size:12px}.steps li:not(:last-child):after{content:'';height:1px;background:var(--line);flex:1}.steps span{width:25px;height:25px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.steps [aria-current=step]{font-weight:600;color:var(--ink)}.steps [aria-current=step] span{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.steps .done span{border-color:var(--good);color:var(--good)}.body{min-height:290px}.body>p{color:var(--muted);font-size:13px}.result{display:flex;align-items:start;gap:12px;background:var(--panel);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:16px;margin:18px 0}.result.good{background:var(--good-bg);border-color:var(--good)}.result.bad{background:var(--danger-bg);border-color:var(--danger)}.result.warn{background:var(--warning-bg)}.result strong{font-size:15px;display:block;margin-bottom:6px}.result p{font-size:13px;color:var(--muted);margin:0;line-height:1.8}.result-icon{width:21px;height:21px;flex:none;color:var(--accent);margin-top:2px}.good .result-icon{color:var(--good)}.bad .result-icon{color:var(--danger)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.spinner{border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button{min-height:40px}.secondary{border-top:1px solid var(--line);padding-top:16px;margin-top:24px}.secondary p{font-size:12px;color:var(--muted);margin-bottom:6px}.identity{display:grid;grid-template-columns:80px 1fr;gap:10px;font-size:13px;margin:20px 0}.identity dt{color:var(--muted)}.identity dd{margin:0;overflow-wrap:anywhere}.note{color:var(--muted);font-size:12px;margin-top:16px}.change{display:inline-block;margin-left:8px;padding:1px 6px;border:1px dashed var(--review);border-radius:4px;font-size:11px;font-weight:500;color:var(--review);background:var(--review-bg);vertical-align:middle;white-space:nowrap}.no-marks .change,.no-marks .review-only{display:none}.evidence{margin:16px 0;color:var(--muted);font-size:12px}.evidence p{margin-top:8px;background:var(--panel);padding:12px;border-radius:6px}.field{display:grid;gap:8px;font-size:13px;margin:18px 0}.field input{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:10px}.overview{margin-top:24px;padding:24px;border:1px solid var(--line);border-radius:10px}.skip{position:absolute;left:24px;top:-100px;background:var(--paper);padding:8px;z-index:3}.skip:focus{top:8px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:870px){body{padding:14px 12px}.app{margin-left:0}.toolbar{gap:10px}}.narrow main{padding:24px}.narrow .wizard{padding:22px}.narrow .steps{gap:8px}
</style>
</head>
<body>
<a class="skip" href="#content">跳到应用预览</a>
<div class="toolbar" aria-label="预览工具栏">
<label>场景 <select id="scene"></select></label>
<label>外观 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<label>窗口 <select id="size"><option value="wide">1080 × 700</option><option value="narrow">820 × 680</option></select></label>
<label><input id="marks" type="checkbox" checked>显示修改标注</label>
<button id="reset">重置场景</button>
</div>
<p class="hint" id="hint"></p>
<div class="stage"><div class="app" id="app">
<aside><div class="brand"><span class="bee-mark" aria-hidden="true">⬡</span>Bee</div><nav aria-label="应用导航"><button id="overview-nav">概览</button><button id="accounts-nav" class="active" aria-current="page">AI 账号</button></nav><div class="device">Bee Desktop<small>示例设备</small></div></aside>
<header class="window-bar">OpenAI 账号接入</header>
<main id="content" tabindex="-1"></main>
<footer><span>授权信息保留在本机</span><span>交互评审稿 · 模拟数据</span></footer>
</div></div><div class="sr" role="status" aria-live="polite" aria-atomic="true" id="announcement"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const scenes={
 ready:['登录流程','连接账号 · 点击后自动演示','methods','点击登录，预设依次展示启动、等待、核验与成功；最后仍需你确认接入。'],
 starting:['登录流程','正在启动登录','starting','点击后立即有反馈；本次登录未结束时不能重复发起。'],
 waiting:['登录流程','等待官方登录','waiting','Bee 自动查询本次结果；可取消，也可切到概览后回来。'],
 verifying:['登录流程','正在读取并核验','verifying','官方登录已完成，Bee 正在读取本机账号信息；还不能确认接入。'],
 success:['登录结果','登录成功 · 尚未接入','success','新增常驻成功结果；点击确认接入才会加入 Bee。本场景预设有历史暂停。'],
 returned:['登录结果','从确认页返回 · 保留成功','returned','返回不会清掉登录成功；继续时重新核验，再回到第三步。'],
 failed:['登录结果','登录失败 · 原操作已结束','failed','失败原因常驻；只在已确认结束后提供重新登录。'],
 startFailed:['登录结果','启动失败 · 权限被拒绝','startFailed','明确未启动，保留失败原因与处理方式。'],
 unavailable:['登录结果','登录已完成 · 文件读取失败','unavailable','不能误报账号可用；修正读取位置后重新核验。'],
 invalid:['登录结果','登录已完成 · 账号核验失败','invalid','已读到文件但缺少账号标识；不显示确认接入。'],
 queryAuto:['结果待确认','自动查询中','queryAuto','只查询原登录；此时既不宣称成功，也不允许重复登录。'],
 queryStopped:['结果待确认','自动查询已停止','queryStopped','明确查询已停止；继续查询沿用同一次登录。'],
 cancelling:['取消登录','正在确认取消结果','cancelling','取消请求发出不等于已经结束；确认前不能重新登录。'],
 cancelUnknown:['取消登录','取消结果待确认','cancelUnknown','取消回包丢失后保留本次操作；先继续查询，不重新登录。'],
 cancelled:['取消登录','本次登录已取消','cancelled','明确显示取消结果；离开账号页再回来仍保留。'],
 source:['恢复与接入','设置读取位置','source','示例目录仅用于演示；保存后读取并核验，不访问真实文件。'],
 rechecking:['恢复与接入','重新核验中','rechecking','保留已完成登录的事实；核验结束前不允许确认接入。'],
 submitting:['恢复与接入','正在接入账号','submitting','用户已确认，正在保存接入结果；不可重复提交。'],
 accepted:['恢复与接入','已接入 · 保留暂停','accepted','示例预设存在历史暂停；接入完成不自动恢复接单。']
};
let state='success',start='success',page='accounts',timers=[],epoch=0,source='/Users/demo/.codex',sourceReturn='unavailable';
const params=new URLSearchParams(location.search);
start=scenes[params.get('scene')]?params.get('scene'):'success';state=scenes[start][2];
for(const k of ['theme','size'])if([...$(k).options].some(x=>x.value===params.get(k)))$(k).value=params.get(k);
$('marks').checked=params.get('marks')!=='off';
for(const group of new Set(Object.values(scenes).map(x=>x[0]))){const g=document.createElement('optgroup');g.label=group;for(const [key,v] of Object.entries(scenes))if(v[0]===group)g.append(new Option(v[1],key));$('scene').append(g)}
function icon(kind){const paths={check:'<path d="m4 10 4 4 9-9"/>',alert:'<circle cx="10" cy="10" r="8"/><path d="M10 6v5m0 3h.01"/>',clock:'<circle cx="10" cy="10" r="8"/><path d="M10 5v5l3 2"/>',cross:'<circle cx="10" cy="10" r="8"/><path d="m7 7 6 6m0-6-6 6"/>'};return '<svg aria-hidden="true" class="result-icon" viewBox="0 0 20 20">'+paths[kind]+'</svg>'}
function mark(text){return '<span class="change">'+text+'</span>'}
function button(label,action,primary=false){return '<button data-action="'+action+'" class="'+(primary?'primary':'quiet')+'">'+label+'</button>'}
function actions(...items){return '<div class="actions">'+items.join('')+'</div>'}
function result(title,copy,kind='clock',tone='',tag='新增'){return '<div class="result '+tone+'">'+(kind==='spin'?'<span class="result-icon spinner" aria-hidden="true"></span>':icon(kind))+'<div><strong>'+title+mark(tag)+'</strong><p>'+copy+'</p></div></div>'}
function evidence(text){return '<details class="evidence"><summary>查看错误详情</summary><p>'+text+'</p></details>'}
function identity(){return '<dl class="identity"><dt>账号标识</dt><dd>demo-account-7f3a</dd><dt>套餐</dt><dd>Plus</dd></dl>'}
function clearWork(){epoch++;timers.forEach(clearTimeout);timers=[]}
function later(ms,fn){const version=epoch;timers.push(setTimeout(()=>{if(version===epoch)fn()},ms))}
function presentation(){document.documentElement.dataset.theme=$('theme').value;$('app').classList.toggle('narrow',$('size').value==='narrow');document.body.classList.toggle('no-marks',!$('marks').checked);remember()}
function remember(){const u=new URL(location.href);u.search=new URLSearchParams({scene:start,theme:$('theme').value,size:$('size').value,marks:$('marks').checked?'on':'off'});history.replaceState(null,'',u)}
function go(next,focus=false){const hadFocus=$('content').contains(document.activeElement);state=next;render();if((focus||hadFocus)&&page==='accounts')$('view-title')?.focus({preventScroll:true})}
function reset(){clearWork();state=scenes[start][2];page='accounts';source='/Users/demo/.codex';sourceReturn='unavailable';render();remember()}
function render(){
 const match=Object.keys(scenes).find(k=>scenes[k][2]===state)||start;$('scene').value=match;
 $('hint').textContent='待评审 · 全部为模拟数据。'+scenes[match][3]+' 直接选中的场景停留供查看。';
 $('accounts-nav').classList.toggle('active',page==='accounts');$('overview-nav').classList.toggle('active',page==='overview');
 for(const p of ['accounts','overview']){if(page===p)$(p+'-nav').setAttribute('aria-current','page');else $(p+'-nav').removeAttribute('aria-current')}
 const accepted=state==='accepted';
 if(page==='overview'){$('content').innerHTML='<h1 id="view-title" tabindex="-1">概览</h1><section class="overview"><h2>Bee Desktop</h2><p class="note">'+(accepted?'OpenAI 已接入，当前暂停接单。':'尚未接入 AI 账号。登录进展和结果保留在 AI 账号页。')+'</p>'+button('查看 AI 账号','accounts',true)+'</section>';$('announcement').textContent='已切换到概览；本次登录状态保留。';return}
 let title='连接 OpenAI 账号',body='',step=2;
 if(state==='methods')body='<p>通过 Codex 完成官方登录，Bee 会自动读取并核验账号。</p>'+actions(button('登录 OpenAI','login',true))+'<div class="secondary"><p>已在其他位置登录？</p>'+button('设置读取位置','source')+'</div>';
 if(['starting','waiting','verifying','rechecking','cancelling','submitting'].includes(state)){
 const copy={starting:['正在启动 OpenAI 登录…','Bee 正在启动 Codex。取得登录进展后，这里会自动更新。'],waiting:['等待你完成 OpenAI 登录','请在官方登录页面完成操作。Bee 正在自动检查本次结果，无需再次点登录。'],verifying:['正在读取并核验账号…','官方登录已完成。Bee 正在检查本机账号信息，完成后会自动显示结果。'],rechecking:['正在重新核验账号…','Bee 正在重新读取本机登录信息。核验通过后，你可以确认接入。'],cancelling:['正在取消本次登录…','Bee 已请求取消，正在确认登录进程是否结束。确认前不能重新登录。'],submitting:['正在接入 OpenAI 账号…','你已确认接入，Bee 正在保存接入结果。请勿重复提交。']}[state];
 body=result(copy[0],copy[1],'spin','',state==='cancelling'?'新增':'修改');
 if(['starting','waiting'].includes(state))body+=actions(button('取消本次登录','cancel'));
 if(state==='submitting'){title='确认接入 OpenAI 账号';step=3}
 }
 if(['success','returned'].includes(state)){
 title=state==='success'?'确认接入 OpenAI 账号':'已连接 OpenAI 账号';step=state==='success'?3:2;
 body=result('登录成功，尚未接入 Bee','Bee 已读取并核验本机账号信息。请确认下面的账号，再点击“确认接入”。','check','good')+identity()+'<p>接入后保留原有暂停选择，不会自动恢复接单。</p>'+actions(...(state==='success'?[button('确认接入','submit',true),button('返回','back')]:[button('继续使用此账号','recheck',true)]));
 }
 if(state==='failed')body=result('本次登录失败','Codex 登录进程异常退出，未完成本次登录。原操作已结束，可以重新登录。','alert','bad')+evidence('失败环节：官方登录进程；退出码：1；要求：进程成功退出后才能读取并核验本次账号。')+actions(button('重新登录','login',true));
 if(state==='startFailed')body=result('未能启动 OpenAI 登录','电脑拒绝运行 Codex，本次登录尚未启动。请检查 Codex 的执行权限后重试。','alert','bad')+evidence('失败环节：启动 Codex；系统返回：EACCES（权限被拒绝）；未创建登录进程。')+actions(button('重新登录','login',true));
 if(['unavailable','invalid'].includes(state)){
 const missing=state==='unavailable';body=result('登录已完成，但账号尚不可用',missing?'Bee 无法读取账号：当前目录中未找到登录文件。请核对 Codex 实际保存登录信息的位置。':'Bee 已读取登录文件，但文件缺少账号标识，尚不能确认接入。请在 Codex 完成账号信息修复后重新核验。','alert','warn')+evidence(missing?'失败环节：读取登录文件；路径：/Users/demo/.codex/auth.json；系统返回：ENOENT（文件不存在）。官方登录进程已成功退出。':'失败环节：本机账号结构核验；检查结果：account_id 缺失；要求：账号标识完整。官方登录进程已成功退出。')+actions(button(missing?'设置读取位置':'重新核验',missing?'source':'recheck',true),...(missing?[button('重新核验','recheck')]:[]));
 }
 if(['queryAuto','queryStopped','cancelUnknown'].includes(state)){
 const auto=state==='queryAuto',cancel=state==='cancelUnknown';body=result(cancel?'取消结果待确认':'登录结果待确认',auto?'Bee 尚未收到明确结果，正在自动查询本次登录。确认前不会发起另一轮登录。':cancel?'Bee 已发出取消请求，但未收到确认回包。自动查询已停止，请继续查询本次结果。':'Bee 查询本次登录时连接中断，自动查询已停止。继续查询会沿用本次操作，不会重新登录。',auto?'spin':'clock','warn','修改');
 if(!auto)body+=evidence(cancel?'失败环节：读取取消结果；请求已发出，回包丢失；尚未证明登录进程已结束。':'失败环节：查询本次登录结果；连接中断（connection_reset）；尚未取得成功、失败或取消的终态。')+actions(button('继续查询本次结果',cancel?'queryCancel':'query',true));
 }
 if(state==='cancelled')body=result('本次登录已取消','Bee 已确认本次登录进程结束，未接入账号。你可以重新登录。','cross')+actions(button('重新登录','login',true));
 if(state==='source'){title='设置读取位置';body='<p>填写 Codex 保存登录信息的目录。保存后 Bee 将重新读取并核验账号。</p><form id="source-form"><label class="field">读取目录<input id="source-input" name="directory" autocomplete="off" spellcheck="false" required></label><p class="note">本预览不会读取真实目录；保存后按预设演示核验成功。</p>'+actions('<button class="primary" type="submit">保存并重新核验</button>',button('返回','sourceBack'))+'</form>'}
 if(accepted){title='OpenAI 账号已接入';body=result('已接入 Bee · 暂停接单','已保留原有暂停选择。接入账号不会自动恢复接单。','check','good','沿用已有')+identity();step=3}
 $('content').innerHTML='<div class="page-head"><h1>AI 账号</h1><span class="count">'+(accepted?'1':'0')+' 个已接入</span></div><p class="subtitle">接入本机账号，管理平台接单。</p><section class="wizard" aria-label="添加账号"><h2>'+(accepted?'OpenAI':'添加账号')+'</h2>'+(!accepted?'<ol class="steps" aria-label="添加账号步骤">'+['选择平台','连接账号','确认接入'].map((s,i)=>'<li '+(i+1===step?'aria-current="step"':'')+' class="'+(i+1<step?'done':'')+'"><span aria-hidden="true">'+(i+1<step?'✓':i+1)+'</span>'+s+'</li>').join('')+'</ol>':'<div class="secondary"></div>')+'<div class="body"><h3 id="view-title" tabindex="-1">'+title+'</h3>'+body+'</div></section><p class="note review-only">'+mark('修改')+'切换页面后仍保留本次进展和结果。</p>';
 if(state==='source')$('source-input').value=source;
 $('announcement').textContent=$('content').querySelector('.result strong')?.textContent||title;
}
function login(){clearWork();go('starting');later(1100,()=>go('waiting'));later(5500,()=>go('verifying'));later(7300,()=>go('success'))}
function recheck(){clearWork();go('rechecking');later(1600,()=>go('success'))}
$('content').addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 switch(action){case 'login':login();break;case 'cancel':clearWork();go('cancelling');later(1500,()=>go('cancelled'));break;case 'query':clearWork();go('queryAuto');later(1800,()=>go('success'));break;case 'queryCancel':clearWork();go('cancelling');later(1800,()=>go('cancelled'));break;case 'submit':clearWork();go('submitting');later(1500,()=>go('accepted'));break;case 'back':go('returned',true);break;case 'recheck':recheck();break;case 'source':sourceReturn=state;go('source',true);break;case 'sourceBack':go(sourceReturn,true);break;case 'accounts':page='accounts';render();$('view-title')?.focus();break;}
});
$('content').addEventListener('input',e=>{if(e.target.id==='source-input')source=e.target.value});
$('content').addEventListener('submit',e=>{if(e.target.id==='source-form'){e.preventDefault();recheck()}});
for(const p of ['accounts','overview'])$(p+'-nav').onclick=()=>{page=p;render();$('view-title')?.focus({preventScroll:true})};
$('scene').onchange=()=>{start=$('scene').value;reset()};$('reset').onclick=reset;
$('theme').onchange=presentation;$('size').onchange=presentation;$('marks').onchange=presentation;
reset();presentation();
</script>
</body></html>
