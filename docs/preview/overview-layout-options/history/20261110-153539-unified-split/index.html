<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bee · 概览布局候选（待评审）</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#30312e;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body.dark{background:#141619;color:#e5e4df;color-scheme:dark}.studio{padding:20px 24px 24px}.toolbar{display:flex;gap:18px;align-items:end;flex-wrap:wrap;max-width:1100px;margin:0 auto}.toolbar a{color:#805a20}.dark .toolbar a{color:#d2af75}.toolbar a:focus-visible{outline:2px solid currentColor;outline-offset:3px}.toolbar label{max-width:100%;display:flex;align-items:center;gap:8px;color:#63666b;font-size:12px}.toolbar select{min-width:0;max-width:100%}#flow{width:180px}#scene{width:300px}.dark .toolbar label,.dark .hint{color:#b4b7bb}select,button{font:inherit;color:inherit;background:#fff;border:1px solid #cfd3d8;border-radius:6px;min-height:34px;padding:5px 10px}button{cursor:pointer}.dark select,.dark button{background:#242421;border-color:#45433d}select:focus-visible,button:focus-visible{outline:2px solid #805a20;outline-offset:3px}.hint{max-width:1100px;margin:13px auto 18px;color:#62666d;min-height:21px;font-size:12px}.stage{overflow:auto;padding:2px 2px 10px}iframe{display:block;width:1080px;height:700px;margin:0 auto;border:1px solid #d4d6d9;border-radius:10px;background:white;box-shadow:0 8px 35px #2233440b}iframe.narrow{width:820px;height:680px}.dark iframe{border-color:#45433d}@media(max-width:870px){.studio{padding:14px 12px}.stage iframe{margin-left:0}.toolbar{gap:10px}}

.toolbar{gap:14px}.toolbar #variant{width:230px}.toolbar a{margin-left:auto}.hint strong{color:inherit}</style>
<div class="studio"><div class="toolbar"><label>布局<select id="variant"><option value="1">01 · 留白分层</option><option value="2">02 · 左右对照</option><option value="3">03 · 一体面板</option><option value="4">04 · 设备为主</option><option value="5">05 · 紧凑横栏</option><option value="6" selected>06 · 左右一体面板（推荐）</option></select></label><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>窗口<select id="size"><option value="narrow">紧凑 · 820 × 680</option><option value="wide">宽屏 · 1080 × 700</option></select></label><button id="reset">重置场景</button><a href="http://127.0.0.1:1496/index.html">已认可主预览</a></div><p class="hint" id="hint"></p><div class="stage"><iframe id="screen" title="Bee 概览局部布局 · 模拟数据"></iframe></div></div>
<script>
const css=`*{box-sizing:border-box}html,body{height:100%;margin:0}html{--paper:#fff;--side:#f7f6f3;--panel:#f8f7f4;--ink:#2c2b28;--muted:#777770;--line:#eae7e1;--accent:#956d32;--good:#4b7860;--warn:#a37732;color-scheme:light}html.dark{--paper:#20211f;--side:#272824;--panel:#292a26;--ink:#e5e3dc;--muted:#a6a79d;--line:#3d3e37;--accent:#d2af75;--good:#92b8a0;--warn:#d2af75;color-scheme:dark}body{font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--ink);background:var(--paper)}.shell{height:100%;display:grid;grid-template-columns:178px minmax(0,1fr);grid-template-rows:52px 1fr 32px}.sidebar{grid-row:1/4;background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:650;display:flex;align-items:center;gap:10px;margin:0 12px 34px}.brand svg{width:26px;height:26px}.nav{display:grid;gap:8px}.nav div{padding:9px 13px;display:flex;align-items:center;gap:11px;color:var(--muted)}.nav .active{background:var(--paper);color:var(--accent);border-radius:6px;font-weight:600}.nav svg{width:16px;height:16px}.sidebar small{margin-top:auto;padding:0 12px;color:var(--muted)}header{border-bottom:1px solid var(--line);padding:16px 28px;color:var(--muted);text-align:right;font-size:11px}main{padding:28px 29px;overflow:auto}h1{font-size:24px;line-height:1.3;margin:0 0 30px;font-weight:600;letter-spacing:-.5px}h2{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.3px;margin:0}p{margin:0}.muted{color:var(--muted)}.status{display:flex;gap:15px;align-items:flex-start}.mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--accent);flex:none}.mark svg{width:19px;height:19px}.health{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:12px;margin-top:9px}.health span{display:flex;align-items:center;gap:6px}.dot{width:5px;height:5px;background:var(--good);border-radius:50%;display:inline-block}.facts{display:grid;grid-template-columns:1fr 1.2fr 1.15fr;gap:20px;margin:0}.facts div{min-width:0}.facts dt{font-size:11px;color:var(--muted);margin-bottom:7px}.facts dd{margin:0;font-size:13px;overflow-wrap:anywhere}.facts dd small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.v1 .facts{margin-top:30px;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.v1 .status{padding:4px 0 0}.v6{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;border:1px solid var(--line);border-radius:10px;padding:28px;background:var(--paper)}.v6 .status{display:block;padding:3px 0}.v6 .mark{margin-bottom:18px}.v6 h2{max-width:230px;font-size:20px;line-height:1.6}.v6 .health{display:grid;gap:5px;margin-top:17px}.v6 .facts{grid-template-columns:1fr;gap:20px;border-left:1px solid var(--line);padding-left:27px}.v6 .facts dt{margin-bottom:4px}.v2{display:grid;grid-template-columns:1.1fr 1fr;gap:25px}.v2 .status{display:block;padding:7px 0}.v2 .mark{margin-bottom:15px}.v2 h2{max-width:220px}.v2 .facts{border-left:1px solid var(--line);padding-left:26px;grid-template-columns:1fr;gap:18px}.v3{border:1px solid var(--line);border-radius:10px;overflow:hidden}.v3 .status{padding:24px}.v3 .facts{border-top:1px solid var(--line);padding:20px 24px;background:var(--panel)}.v4 .device-top{display:flex;gap:13px;align-items:center;margin-bottom:24px}.v4 .device-top h2{font-size:21px}.v4 .device-top p{font-size:11px;color:var(--muted)}.v4 .facts{grid-template-columns:1fr 1fr;padding-left:51px;margin-bottom:25px}.v4 .status{border-top:1px solid var(--line);padding-top:22px}.v4 .status h2{font-size:16px}.v4 .status .mark{display:none}.v5 .status{align-items:center;gap:11px;border-bottom:1px solid var(--line);padding:0 0 18px}.v5 .status h2{font-size:16px}.v5 .mark{width:30px;height:30px}.v5 .health{margin-top:5px;gap:12px;font-size:11px}.v5 .facts{padding-top:20px;gap:12px}.v5 .facts dt{margin-bottom:4px}.v5 .facts div+div{border-left:1px solid var(--line);padding-left:16px}footer{border-top:1px solid var(--line);padding:7px 29px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}.continuation{margin-top:34px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:12px}.blank{height:62px;border-bottom:1px solid var(--line);opacity:.4}@media(max-width:850px){.v6{padding:24px;gap:22px}.v6 h2{font-size:19px}.v6 .facts{padding-left:23px}.v2{grid-template-columns:1fr 1fr;gap:20px}.v2 h2{font-size:18px}.facts{gap:14px}.v3 .status,.v3 .facts{padding:20px}.v5 .facts{grid-template-columns:1fr 1fr 1fr}.v5 .facts dd{font-size:12px}}`;
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${({home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',settings:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>',device:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',logo:'<path d="m12 2 9 5v10l-9 5-9-5V7Z M3 9h18M3 15h18"/>'})[name]}</svg>`;
const health='<div class="health"><span><i class="dot"></i>Bee 运行中</span><span><i class="dot"></i>Hive 已连接</span></div>';
const status=`<div class="status"><div class="mark">${icon('pulse')}</div><div><h2>1 个平台可接单，1 个需处理</h2>${health}</div></div>`;
const fact=(label,value)=>`<div><dt>${label}</dt><dd>${value}</dd></div>`;
const facts=`<dl class="facts">${fact('本机设备','我的 Mac')}${fact('归属账号','d***@邮箱')}${fact('Hive','hive.example')}</dl>`;
const notes=['留白分层：主状态优先，设备信息用细线自然分区。','左右对照：左边看运行，右边看设备；纵向更集中。','一体面板：将运行与设备收在同一块，边界更清晰。','设备为主：先确认当前设备，再看运行与平台摘要。','紧凑横栏：压缩顶部高度，为下方账号列表留出更多空间。','左右一体面板：保留方案 2 的左右布局，采用方案 3 的统一边框；左侧突出状态，右侧集中设备信息。'];
const controls=['variant','theme','size'].map(id=>document.getElementById(id));let origin;
function render(){const [v,t,s]=controls.map(e=>e.value);document.body.classList.toggle('dark',t==='dark');screenEl.className=s;document.getElementById('hint').textContent=notes[+v-1]+' 本页仅比较概览顶部布局，全部为模拟数据；下方只标示账号区位置。';const content=v==='4'?`<div class="device-top"><span class="mark">${icon('device')}</span><div><p>本机设备</p><h2>我的 Mac</h2></div></div><dl class="facts">${fact('归属账号','d***@邮箱')}${fact('Hive','hive.example')}</dl>${status}`:status+facts;screenEl.srcdoc=`<!doctype html><html lang="zh-CN" class="${t}"><meta charset="utf-8"><style>${css}</style><div class="shell"><aside class="sidebar"><div class="brand">${icon('logo')}Bee</div><div class="nav" aria-label="导航位置示意"><div class="active">${icon('home')}概览</div><div>${icon('users')}AI 账号</div><div>${icon('pulse')}诊断</div><div>${icon('settings')}设置</div></div><small>hive.example</small></aside><header>本机设备</header><main><h1>概览</h1><section class="v${v}" aria-label="运行与设备摘要">${content}</section><div class="continuation">AI 账号</div><div class="blank" aria-hidden="true"></div><div class="blank" aria-hidden="true"></div></main><footer><span>Bee</span><span>按平台管理接单</span></footer></div></html>`;const q=new URLSearchParams({variant:v,theme:t,size:s});history.replaceState(null,'','?'+q)}
const screenEl=document.getElementById('screen');const params=new URLSearchParams(location.search);controls.forEach(e=>{if([...e.options].some(o=>o.value===params.get(e.id)))e.value=params.get(e.id);e.addEventListener('change',()=>{if(e.id==='variant')origin=e.value;render()})});origin=controls[0].value;document.getElementById('reset').onclick=()=>{controls[0].value=origin;render()};render();
</script></html>
