function accountRows(v){const identity=(name,id,plan)=>`<div class="identity"><span class="platform-logo" aria-hidden="true">${name==='OpenAI'?'◇':'✳'}</span><div><h3>${name}${plan?`<span class="plan">${plan}</span>`:''}</h3><small>账号 ${id}</small></div></div>`;const condition=(bad)=>`<div class="condition-block"><p class="condition"><i class="dot ${bad?'warn':''}"></i>${bad?'授权已过期':paused?'已暂停接单':'可接单'}</p><p class="choice">${bad?'当前不能接单 · 接单选择：允许':paused?'接单选择：暂停':'接单选择：允许'}</p></div>`;const quota=`<div class="quota"><div class="quota-window"><div class="quota-label"><span>5 小时</span><span>已用 32%</span></div><div class="bar"><span></span></div></div><div class="quota-window"><div class="quota-label"><span>7 日</span><span>已用 18%</span></div><div class="bar"><span style="width:18%"></span></div></div></div>`;return `<div class="layout${v}"><div class="account-heading"><h2>AI 账号</h2><button data-action="manage">管理账号 ›</button></div><div class="account-list">${[true,false].map(bad=>{const id=identity(bad?'OpenAI':'Claude',bad?'ab12…':'cd34…',bad?'':'Pro');const body=condition(bad);const right=`<div class="account-right">${bad?'':quota}<div class="account-actions"><button class="${bad?'primary':''}" data-action="${bad?'repair':'pause'}">${bad?'前往账号处理':paused?'允许接单':'暂停接单'}</button></div></div>`;return `<section class="account-row ${bad?'problem':'normal'}" aria-label="${bad?'OpenAI':'Claude'} 账号">${v==='4'?id+`<div class="account-body">${body}${right}</div>`:`<div class="account-left">${id}${body}</div>${right}`}</section>`}).join('')}</div></div>`}
function dialogHTML(){if(!dialog)return '';const isPause=dialog==='pause';return `<div class="review-overlay"><section class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${isPause?(paused?'允许 Claude 接单':'暂停 Claude 接单'):'AI 账号 · '+(dialog==='repair'?'OpenAI':'账号管理')}</h2><p>${isPause?(paused?'允许接收新任务；能否接单仍取决于实际条件。':'暂停后不再接收新任务。'):'已模拟定位到账号页'+(dialog==='repair'?'的 OpenAI。':'。')+'本候选仅评审概览排版，账号恢复流程沿用已确认方案。'}</p><div class="account-actions"><button data-action="close">${isPause?'取消':'关闭预览提示'}</button>${isPause?'<button class="primary" data-action="confirm">确认</button>':''}</div></section></div>`}
function render(){const [v,t,s]=controls.map(e=>e.value);document.body.classList.toggle('dark',t==='dark');screenEl.className=s;document.getElementById('hint').textContent=accountNotes[+v-1]+' 顶部固定为已选 08；全部为模拟数据。账号入口仅演示定位提示，接单选择可模拟切换。';const content=alternatives[8].replace('可接单<strong>1</strong>','可接单<strong>'+(paused?0:1)+'</strong>');screenEl.srcdoc=`<!doctype html><html lang="zh-CN" class="${t}"><meta charset="utf-8"><style>${css}${extraCSS}${accountCSS}</style><div class="shell"><aside class="sidebar"><div class="brand">${icon('logo')}Bee</div><div class="nav" aria-label="导航位置示意"><div class="active">${icon('home')}概览</div><div>${icon('users')}AI 账号</div><div>${icon('pulse')}诊断</div><div>${icon('settings')}设置</div></div><small>hive.example</small></aside><header>本机设备</header><main><h1>概览</h1><section class="v8 unified split" aria-label="运行与设备摘要">${content}</section>${accountRows(v)}</main><footer><span>Bee</span><span>按平台管理接单</span></footer></div>${dialogHTML()}</html>`;history.replaceState(null,'','?'+new URLSearchParams({variant:v,theme:t,size:s}));screenEl.onload=()=>{const d=screenEl.contentDocument;d.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='confirm'){paused=!paused;dialog=null}else if(a==='close')dialog=null;else dialog=a;render()});d.onkeydown=e=>{if(e.key==='Escape'&&dialog){dialog=null;render()}if(e.key==='Tab'&&dialog){const bs=[...d.querySelectorAll('.review-dialog button')];if(e.shiftKey&&d.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus()}else if(!e.shiftKey&&d.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus()}}};if(dialog)d.querySelector('.review-dialog button')?.focus()};}
const screenEl=document.getElementById('screen');const params=new URLSearchParams(location.search);controls.forEach(e=>{if([...e.options].some(o=>o.value===params.get(e.id)))e.value=params.get(e.id);e.addEventListener('change',()=>{if(e.id==='variant'){origin=e.value;paused=false;dialog=null}render()})});origin=controls[0].value;document.getElementById('reset').onclick=()=>{controls[0].value=origin;paused=false;dialog=null;render()};render();
</script></html>
