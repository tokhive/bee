<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bee · S2 设置页三版预览</title>
  <link rel="stylesheet" href="../../desktop/src/styles/tokens.css">
  <link rel="stylesheet" href="bee-s2-diagnostics-prototype/style.css">
  <link rel="stylesheet" href="bee-s2-settings-prototype/style.css">
</head>
<body>
  <!-- Three settings layouts in the approved Bee shell; ?variant=A|B|C.
       Throwaway preview, fixture data and memory-only actions. No native API. -->
  <div class="viewer">
    <header class="review-header">
      <div><strong>Bee <span>/</span> 设置页布局</strong><small id="review-label"></small></div>
      <div class="review-controls">
        <label>场景 <select id="scene"><option value="pending">代理等待应用</option><option value="blocked">通知未允许</option><option value="unpaired">尚未配对</option></select></label>
        <button id="theme" class="icon-button" aria-label="切换深色主题"></button>
      </div>
    </header>
    <div class="app-frame">
      <aside class="sidebar">
        <div class="brand"><img src="../../desktop/src/assets/app-icon-dark.svg" alt=""><span>Bee</span></div>
        <nav aria-label="主导航" id="app-navigation"></nav>
        <div class="side-bottom"><div class="side-state"><span><i class="dot good-dot"></i>dev.tokhive.ai</span><small id="connection-label">本机 Bee 已连接</small></div><div class="local-user"><span class="avatar" id="device-icon"></span><div>Bee Desktop<small>本机设备</small></div></div></div>
      </aside>
      <div class="workspace">
        <header class="toolbar"><span id="toolbar-device"></span></header>
        <main class="settings-main">
          <div class="page-heading"><div><h1>设置</h1><p>管理本机的使用偏好、系统提醒与网络连接。</p></div><button class="button" data-action="hive">打开 Hive 控制台 <span id="external-icon"></span></button></div>
          <div id="settings-navigation"></div>
          <div id="settings-content" class="page-panel" tabindex="0" aria-label="设置内容"></div>
        </main>
        <footer><span id="footer-status"><i class="dot good-dot"></i>Hive 已连接</span><span>Bee Desktop</span></footer>
      </div>
    </div>
    <div class="review-note"><span id="variant-description"></span><span>设计预览 · 示例数据，操作仅模拟</span></div>
  </div>
  <nav class="prototype-switcher" aria-label="切换布局方案"><button id="previous" aria-label="上一版">←</button><div id="variant-buttons"></div><button id="next" aria-label="下一版">→</button></nav>
  <dialog class="settings-drawer" id="detail-dialog" aria-labelledby="drawer-title"><div class="drawer-heading"><div><h2 id="drawer-title"></h2><p id="drawer-description"></p></div><button class="icon-button" data-action="close-detail" aria-label="关闭详情">×</button></div><div id="drawer-content" class="drawer-content"></div></dialog>
  <dialog id="restart-dialog" aria-labelledby="restart-title"><form method="dialog"><div class="dialog-heading"><h2 id="restart-title">应用保存的代理？</h2><button class="icon-button" aria-label="关闭">×</button></div><p class="dialog-description">将停止当前贡献，可能中断任务；随后按此前运行选择恢复，保留平台暂停和待确认换号。</p><div class="restart-values" id="restart-values"></div><div class="dialog-actions"><button class="button" value="cancel">暂不应用</button><button class="button danger-solid" value="confirm">停止并重新启动</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="bee-s2-settings-prototype/preview.js"></script>
</body>
</html>
